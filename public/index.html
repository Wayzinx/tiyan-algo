:root {
  --paper: #F1F4EF;
  --grid: #E2E8DF;
  --surface: #FBFCFA;
  --surface-2: #EBF0E9;
  --ink: #1B2632;
  --ink-2: #4E5C6A;
  --ink-3: #82909C;
  --line: #CCD6CA;
  --accent: #2A4FA3;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E8F7;
  --red: #BB3A2C;
  --red-soft: #F7E3DF;
  --green: #2B7649;
  --green-soft: #DFEFE4;
  --amber: #9A620A;
  --amber-soft: #F5EBD3;
  --hl: rgba(240, 214, 90, .45);
  --syn-kw: #7A3E9D;
  --syn-def: #2A4FA3;
  --syn-str: #2B7649;
  --syn-num: #A0560A;
  --syn-com: #8593A0;
  --syn-builtin: #0F6E79;
  --shadow: 0 1px 2px rgba(27, 38, 50, .06), 0 6px 18px rgba(27, 38, 50, .06);
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --brush: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --r: 8px;
  --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #161F1C;
    --grid: #1D2824;
    --surface: #1C2622;
    --surface-2: #22302B;
    --ink: #E3EAE2;
    --ink-2: #A7B4AC;
    --ink-3: #73817A;
    --line: #33423C;
    --accent: #93B3FF;
    --accent-ink: #0E1A33;
    --accent-soft: #233150;
    --red: #FF8E7F;
    --red-soft: #3F2623;
    --green: #7BD09B;
    --green-soft: #1E3A2A;
    --amber: #E8B860;
    --amber-soft: #3A2F1A;
    --hl: rgba(232, 200, 80, .22);
    --syn-kw: #D6A7F0;
    --syn-def: #93B3FF;
    --syn-str: #8ED5A7;
    --syn-num: #F0B96E;
    --syn-com: #74827A;
    --syn-builtin: #7FD2DB;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #161F1C;
  --grid: #1D2824;
  --surface: #1C2622;
  --surface-2: #22302B;
  --ink: #E3EAE2;
  --ink-2: #A7B4AC;
  --ink-3: #73817A;
  --line: #33423C;
  --accent: #93B3FF;
  --accent-ink: #0E1A33;
  --accent-soft: #233150;
  --red: #FF8E7F;
  --red-soft: #3F2623;
  --green: #7BD09B;
  --green-soft: #1E3A2A;
  --amber: #E8B860;
  --amber-soft: #3A2F1A;
  --hl: rgba(232, 200, 80, .22);
  --syn-kw: #D6A7F0;
  --syn-def: #93B3FF;
  --syn-str: #8ED5A7;
  --syn-num: #F0B96E;
  --syn-com: #74827A;
  --syn-builtin: #7FD2DB;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
  color: var(--ink);
  font: 15px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 900; line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; }
h2 { font-size: 21px; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
code, pre, kbd { font-family: var(--mono); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1360px; margin: 0 auto; padding-inline: 16px;
  height: var(--top); display: flex; align-items: center; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none !important; flex: none; }
.brand-mark { position: relative; font-family: var(--brush); font-size: 27px; line-height: 1; letter-spacing: .02em; }
.brand-mark .eye { position: relative; display: inline-block; }
.brand-mark svg { position: absolute; left: -7px; top: -6px; width: calc(100% + 14px); height: calc(100% + 12px); overflow: visible; pointer-events: none; }
.brand-sub { font-size: 12px; color: var(--ink-3); letter-spacing: .08em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  padding: 6px 12px; border-radius: 6px; color: var(--ink-2); white-space: nowrap; font-size: 14px;
  text-decoration: none !important;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red); color: var(--surface); font-size: 11px; line-height: 18px; text-align: center; font-weight: 600; }
.status-chips { display: flex; gap: 6px; flex: none; }
.schip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); white-space: nowrap; }
.schip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.schip.ok i { background: var(--green); }
.schip.warn i { background: var(--amber); }
.schip.bad i { background: var(--red); }
.schip.load i { background: var(--amber); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- layout ---------- */
.page { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
.page.wide { max-width: 1360px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.grid-home { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
@media (max-width: 900px) {
  .grid-2, .grid-home { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 25px; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; }
.lede { font-size: 16px; color: var(--ink-2); max-width: 62ch; }

/* ---------- buttons, chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; white-space: nowrap;
  text-decoration: none !important; transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.red { background: var(--red); border-color: var(--red); color: var(--surface); font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.lv { font-size: 12px; font-weight: 600; white-space: nowrap; }
.lv.easy { color: var(--green); }
.lv.medium { color: var(--amber); }
.lv.hard { color: var(--red); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 9px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
.pill.todo { color: var(--ink-3); border-color: var(--line); }
.pill.trying { color: var(--amber); background: var(--amber-soft); }
.pill.passed { color: var(--green); background: var(--green-soft); }
.pill.due { color: var(--red); background: var(--red-soft); }
.pill.master { color: var(--accent); background: var(--accent-soft); }
.stage-dots { display: inline-flex; gap: 3px; }
.stage-dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); }
.stage-dots i.f { background: var(--green); border-color: var(--green); }
.redpen { text-decoration: underline wavy var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
.hl { background: linear-gradient(transparent 55%, var(--hl) 55%); padding: 0 2px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 10px; padding-block: 6px; }
.hero h1 { font-size: 34px; }
.hero h1 .circ { position: relative; display: inline-block; }
.hero h1 .circ svg { position: absolute; inset: -10px -14px; width: calc(100% + 28px); height: calc(100% + 20px); overflow: visible; pointer-events: none; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font: 900 26px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }
.task-list { display: grid; gap: 0; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px dashed var(--line); color: var(--ink); text-decoration: none !important; }
.task:first-child { border-top: 0; }
.task:hover .task-t { color: var(--accent); }
.task-t { font-weight: 600; }
.task-k { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.task-k.r { background: var(--red-soft); color: var(--red); }
.task-k.n { background: var(--accent-soft); color: var(--accent); }
.pmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ptile {
  display: grid; gap: 6px; padding: 12px 12px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
  color: var(--ink); text-decoration: none !important; transition: border-color .15s, transform .15s;
}
.ptile:hover { border-color: var(--accent); transform: translateY(-1px); }
.ptile b { font-family: var(--serif); font-size: 16px; }
.ptile small { color: var(--ink-3); font-size: 12px; line-height: 1.45; }
.bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; counter-reset: rule; }
.rule { display: grid; gap: 4px; align-content: start; }
.rule b { font-family: var(--serif); font-size: 15px; }
.rule p { font-size: 13px; color: var(--ink-2); }

/* ---------- learn ---------- */
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable th, .ptable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ptable th { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: .06em; }
.scroll-x { overflow-x: auto; }
.signals { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.signals li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.signals li::before { content: ""; width: 12px; height: 12px; margin-top: 6px; border: 1.5px solid var(--red); border-radius: 50%; }
.oneline { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.5; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 0; position: relative; border-radius: var(--r); }
.oneline::before { content: "核心一句话"; display: block; font: 600 12px/1 var(--sans); letter-spacing: .12em; color: var(--red); margin-bottom: 8px; }
.tpl { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.tpl-h { padding: 9px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-2); }
.tpl-h b { font-size: 14px; }
.tpl-body { overflow-x: auto; }
.tpl-lines { display: grid; grid-template-columns: max-content minmax(240px, 1fr); min-width: 100%; }
.tpl-line { display: contents; }
.tpl-line > div { padding: 2px 14px; }
.tpl-code { font: 13.5px/1.75 var(--mono); white-space: pre; border-right: 1px solid var(--line); }
.tpl-why { font-size: 13px; color: var(--ink-2); line-height: 1.75; min-width: 240px; }
.tpl-line:hover > div { background: var(--hl); }
.tpl-line.blank .tpl-why { color: transparent; }
@media (max-width: 700px) {
  .tpl-lines { grid-template-columns: minmax(0, 1fr); }
  .tpl-code { border-right: 0; overflow-x: auto; }
  .tpl-why { padding-bottom: 6px !important; min-width: 0; padding-left: 28px !important; position: relative; }
  .tpl-why:not(:empty)::before { content: "↳"; position: absolute; left: 14px; color: var(--red); }
  .tpl-line.blank .tpl-why { display: none; }
}

/* ---------- problem list ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.plist { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 110px 52px 120px; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none !important; }
.prow:first-child { border-top: 0; }
.prow:hover { background: var(--surface-2); }
.prow .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .t small { font-weight: 400; color: var(--ink-3); margin-left: 6px; font-family: var(--mono); font-size: 12px; }
@media (max-width: 700px) {
  .prow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
  .prow > :nth-child(1) { grid-row: 2; }
  .prow > :nth-child(2) { grid-column: 1 / -1; }
  .prow > :nth-child(3), .prow > :nth-child(5) { display: none; }
  .prow > :nth-child(4) { grid-row: 2; justify-self: end; }
}

/* ---------- workspace ---------- */
.ws { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: grid; gap: 12px; }
.ws-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ws-head h1 { font-size: 22px; }
.ws-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 14px; height: calc(100vh - var(--top) - 92px); min-height: 560px; }
.ws-pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 8px 12px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab-body { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
.tab-body.flush { padding: 0; display: flex; flex-direction: column; }
@media (max-width: 960px) {
  .ws-grid { grid-template-columns: minmax(0, 1fr); height: auto; }
  .ws-pane.left { max-height: 78vh; min-height: 420px; }
  .ws-pane.right { min-height: 0; }
}
.desc { display: grid; gap: 14px; }
.example { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font: 13px/1.7 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.example b { font-family: var(--sans); font-weight: 600; color: var(--ink-2); }
.constraints { margin: 0; padding-left: 20px; font: 13px/1.8 var(--mono); color: var(--ink-2); }
.hint-ladder { display: grid; gap: 8px; }
.hint { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.hint.locked { color: var(--ink-3); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.hint.locked:hover { border-color: var(--accent); color: var(--accent); }
.hint b { color: var(--red); font-weight: 600; margin-right: 6px; }
.callout { border-left: 3px solid var(--red); background: var(--red-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14px; }
.callout.blue { border-color: var(--accent); background: var(--accent-soft); }

/* editor */
.ed-bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.ed-bar .sp { flex: 1; }
.ed-wrap { flex: 1; min-height: 240px; position: relative; display: flex; }
.ed-wrap .CodeMirror { flex: 1; height: auto; min-height: 240px; }
@media (max-width: 960px) { .ed-wrap { height: 380px; flex: none; } .ed-wrap .CodeMirror { height: 100%; } }
.results { flex: none; max-height: 44%; overflow: auto; border-top: 1px solid var(--line); background: var(--surface); }
@media (max-width: 960px) { .results { max-height: none; } }
.results-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 2; }
.results-h b { font-size: 15px; }
.results-h b.ok { color: var(--green); }
.results-h b.bad { color: var(--red); }
.case { border-bottom: 1px solid var(--line); }
.case summary { cursor: pointer; padding: 7px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; list-style: none; }
.case summary::-webkit-details-marker { display: none; }
.case summary .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.case.pass .dot { background: var(--green); }
.case.fail .dot { background: var(--red); }
.case-body { padding: 0 14px 10px 32px; display: grid; gap: 4px; font: 12.5px/1.6 var(--mono); }
.case-body div { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; }
.case-body span:first-child { color: var(--ink-3); font-family: var(--sans); }
.case-body span:last-child { white-space: pre-wrap; word-break: break-all; }
.case-body .err { color: var(--red); }
.stdout { margin: 10px 14px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; max-height: 160px; overflow: auto; }
.empty-results { padding: 14px; color: var(--ink-3); font-size: 13px; }

/* CodeMirror theme (tokens) */
.cm-s-tiyan.CodeMirror { background: var(--surface); color: var(--ink); font: 14px/1.7 var(--mono); }
.cm-s-tiyan .CodeMirror-gutters { background: var(--surface); border-right: 1px solid var(--line); }
.cm-s-tiyan .CodeMirror-linenumber { color: var(--ink-3); padding: 0 8px 0 6px; }
.cm-s-tiyan .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.cm-s-tiyan .CodeMirror-selected, .cm-s-tiyan.CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft); }
.cm-s-tiyan .CodeMirror-activeline-background { background: var(--surface-2); }
.cm-s-tiyan .CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.cm-s-tiyan .cm-err-line { background: var(--red-soft); }
.cm-keyword { color: var(--syn-kw); font-weight: 500; }
.cm-def { color: var(--syn-def); }
.cm-string { color: var(--syn-str); }
.cm-number { color: var(--syn-num); }
.cm-comment { color: var(--syn-com); font-style: italic; }
.cm-builtin { color: var(--syn-builtin); }
.cm-variable-2, .cm-property { color: var(--ink); }
.cm-operator { color: var(--ink-2); }
.cm-meta { color: var(--syn-num); }
.cm-atom { color: var(--syn-num); }

/* stamp */
.stamp {
  position: absolute; right: 26px; top: 64px; z-index: 5; pointer-events: none;
  width: 92px; height: 92px; border: 4px double var(--red); border-radius: 50%;
  display: grid; place-items: center; color: var(--red); font: 54px/1 var(--brush);
  transform: rotate(-14deg); opacity: .9; mix-blend-mode: multiply;
}
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
.stamp.go { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { 0% { transform: scale(2.4) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-14deg); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .stamp.go { animation: none; } * { transition: none !important; } }

/* record panel */
.record { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); background: var(--green-soft); }
.record label { font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; }
.record input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- AI chat ---------- */
.chat { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.chat-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none; }
.msgs { flex: 1; min-height: 0; overflow: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }
.msg { display: grid; gap: 6px; max-width: 100%; }
.msg.user { justify-items: end; }
.msg.user .bubble { background: var(--accent-soft); color: var(--ink); border-radius: 12px 12px 2px 12px; padding: 8px 12px; max-width: 88%; white-space: pre-wrap; font-size: 14px; }
.msg.user .bubble .act { color: var(--accent); font-weight: 600; }
.msg.ai .who { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.msg.ai .who b { color: var(--red); font-family: var(--brush); font-size: 16px; font-weight: 400; }
.msg-tools { display: flex; gap: 4px; flex-wrap: wrap; }
.msg.speaking .md { background: var(--hl); border-radius: 4px; }
.md { font-size: 14.5px; line-height: 1.75; min-width: 0; overflow-wrap: anywhere; }
.md > * + * { margin-top: .7em; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--serif); font-size: 16px; font-weight: 900; margin-top: 1.1em; }
.md ul, .md ol { padding-left: 1.4em; margin-block: .5em; }
.md li + li { margin-top: .25em; }
.md code { font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.md pre { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.65; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md pre .copy { position: absolute; top: 6px; right: 6px; opacity: 0; transition: opacity .15s; }
.md pre:hover .copy, .md pre .copy:focus { opacity: 1; }
.md table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md blockquote { margin: 0; padding: 4px 12px; border-left: 3px solid var(--red); color: var(--ink-2); }
.md strong { color: var(--ink); }
.md details { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; }
.md summary { cursor: pointer; font-weight: 600; }
.md svg { max-width: 100%; height: auto; }
.thinking { color: var(--ink-3); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.thinking::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; flex: none; background: var(--surface); }
.composer textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); min-height: 42px; max-height: 160px; font-size: 14px; line-height: 1.5; }
.composer textarea:focus { outline: none; border-color: var(--accent); }
.composer .row { justify-content: space-between; }
.ai-off { padding: 12px 14px; font-size: 13px; color: var(--ink-2); background: var(--amber-soft); border-bottom: 1px solid var(--line); }
.opt-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 13px; }

/* ---------- animation player ---------- */
.viz { display: grid; gap: 12px; }
.viz-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1200px) { .viz-stage { grid-template-columns: minmax(0, 1fr); } }
.viz-code { background: var(--surface-2); border-radius: 6px; font: 12.5px/1.7 var(--mono); max-height: 320px; overflow: auto; padding: 6px 0; }
.viz-code div { white-space: pre; padding: 0 10px 0 0; display: grid; grid-template-columns: 34px max-content; }
.viz-code div span:first-child { color: var(--ink-3); text-align: right; padding-right: 10px; user-select: none; }
.viz-code div.cur { background: var(--hl); }
.viz-code div.cur span:first-child { color: var(--red); font-weight: 700; }
.viz-data { display: grid; gap: 14px; align-content: start; min-width: 0; }
.vz-block { display: grid; gap: 6px; min-width: 0; }
.vz-name { font: 600 12px/1 var(--mono); color: var(--ink-3); }
.vz-arr { position: relative; overflow-x: auto; padding-bottom: 4px; }
.vz-cells { display: flex; gap: 4px; padding-bottom: 2px; width: max-content; }
.vz-cell { width: 40px; display: grid; gap: 2px; justify-items: center; flex: none; }
.vz-cell i { font: 10px/1 var(--mono); color: var(--ink-3); font-style: normal; }
.vz-cell b { width: 40px; height: 36px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); font: 600 13px/1 var(--mono); transition: background .25s, border-color .25s, color .25s; overflow: hidden; }
.vz-cell.hl b { background: var(--hl); border-color: var(--amber); }
.vz-cell.win b { border-color: var(--accent); background: var(--accent-soft); }
.vz-cell.dim b { opacity: .4; }
.vz-ptrs { position: relative; height: 22px; width: max-content; min-width: 100%; }
.vz-ptr { position: absolute; top: 0; width: 40px; text-align: center; font: 600 11px/1.1 var(--mono); color: var(--red); transition: transform .35s cubic-bezier(.3, .7, .3, 1); white-space: nowrap; }
.vz-ptr::before { content: "▲"; display: block; font-size: 9px; }
.vz-table { border-collapse: collapse; font: 12.5px/1 var(--mono); }
.vz-table td, .vz-table th { border: 1px solid var(--line); min-width: 32px; height: 30px; text-align: center; padding: 0 5px; transition: background .25s; }
.vz-table th { color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
.vz-table td.hl { background: var(--hl); }
.vz-table td.cur { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
.vz-stack { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.vz-stack span { padding: 5px 9px; border: 1.5px solid var(--line); border-radius: 5px; font: 600 12.5px/1 var(--mono); background: var(--surface); }
.vz-stack span:last-child { border-color: var(--accent); }
.vz-stack.queue span:last-child { border-color: var(--line); }
.vz-stack.queue span:first-child { border-color: var(--accent); }
.vz-stack em { font-size: 11px; color: var(--ink-3); font-style: normal; }
.vz-vars { display: flex; gap: 6px; flex-wrap: wrap; }
.vz-vars span { font: 12.5px/1.4 var(--mono); padding: 3px 8px; border-radius: 5px; background: var(--surface-2); }
.vz-vars span b { color: var(--accent); font-weight: 600; }
.vz-tree svg { max-width: 100%; height: auto; display: block; }
.vz-say { font-size: 15px; line-height: 1.7; padding: 12px 14px; border-radius: 6px; background: var(--surface-2); min-height: 56px; }
.vz-say b { color: var(--red); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
.vz-ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vz-ctrl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.vz-result { font: 600 13px/1.4 var(--mono); color: var(--green); }

/* ---------- misc ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.quiz-opt { padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; font-size: 15px; }
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); }
.quiz-opt.right { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
.quiz-opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.import-box textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--paper); resize: vertical; font-size: 14px; }
.file-pick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.file-pick input { max-width: 220px; font-size: 12px; }
.inline-ai { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; max-height: 640px; }
.inline-ai .msgs { max-height: 460px; }
.kbd { font: 11px/1 var(--mono); padding: 2px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-3); }
.sep { height: 1px; background: var(--line); }
.fade-in { animation: fade .25s ease both; }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }

/* ---------- 补充 ---------- */
.ed-wrap .CodeMirror { position: absolute; inset: 0; height: 100%; min-height: 0; }
.viz-code { position: relative; }
.vz-tree line { stroke: var(--line); stroke-width: 1.5; }
.vz-tree circle { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; transition: fill .25s; }
.vz-tree circle.hl { fill: var(--hl); stroke: var(--amber); }
.vz-tree text { fill: var(--ink); font: 600 12px var(--mono); text-anchor: middle; dominant-baseline: central; }
select.btn { padding-right: 8px; }
@media (max-width: 760px) {
  .brand-sub { display: none; }
  .topbar-in { gap: 10px; }
  .status-chips .schip { font-size: 0; padding: 5px; gap: 0; }
  .hero h1 { font-size: 26px; }
  .stats { gap: 18px; }
  .ws-head h1 { font-size: 19px; }
}
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.steps li > b:first-child { color: var(--red); font-family: var(--serif); }

/* ---------- 知识库 ---------- */
.kb-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kb-left { max-height: calc(100vh - var(--top) - 40px); position: sticky; top: calc(var(--top) + 12px); grid-template-rows: auto auto minmax(0, 1fr) auto auto; overflow: hidden; }
.kb-outline { max-height: 200px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px; display: flex; flex-direction: column; gap: 1px; }
.kb-outline .kb-ol { flex: none; }
.kb-ol { text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kb-ol:hover { background: var(--surface-2); color: var(--ink); }
.kb-ol.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.kb-read-wrap { position: relative; overflow: auto; min-height: 200px; display: grid; gap: 8px; align-content: start; padding-right: 4px; }
.kb-reader { font-size: 15px; }
.kb-reader ::selection { background: var(--hl); }
.kb-ask { position: absolute; z-index: 4; box-shadow: var(--shadow); }
.kb-chat { max-height: calc(100vh - var(--top) - 40px); min-height: 560px; position: sticky; top: calc(var(--top) + 12px); }
.kb-chat .msgs { max-height: none; }
@media (max-width: 960px) {
  .kb-grid { grid-template-columns: minmax(0, 1fr); }
  .kb-left, .kb-chat { position: static; max-height: none; }
  .kb-left { overflow: visible; }
  .kb-read-wrap { max-height: 60vh; }
  .kb-chat { min-height: 480px; max-height: 80vh; }
}

</style>
</head>

      <span class="brand-mark">题<span class="eye">眼<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M14 58 C 6 26, 52 4, 80 18 S 98 70, 66 88 S 8 90, 12 50 S 40 8, 62 12" fill="none" style="stroke:var(--red)" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></span>
      <span class="brand-sub">算法陪练</span>

，一旦合法就不断移动左指针尝试变短。","用 `missing` 表示还缺多少字符；右进减少缺口，左缩导致缺口恢复时停止。"],"key":"右扩找可行窗口，合法后左缩到刚好不可再缩。","pitfalls":["只检查字符种类不检查次数会让 `t='aa'` 出错","更新最短答案必须发生在每次合法窗口左缩前"],"types":[null,null],"ret_type":null,"compare":"exact","starter":"class Solution:\n    def minWindow(self, s: str, t: str) -> str:\n        ","tests":[{"args":["ADOBECODEBANC","ABC"],"expected":"BANC"},{"args":["a","aa"],"expected":""},{"args":["a","a"],"expected":"a"},{"args":["aa","aa"],"expected":"aa"},{"args":["ab","b"],"expected":"b"},{"args":["bba","ab"],"expected":"ba"},{"args":["abc","d"],"expected":""},{"args":["deddeebbedebadcbaeaeddebeaeaaabbeadcdebebcdaadcdeaccbecaaeadacdaaabbaddddaebccaccadabbaaaddbebdebbddaddbacecabbdeeaabbdcaeccdaaabebaeccedbedebdbbcbebbbebddeadaaaaecbdcdedcebabbdeeeacbbaacddbaabcceebacbdceebeaadccaaeadaccbaadecabccadadadeaeddeaeaaaacdcdedddeaeeaceadabadedcaccbebebcddbcdcbdbbdbecbbbdcaacbaddcbddedcedcaaceacecceabddbacbbaadaecabbdcbadeabbcceeeebdbaddbddbadeeecdcbaabbdaceccaceaadcedcdabadabecbdbeeddeabdeecebeeeccdebcbeecedbdeaeaedaeaedeeadabaedddcbddbcddecabdeacbaabbbacccbedadeaeecbedaddeebebebebeeebbcbcecbbbabbbacdaddebbdaabeccaecebadaaaeeeedbbbabbbcaeabdaacdddecdbecaabbddccdbebaeacadeebeecccabdbcecdbdbbaccdaaceabcccbdebeadedbadeaaeabcddeabdaacccceeedeeadaeeadbddbdeeeadddcedeccecdceccaabeabddacdaecabddcbaeadbbeaaeddabacebacdbddecedcebcbbdaeceeccceeebcbbbebaaaccdaeaabecaabebcddcbccdbaadebddcdbcbeccebdceadcaeadeeddcaacbeacdccbbcccacdeecdecdcbdebaccacdedbecdebeebbadcabeaebecadaeeceacacacaabadbbdecddcccbddeaeadcadadeaecaaddbbbdbcbddeccadcacbbadaedacabbcbebedeebdbcdbceedcddceadbdabbdeecabadcdbdebdbcbcebeceeabebabbbacceeaddaeeecabdbadbaededbcccdaecdacabaddadaddbceadabebcdeccdeacbbdacccedcddaabeabbbbdadeaababaddacdebbbddcdeadecbeeaccbccdaedbeccaebcecebceeebebebeababbdedccaccdadbbeeeeaecbcebaaccbecbbeeadadbbcdeeabbddabedaedbcebcbecaabddeadcdeedcddddaeaeceeddacaceddecceabadbedadaebecdbacedebbdeaaaebaeedacbcacbaddedbcebacadcccdbdbbcabccdabebebbaacccdbcddabbcabcbbeccceaeebcbbcbadadeaeaaeecec class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

    def __repr__(self):
        return "ListNode(%r)" % (_from_list(self),)


class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

    def __repr__(self):
        return "TreeNode(%r)" % (_from_tree(self),)


def _to_list(arr):
    dummy = cur = ListNode()
    for v in arr:
        cur.next = ListNode(v)
        cur = cur.next
    return dummy.next


def _from_list(node):
    out, steps = [], 0
    while node is not None:
        out.append(node.val)
        node = node.next
        steps += 1
        if steps > 200000:
            raise RuntimeError("链表里可能有环：遍历超过 200000 个节点")
    return out


def _to_tree(arr):
    if not arr or arr[0] is None:
        return None
    root = TreeNode(arr[0])
    q, i = deque([root]), 1
    while q and i < len(arr):
        node = q.popleft()
        if arr[i] is not None:
            node.left = TreeNode(arr[i])
            q.append(node.left)
        i += 1
        if i < len(arr) and arr[i] is not None:
            node.right = TreeNode(arr[i])
            q.append(node.right)
        i += 1
    return root


def _from_tree(root):
    if root is None:
        return []
    out, q = [], deque([root])
    while q:
        n = q.popleft()
        if n is None:
            out.append(None)
            continue
        out.append(n.val)
        q.append(n.left)
        q.append(n.right)
    while out and out[-1] is None:
        out.pop()
    return out

def _jsonable(x):
    if isinstance(x, (list, tuple, set, frozenset, deque)):
        items = [_jsonable(v) for v in x]
        if isinstance(x, (set, frozenset)):
            items.sort(key=_key)
        return items
    if isinstance(x, dict):
        return {str(k): _jsonable(v) for k, v in x.items()}
    if isinstance(x, ListNode):
        return _from_list(x)
    if isinstance(x, TreeNode):
        return _from_tree(x)
    return x


def _key(v):
    return json.dumps(v, sort_keys=True, ensure_ascii=False)


def _norm(x, mode):
    x = _jsonable(x)
    if mode == "unordered" and isinstance(x, list):
        return sorted(x, key=_key)
    if mode == "unordered_deep" and isinstance(x, list):
        return sorted((sorted(i, key=_key) if isinstance(i, list) else i for i in x), key=_key)
    return x

        except Exception:

    return _norm(got, mode) == _norm(exp, mode)


def _get_callable(ns, fn):
    if "Solution" in ns and isinstance(ns["Solution"], type):
        obj = ns["Solution"]()
        if hasattr(obj, fn):
            return getattr(obj, fn)
    if fn in ns and callable(ns[fn]):
        return ns[fn]
    raise NameError("没找到函数 %s：请保留 class Solution 里的 %s 方法" % (fn, fn))


def _call(f, args, types, ret_type):
    types = types or [None] * len(args)
    conv = [CONVERT_IN[t](copy.deepcopy(a)) if t in CONVERT_IN else copy.deepcopy(a) for a, t in zip(args, types)]
    out = f(*conv)
    if ret_type and ret_type.startswith("inplace"):
        out = conv[int(ret_type[7:] or 0)]
    elif ret_type in CONVERT_OUT:
        out = CONVERT_OUT[ret_type](out)
    return _jsonable(out)


def _short(v, limit=300):
    s = json.dumps(v, ensure_ascii=False)
    return s if len(s) <= limit else s[:limit] + " …（共 %d 字符）" % len(s)


def run_tests(user_code, spec_json, max_cases=None):
    """跑用户代码。spec: {fn, types, ret_type, compare, tests:[{args, expected}]}。返回 JSON 字符串。"""
    spec = json.loads(spec_json)
    result = {"ok": False, "compile_error": None, "cases": [], "passed": 0, "total": 0, "stdout": ""}
    buf = io.StringIO()
    old_out = sys.stdout
    sys.stdout = buf
    try:
        ns = {"__name__": "__solution__"}
        ns.update({k: v for k, v in globals().items() if not k.startswith("_") or k in ("__builtins__",)})
        ns["ListNode"], ns["TreeNode"] = ListNode, TreeNode
        try:
            exec(_src(user_code, "solution.py"), ns)
            f = _get_callable(ns, spec["fn"])
        except Exception as e:
            result["compile_error"] = _fmt_exc(e)
            return json.dumps(result, ensure_ascii=False)
        tests = spec["tests"][: max_cases or len(spec["tests"])]
        result["total"] = len(tests)
        for i, t in enumerate(tests):
            case = {"i": i, "args": _short(t["args"]), "expected": _short(t.get("expected"))}
            start = time.perf_counter()
            try:
                f = _get_callable(ns, spec["fn"])
                got = _call(f, t["args"], spec.get("types"), spec.get("ret_type"))
                case["got"] = _short(got)
                case["pass"] = "expected" in t and _same(got, t["expected"], spec.get("compare", "exact"))
            except RecursionError as e:
                case["error"] = "RecursionError: 递归太深（可能没写终止条件，或需要改成迭代）"
                case["pass"] = False
            except Exception as e:
                case["error"] = _fmt_exc(e)
                case["pass"] = False
            case["ms"] = round((time.perf_counter() - start) * 1000, 1)
            result["cases"].append(case)
            if case["pass"]:
                result["passed"] += 1
        result["ok"] = result["passed"] == result["total"]
    finally:
        sys.stdout = old_out
        out = buf.getvalue()
        result["stdout"] = out if len(out) < 4000 else out[:4000] + "\n…（输出过长已截断）"
    return json.dumps(result, ensure_ascii=False)


def run_reference(code, spec_json):
    """用参考解算出每个用例的 expected（AI 出的变体题用它校正答案）。"""
    spec = json.loads(spec_json)
    ns = {"__name__": "__reference__"}
    ns.update({k: v for k, v in globals().items() if not k.startswith("_")})
    exec(_src(code, "reference.py"), ns)
    f = _get_callable(ns, spec["fn"])
    outs = []
    for t in spec["tests"]:
        try:
            outs.append({"expected": _call(f, t["args"], spec.get("types"), spec.get("ret_type"))})
        except Exception as e:
            outs.append({"error": _fmt_exc(e)})
    return json.dumps(outs, ensure_ascii=False)


def run_snippet(code, stdin_text=""):
    """自由运行一段代码（AI 工具 / 草稿区用）。"""
    buf = io.StringIO()
    old_out, old_in = sys.stdout, sys.stdin
    sys.stdout, sys.stdin = buf, io.StringIO(stdin_text)
    err = None
    try:
        ns = {"__name__": "__main__"}
        ns.update({k: v for k, v in globals().items() if not k.startswith("_")})
        exec(_src(code, "snippet.py"), ns)
    except Exception as e:
        err = _fmt_exc(e)
    finally:
        sys.stdout, sys.stdin = old_out, old_in
    out = buf.getvalue()
    return json.dumps({"stdout": out[:6000], "error": err}, ensure_ascii=False)


def _src(code, name):
    linecache.cache[name] = (len(code), None, code.splitlines(True), name)
    return compile(code, name, "exec")


def _fmt_exc(e):
    tb = traceback.extract_tb(e.__traceback__)
    lines = [fr for fr in tb if fr.filename in ("solution.py", "snippet.py", "reference.py")]
    where = ""
    if lines:
        fr = lines[-1]
        where = "（第 %d 行：%s）" % (fr.lineno, (fr.line or "").strip())
    if isinstance(e, SyntaxError):
        where = "（第 %s 行：%s）" % (e.lineno, (e.text or "").strip())
    return "%s: %s%s" % (type(e).__name__, e, where)

function startOfDay(t = Date.now()) { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

// ---------- 进度与复习 ----------
function prog(pid) { return S.progress[pid] || null; }

  const d = prog(pid);

  if (d.passed && d.due && d.due <= startOfDay() + DAY - 1) return "due";
  if (d.passed && (d.stage || 0) >= 5) return "master";
  if (d.passed) return "passed";

}

  let s = doc.stage || 0;

  else if (rating === "hint") s = Math.max(1, s);
  else s = 1;
  doc.stage = Math.min(s, 6);
  doc.due = startOfDay() + INTERVALS[Math.min(doc.stage, INTERVALS.length) - 1] * DAY;
  doc.history = (doc.history || []).slice(-19).concat([{ at: Date.now(), rating }]);
  return doc;
}

    .sort((a, b) => prog(a.id).due - prog(b.id).due);
}

// ---------- 存储：db（跨设备）优先，本机兜底 ----------
const Store = {
  coll: null, docs: {}, chains: {},
  async init() {
    this.docs = LS.get("tiyan:docs", {});
    applyDocs();
    let db = null, user = null;
    try { if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { /* 无 */ }
    if (!db || !user) { S.store = "local"; updateChips(); return; }
    let uid = null;
    try { uid = await user.id(); } catch (e) { uid = null; }
    if (!uid) { S.store = "local"; updateChips(); return; }
    this.coll = db.collection("data/users/" + uid);
    S.store = "db";
    updateChips();
    let migrated = false;
    this.coll.onSnapshot(snap => {
      const docs = {};
      for (const d of snap.docs) docs[d.id] = d.data();
      if (!migrated) {
        // 本机有、云端没有的记录（登录前做的题）：显示出来；等云端结果确定后再上传
        const localOnly = Object.keys(this.docs).filter(k => !(k in docs));
        for (const k of localOnly) docs[k] = this.docs[k];
        if (!snap.metadata || !snap.metadata.fromCache) {
          migrated = true;
          const src = this.docs;
          (async () => { for (const k of localOnly) await this.write(k, src[k]); })();
        }
      }
      this.docs = docs;
      LS.set("tiyan:docs", docs);
      applyDocs();
      softRefresh();
    }, err => {
      if (err && err.code === "revoked") { this.coll = null; S.store = "local"; updateChips(); }
    });
  },
  write(key, data) {
    if (!this.coll) return Promise.resolve();
    const prev = this.chains[key] || Promise.resolve();
    const next = prev.then(() => this.coll.doc(key).set(data)).catch(async e => {
      if (e && e.code === "unavailable") {
        await new Promise(r => setTimeout(r, 600 + Math.random() * 800));
        return this.coll.doc(key).set(data).catch(() => toast("云端暂时没保存上，已先存在本机"));
      }
      if (e && e.code === "quota_exceeded") toast("云端存储满了，删掉一些自建题目再试");
      else if (e && e.code === "invalid_argument") { this.coll = null; S.store = "local"; updateChips(); toast("没有云端写入权限，进度只存在本机"); }
    });
    this.chains[key] = next;
    return next;
  },
  put(key, data) {
    this.docs[key] = JSON.parse(JSON.stringify(data));
    LS.set("tiyan:docs", this.docs);
    applyDocs();
    softRefresh();
    return this.write(key, this.docs[key]);
  },
  remove(key) {
    delete this.docs[key];
    LS.set("tiyan:docs", this.docs);
    applyDocs();
    softRefresh();
    if (this.coll) return this.coll.doc(key).delete().catch(() => {});
    return Promise.resolve();
  },
};
function applyDocs() {
  const progress = {}, custom = [], viz = {};
  for (const [k, v] of Object.entries(Store.docs)) {
    if (k.startsWith("p:")) progress[k.slice(2)] = v;
    else if (k.startsWith("x:") && v && v.id) custom.push(v);
    else if (k.startsWith("v:")) viz[k.slice(2)] = v;
  }
  custom.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  S.progress = progress; S.custom = custom; S.viz = viz;
  S.all = BUILTIN.concat(custom);
  S.byId = Object.fromEntries(S.all.map(p => [p.id, p]));
}
function saveProg(pid, doc) { doc.pid = pid; return Store.put("p:" + pid, doc); }

// ---------- Python 运行时（Pyodide，跑在 Worker 里，死循环可以直接杀掉） ----------
const WORKER_SRC = `
let py = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    try {
      importScripts(m.base + "pyodide.js");
      py = await loadPyodide({ indexURL: m.base, stdLibURL: m.base + "python_stdlib.wasm" });
      py.runPython(m.harness);
      self.postMessage({ type: "ready", version: py.version });
    } catch (err) {
      self.postMessage({ type: "fail", error: String((err && err.message) || err) });
    }
    return;
  }
  try {
    const f = py.globals.get(m.fn);
    const out = f(...m.args);
    if (f.destroy) f.destroy();
    self.postMessage({ id: m.id, ok: true, out: out });
  } catch (err) {
    self.postMessage({ id: m.id, ok: false, error: String((err && err.message) || err) });
  }
};`;
const Py = {
  worker: null, seq: 0, pending: new Map(), ready: null, resolveReady: null, error: "", version: "",
  start() {
    S.py = "loading"; updateChips();
    this.ready = new Promise(r => { this.resolveReady = r; });
    let base;
    try {
      base = new URL("pyodide/", location.href).href;
      if (!/^https?:/.test(base)) throw new Error("bad base");
    } catch (e) { return this.fail("拿不到运行时文件的地址"); }
    try {
      const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
      this.worker = new Worker(url);
    } catch (e) { return this.fail("浏览器不允许启动后台线程"); }
    this.worker.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") { clearTimeout(this.bootTimer); S.py = "ready"; this.version = m.version; updateChips(); this.resolveReady(true); return; }
      if (m.type === "fail") { this.fail(m.error); return; }
      const p = this.pending.get(m.id);
      if (!p) return;
      this.pending.delete(m.id);
      clearTimeout(p.timer);
      if (m.ok) p.res(m.out); else p.rej({ message: m.error });
    };
    this.worker.onerror = e => { e.preventDefault && e.preventDefault(); if (S.py === "loading") this.fail(e.message || "运行时加载失败"); };
    this.worker.postMessage({ type: "init", base, harness: HARNESS });
    this.bootTimer = setTimeout(() => { if (S.py === "loading") this.fail("加载超时"); }, 90000);
  },
  fail(msg) {
    clearTimeout(this.bootTimer);
    S.py = "failed"; this.error = String(msg || "未知错误"); updateChips();
    if (this.resolveReady) this.resolveReady(false);
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.rej({ message: "Python 运行环境不可用" }); }
    this.pending.clear();
    try { this.worker && this.worker.terminate(); } catch (e) { /* ignore */ }
    softRefresh();
  },
  async call(fn, args, timeout = 8000) {
    const ok = await this.ready;
    if (!ok) throw { message: "Python 运行环境不可用：" + this.error, unavailable: true };
    const id = ++this.seq;
    return new Promise((res, rej) => {
      const timer = setTimeout(() => {
        this.pending.delete(id);
        rej({ timeout: true, message: `运行超过 ${Math.round(timeout / 1000)} 秒被终止：可能有死循环，或者复杂度太高` });
        this.restart();
      }, timeout);
      this.pending.set(id, { res, rej, timer });
      this.worker.postMessage({ id, fn, args });
    });
  },
  async json(fn, args, timeout) { return JSON.parse(await this.call(fn, args, timeout)); },
  restart() {
    try { this.worker.terminate(); } catch (e) { /* ignore */ }
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.rej({ message: "运行环境重启了，请再试一次" }); }
    this.pending.clear();
    this.start();
  },
};
function specOf(p, tests) {
  return JSON.stringify({ fn: p.fn, types: p.types, ret_type: p.ret_type, compare: p.compare, tests: tests || p.tests });
}

// ---------- AI（经自己的后端转发到 DeepSeek） ----------
function mergeTurns(list) {
  const out = [];
  for (const m of list) {
    if (!m.content) continue;
    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += "\n\n" + m.content;
    else out.push({ role: m.role, content: m.content });
  }
  return out;
}
function parseJsonLoose(text) {
  const t = String(text || "").trim();
  try { return JSON.parse(t); } catch (e) { /* 继续尝试 */ }
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) { try { return JSON.parse(fence[1]); } catch (e) { /* 继续 */ } }
  const a = t.search(/[{[]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* 放弃 */ } }
  return undefined;
}
const AI_CODES = { locked: "locked", no_key: "no_key", bad_key: "bad_key", insufficient_balance: "insufficient_balance", rate_limited: "rate_limited", too_large: "prompt_too_large", bad_request: "invalid_request" };
const DS_DEFAULT = { base: "https://api.deepseek.com", model: "deepseek-flash", pro: "deepseek-v4-pro" };
const AI = {
  tools: true, images: false, model: "", pro: "", needPassword: false, mode: "server",
  pw() { return LS.get("tiyan:pw", ""); },
  key() { return LS.get("tiyan:dskey", ""); },
  direct() { return Object.assign({}, DS_DEFAULT, LS.get("tiyan:dsconf", {})); },
  async init() {
    let c = null;
    try {
      const r = await fetch("api/config", { headers: { "x-site-password": this.pw() }, cache: "no-store" });
      if (r.ok && /json/.test(r.headers.get("content-type") || "")) c = await r.json();
    } catch (e) { c = null; }
    if (c && typeof c.hasKey === "boolean" && (c.hasKey || !this.key())) {
      this.mode = "server";
      this.model = c.model || ""; this.pro = c.pro || ""; this.needPassword = !!c.needPassword; this.images = !!c.vision;
      S.ai = !c.hasKey ? "nokey" : c.authed ? "ready" : "locked";
    } else {
      // 没有后端（GitHub Pages 等静态托管）：浏览器直连 DeepSeek，key 只存在本机浏览器
      const d = this.direct();
      this.mode = "direct"; this.model = d.model; this.pro = d.pro; this.images = false;
      S.ai = this.key() ? "ready" : "needkey";
    }
    updateChips();
    softRefresh();
  },
  async setKey(k) { LS.set("tiyan:dskey", k.trim()); await this.init(); },
  clearKey() { LS.del("tiyan:dskey"); this.init(); },
  async unlock(pw) { LS.set("tiyan:pw", pw); await this.init(); return S.ai === "ready"; },
  ok() { return S.ai === "ready"; },
  async ask(input, o = {}) {
    if (!this.ok()) throw { code: { locked: "locked", nokey: "no_key", needkey: "need_key" }[S.ai] || "unavailable" };
    const messages = mergeTurns(typeof input === "string" ? [{ role: "user", content: input }] : input);
    if (!messages.length || messages[messages.length - 1].role !== "user") throw { code: "invalid_request" };
    let tools = o.tools ? o.tools.filter(t => !t.needsPy || S.py === "ready") : null;
    if (tools && !tools.length) tools = null;
    const spec = tools ? tools.map(t => ({ type: "function", function: { name: t.name, description: t.description, parameters: t.inputSchema || { type: "object", properties: {} } } })) : undefined;
    let full = "", truncated = false;
    const MAX = 6;
    for (let round = 0; round < MAX; round++) {
      const last = round === MAX - 1;
      let r;
      try {
        r = await this.round(messages, {
          json: !!o.json && (!spec || last), tools: last ? undefined : spec, tier: o.tier, signal: o.signal,
          onDelta: o.json ? null : d => { full += d; if (o.onText) o.onText({ text: full, delta: d }); },
        });
      } catch (e) { if (full) e.text = full; throw e; }
      truncated = r.finish === "length";
      if (r.toolCalls.length && !last) {
        messages.push({ role: "assistant", content: r.content || "", tool_calls: r.toolCalls.map(c => ({ id: c.id, type: "function", function: { name: c.name, arguments: c.args || "{}" } })) });
        for (const c of r.toolCalls) {
          const tool = tools.find(t => t.name === c.name);
          let result;
          try { result = tool ? await tool.execute(JSON.parse(c.args || "{}"), { signal: o.signal }) : { error: "没有这个工具：" + c.name }; }
          catch (e) { result = { error: String((e && e.message) || e) }; }

          messages.push({ role: "tool", tool_call_id: c.id, content: clip(typeof result === "string" ? result : JSON.stringify(result), 20000) });
        }

      }
      if (o.json) {
        const v = parseJsonLoose(r.content);
        if (v === undefined) throw { code: "invalid_json", text: r.content };

  async round(messages, { json, tools, tier, signal, onDelta }) {

        if (tools) payload.tools = tools;
        if (json) payload.response_format = { type: "json_object" };

        });
      } else {
        resp = await fetch("api/chat", {
          method: "POST", signal,
          headers: { "content-type": "application/json", "x-site-password": this.pw() },
          body: JSON.stringify({ messages, tools, json, tier }),

      if (direct) code = { 400: "invalid_request", 401: "bad_key", 402: "insufficient_balance", 422: "invalid_request", 429: "rate_limited" }[resp.status] || "upstream_error";
      else code = AI_CODES[j.error] || "upstream_error";
      if (code === "locked") { S.ai = "locked"; updateChips(); }
      const msg = j.message || (j.error && j.error.message) || "";
      throw { code, message: typeof msg === "string" ? msg : JSON.stringify(msg) };
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "", content = "", finish = null;
    const calls = [];
    const eat = line => {
      line = line.trim();
      if (!line.startsWith("data:")) return;
      const data = line.slice(5).trim();
      if (!data || data === "[DONE]") return;
      let ev;
      try { ev = JSON.parse(data); } catch (e) { return; }
      const ch = ev.choices && ev.choices[0];
      if (!ch) return;
      const d = ch.delta || {};
      if (d.content) { content += d.content; if (onDelta) onDelta(d.content); }
      if (Array.isArray(d.tool_calls)) for (const t of d.tool_calls) {
        const k = t.index ?? calls.length;
        const c = calls[k] || (calls[k] = { id: "", name: "", args: "" });
        if (t.id) c.id = t.id;
        if (t.function) { if (t.function.name) c.name += t.function.name; if (t.function.arguments) c.args += t.function.arguments; }
      }
      if (ch.finish_reason) finish = ch.finish_reason;
    };
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n")) >= 0) { eat(buf.slice(0, i)); buf = buf.slice(i + 1); }
      }
      if (buf) eat(buf);
    } catch (e) {
      if (signal && signal.aborted) throw { code: "cancelled" };
      throw { code: "upstream_error", message: String((e && e.message) || e) };
    }
    return { content, finish, toolCalls: calls.filter(c => c && c.name).map((c, i) => ({ ...c, id: c.id || "call_" + i })) };
  },
};
function aiErr(e) {

    case "locked": return "需要访问密码：在 AI 老师面板顶部输入密码。";

  }
}

function renderMd(el, text) {
  let html = "";
  try { html = marked.parse(String(text || ""), { gfm: true, breaks: false }); } catch (e) { html = ""; }
  el.innerHTML = DOMPurify.sanitize(html, { ADD_TAGS: ["details", "summary"], ADD_ATTR: ["open"] });
  for (const code of $$("pre code", el)) {
    const src = code.textContent;
    const lang = ((code.className || "").match(/language-([\w+-]+)/) || [])[1] || "";
    if (!lang || /^(py|python|python3)$/i.test(lang)) {
      code.textContent = "";
      try { CodeMirror.runMode(src, "python", code); } catch (e) { code.textContent = src; }
    }
    const btn = h("button", { class: "btn sm copy", type: "button" }, "复制");
    btn.addEventListener("click", () => copyText(src, btn));
    code.parentElement.append(btn);
  }
  for (const a of $$("a", el)) if (/^https?:/i.test(a.getAttribute("href") || "")) { a.target = "_blank"; a.rel = "noopener"; }
}
function highlightInto(el, code) {
  el.textContent = "";
  try { CodeMirror.runMode(code, "python", el); } catch (e) { el.textContent = code; }
  return el;
}

// ---------- 语音朗读（浏览器自带 TTS） ----------
const TTS = {
  ok: typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined",
  voice: null, rate: LS.get("tiyan:rate", 1.05), token: 0, current: null,
  pick() {
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices() || [];
    this.voice = vs.find(v => /zh[-_]CN/i.test(v.lang) && /Tingting|Xiaoxiao|Yunxi|Google/i.test(v.name)) || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  },
  clean(md) {
    return String(md || "")
      .replace(/```[\s\S]*?```/g, "。这里有一段代码，请看屏幕。")
      .replace(/<details>[\s\S]*?<\/details>/g, "")
      .replace(/<[^>]+>/g, "")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/^\s*\|?\s*:?-{2,}.*$/gm, "")
      .replace(/\|/g, "，")
      .replace(/^#+\s*/gm, "")
      .replace(/[*_>#~]/g, "")
      .replace(/^\s*[-+]\s+/gm, "")
      .replace(/\n{2,}/g, "。\n")
      .replace(/\s+/g, " ")
      .trim();
  },
  speak(text, onend) {
    if (!this.ok) { onend && onend(); return; }
    this.stop();
    if (!this.voice) this.pick();
    const tok = ++this.token;
    const parts = (this.clean(text).match(/[^。！？；\n!?;]+[。！？；\n!?;]?/g) || []).reduce((acc, s) => {
      const last = acc[acc.length - 1];
      if (last && (last + s).length < 120) acc[acc.length - 1] = last + s; else acc.push(s);
      return acc;
    }, []);
    if (!parts.length) { onend && onend(); return; }
    parts.forEach((t, i) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "zh-CN";
      if (this.voice) u.voice = this.voice;
      u.rate = this.rate;
      if (i === parts.length - 1) u.onend = () => { if (tok === this.token) { this.current = null; onend && onend(); } };
      u.onerror = () => { if (tok === this.token && i === parts.length - 1) { this.current = null; onend && onend(); } };
      speechSynthesis.speak(u);
    });
    this.current = tok;
  },
  stop() { if (!this.ok) return; this.token++; this.current = null; try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
};
if (TTS.ok) { TTS.pick(); try { speechSynthesis.onvoiceschanged = () => TTS.pick(); } catch (e) { /* ignore */ } }

// ---------- AI 老师的公共规则与上下文 ----------
const TEACHER = `你是「题眼」算法陪练里的 AI 老师。学习者在准备大厂技术面试，用 Python 刷题；他的痛点是：死记硬背记不住、题目一变形就不会写。
教学原则：
1. 讲清“为什么这么写”：把每个关键写法和背后的理由对应起来，而不是只给答案；
2. 每次都点出这题的“题眼”（题目里哪句话提示了该用什么方法）和“核心一句话”；
3. 先引导、后给答案：除非学习者明确要求看答案，不要直接贴完整解答代码；
4. 用中文，口语化、准确、简洁；用 Markdown，代码用 \`\`\`python 代码块，引用学习者代码时写明行号；
5. 运行结果以页面提供的真实结果为准，不确定的地方直说，不要编造。`;

function problemBlock(p, withRef = true) {
  return [
    `【题目】${p.title}（${LEVEL[p.level] || ""}，题型：${pname(p)}）`,
    p.desc,
    "示例：\n" + (p.examples || []).map((e, i) => `${i + 1}. 输入：${e.input}　输出：${e.output}${e.note ? "　说明：" + e.note : ""}`).join("\n"),
    "约束：" + (p.constraints || []).join("；"),
    "函数签名：\n" + p.starter.trim(),
    p.change ? "【这是一道变体题，和原题的区别】" + p.change : "",
    withRef && p.solution ? "【参考解】（只用于判断对错和引导；学习者没要求看答案时，不要贴出完整参考代码）\n```python\n" + p.solution.trim() + "\n```\n复杂度：" + (p.complexity || "") : "",
  ].filter(Boolean).join("\n\n");
}
function runBlock(last) {
  if (!last) return "【最近一次运行】还没运行过。";
  const r = last.result;
  if (!r) return "【最近一次运行】" + (last.error || "运行失败");
  if (r.compile_error) return "【最近一次运行】代码无法运行：" + r.compile_error;
  const fails = r.cases.filter(c => !c.pass).slice(0, 3).map(c => `- 输入 ${clip(c.args, 300)}；期望 ${clip(c.expected, 200)}；${c.error ? "报错 " + c.error : "实际 " + clip(c.got, 200)}`);
  const slow = r.cases.filter(c => c.ms > 1000).length;
  return `【最近一次运行】（${last.all ? "全部用例" : "样例"}，真实运行）通过 ${r.passed}/${r.total}` +
    (fails.length ? "\n失败的用例：\n" + fails.join("\n") : "") +
    (slow ? `\n有 ${slow} 个用例耗时超过 1 秒，复杂度可能偏高。` : "") +
    (r.stdout ? "\nprint 输出：\n" + clip(r.stdout, 800) : "");
}

// ---------- DeepSeek key 设置（直连模式） ----------
function keyForm(onDone) {
  const inp = h("input", { type: "password", id: "ds-key", placeholder: "sk-……", autocomplete: "off", spellcheck: "false", style: "padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;flex:1" });
  const msg = h("div", { class: "small muted" });
  const form = h("form", { class: "stack", style: "gap:8px" },
    h("div", { class: "row", style: "flex-wrap:nowrap" }, inp, h("button", { class: "btn primary sm", type: "submit" }, "保存")),
    h("div", { class: "small muted" }, "在 ", h("a", { href: "https://platform.deepseek.com/api_keys", target: "_blank", rel: "noopener" }, "platform.deepseek.com"), " 创建 key。key 只保存在这个浏览器里，由浏览器直接发给 DeepSeek，不经过任何其他服务器。"),
    msg);
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const k = inp.value.trim();
    if (!/^sk-\S{10,}$/.test(k)) { msg.textContent = "格式不对：DeepSeek key 以 sk- 开头。"; return; }
    msg.textContent = "检查 key……";
    let ok = true, note = "";
    try {
      const r = await fetch(AI.direct().base.replace(/\/+$/, "") + "/user/balance", { headers: { authorization: "Bearer " + k } });
      if (r.status === 401) ok = false;
      else if (r.ok) {
        const b = await r.json();
        const info = (b.balance_infos || [])[0];
        if (info) note = `余额 ${info.total_balance} ${info.currency === "CNY" ? "元" : info.currency}`;
      }
    } catch (err) { note = "暂时没法联网验证，先保存了"; }
    if (!ok) { msg.textContent = "DeepSeek 说这个 key 无效，请检查。"; return; }
    await AI.setKey(k);
    msg.textContent = "已保存" + (note ? "，" + note : "") + "。";
    if (onDone) onDone();
  });
  return form;
}
function openKeyDialog() {
  const close = () => { wrap.remove(); };
  const box = h("div", { class: "panel", style: "max-width:520px;width:100%;box-shadow:var(--shadow)", role: "dialog", "aria-label": "DeepSeek 设置" },
    h("div", { class: "panel-h" }, h("h2", null, "DeepSeek 设置"), h("button", { class: "btn ghost sm", type: "button", onclick: close }, "关闭")),
    h("p", { class: "small muted" }, AI.key() ? `已保存 key（…${AI.key().slice(-4)}）。对话用 ${AI.model}，出题和动画用 ${AI.pro}。` : "AI 老师需要你自己的 DeepSeek API key。"),
    keyForm(() => setTimeout(close, 900)),
    AI.key() ? h("div", { class: "row" }, h("button", { class: "btn ghost sm", type: "button", onclick: () => { AI.clearKey(); close(); toast("已删除这个浏览器里的 key"); } }, "删除已保存的 key")) : "");
  const wrap = h("div", { style: "position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px" }, box);

}

// ---------- 对话组件：做题页、题型页、问老师页共用 ----------
class Chat {
  constructor({ key, context, placeholder, actions, intro, images }) {
    this.key = key;
    this.context = context;
    this.msgs = S.chats[key] || (S.chats[key] = []);
    this.ctl = null;
    this.busy = false;
    this.mode = null;
    this.actions = actions || [];
    this.el = h("div", { class: "chat" });
    this.offEl = h("div", { class: "ai-off", hidden: true });
    this.actEl = this.actions.length ? h("div", { class: "chat-actions" }) : null;
    this.list = h("div", { class: "msgs" });
    this.optRow = h("div", { class: "opt-row", hidden: true });
    this.ta = h("textarea", { id: "ta-" + key.replace(/[^\w-]/g, "_"), rows: 2, placeholder: placeholder || "问老师任何问题……（Enter 发送，Shift+Enter 换行）" });
    this.sendBtn = h("button", { class: "btn primary sm", type: "button" }, icon("send"), "发送");
    this.stopBtn = h("button", { class: "btn sm", type: "button", hidden: true }, icon("stop"), "停止");
    this.file = null;
    this.fileInput = null;
    const tools = [];
    if (images) {
      this.fileInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp,image/gif", id: "img-" + key.replace(/[^\w-]/g, "_") });
      this.fileInput.addEventListener("change", () => { this.file = this.fileInput.files[0] || null; });
      this.imgPick = h("label", { class: "file-pick", title: "附一张截图（题目、报错、手写思路都行）", hidden: !AI.images }, icon("image"), this.fileInput);
      tools.push(this.imgPick);
    }
    this.el.append(
      this.offEl,
      this.actEl || "",
      this.list,
      this.optRow,
      h("div", { class: "composer" }, this.ta, h("div", { class: "row" }, h("div", { class: "row" }, tools), h("div", { class: "row" }, this.stopBtn, this.sendBtn))),
    );
    this.ta.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.submit(); }
    });
    this.ta.addEventListener("input", () => { this.ta.style.height = "auto"; this.ta.style.height = Math.min(160, this.ta.scrollHeight + 2) + "px"; });
    this.sendBtn.addEventListener("click", () => this.submit());
    this.stopBtn.addEventListener("click", () => { if (this.ctl) this.ctl.abort(); });
    if (this.actEl) for (const a of this.actions) {
      const b = h("button", { class: "chip", type: "button", title: a.title || "" }, a.label);
      b.addEventListener("click", () => { if (!this.busy) a.run(this); });
      a.btn = b;
      this.actEl.append(b);
    }
    if (!this.msgs.length && intro) this.list.append(this.introEl = h("div", { class: "msg ai" }, h("div", { class: "who" }, h("b", null, "题眼"), "老师"), h("div", { class: "md muted" }, intro)));
    for (const m of this.msgs) this.renderMsg(m, false);
    this.sync();
  }
  sync() {
    const ok = AI.ok();
    this.offEl.hidden = ok;
    if (S.ai === "locked") {
      if (!this.offEl.querySelector("form")) {
        this.offEl.textContent = "";
        const pw = h("input", { type: "password", id: "pw-" + this.key.replace(/[^\w-]/g, "_"), placeholder: "访问密码", autocomplete: "current-password", style: "padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0;flex:1" });
        const msg = h("span", { class: "small" });
        const form = h("form", { class: "row", style: "flex-wrap:nowrap" }, h("span", null, "AI 老师需要访问密码："), pw, h("button", { class: "btn primary sm", type: "submit" }, "解锁"));
        form.addEventListener("submit", async e => {
          e.preventDefault();
          msg.textContent = "验证中……";
          const ok2 = await AI.unlock(pw.value.trim());
          msg.textContent = ok2 ? "" : "密码不对。";
        });
        this.offEl.append(form, msg);
      }
    } else if (S.ai === "needkey") {
      if (!this.offEl.querySelector("form")) {
        this.offEl.textContent = "";
        this.offEl.append(h("div", { style: "margin-bottom:6px" }, "填上你的 DeepSeek API key，AI 老师就能用了："), keyForm());
      }
    } else {
      this.offEl.textContent = S.ai === "unknown" ? "正在连接 AI 老师……"
        : S.ai === "nokey" ? "服务器还没配置 DeepSeek API key：把 key 存到 ~/.deepseek_key（或 .dev.vars）后重启 server.mjs。题目、模板、判题和复习不受影响。"
        : "连不上 AI 服务：确认 server.mjs 正在运行。题目、模板、判题和复习不受影响。";
    }
    if (this.imgPick) this.imgPick.hidden = !AI.images;
    for (const a of this.actions) if (a.btn) a.btn.disabled = this.busy || !ok || (a.enabled ? !a.enabled() : false);
    this.sendBtn.disabled = this.busy || !ok;
    this.stopBtn.hidden = !this.busy;
  }
  setMode(mode) {
    this.mode = mode;
    this.optRow.textContent = "";
    this.optRow.hidden = !mode;
    if (!mode) return;
    this.optRow.append(h("span", null, mode.hint), mode.extra || "", h("button", { class: "btn ghost sm", type: "button", onclick: () => this.setMode(null) }, "取消"));
    if (mode.placeholder) this.ta.placeholder = mode.placeholder;
    this.ta.focus();
  }
  submit() {
    const text = this.ta.value.trim();
    if (this.mode) {
      const m = this.mode;
      if (!text && !m.allowEmpty) { this.ta.focus(); return; }
      this.ta.value = "";
      this.setMode(null);
      m.send(text);
      return;
    }
    if (!text && !this.file) return;
    this.ta.value = "";
    this.ta.style.height = "auto";
    const imgs = this.file ? [this.file] : null;
    this.file = null;
    if (this.fileInput) this.fileInput.value = "";
    this.send(text || "请看我附的截图。", { display: text + (imgs ? "（附图）" : ""), images: imgs });
  }
  scroll() { this.list.scrollTop = this.list.scrollHeight; }
  renderMsg(m, live) {
    if (this.introEl) { this.introEl.remove(); this.introEl = null; }
    if (m.role === "user") {
      const b = h("div", { class: "bubble" }, m.label ? h("span", { class: "act" }, "【" + m.label + "】") : "", m.label ? (m.display ? " " + m.display : "") : (m.display || m.content));
      this.list.append(h("div", { class: "msg user" }, b));
      this.scroll();
      return null;
    }
    const md = h("div", { class: "md" });
    const status = h("div", { class: "thinking", hidden: !live }, "老师在想……");
    const note = h("div", { class: "small faint", hidden: true });
    const tools = h("div", { class: "msg-tools", hidden: live });
    const wrap = h("div", { class: "msg ai" }, h("div", { class: "who" }, h("b", null, "题眼"), "老师"), status, md, note, tools);
    if (m.node) md.append(m.node);
    else if (m.content) renderMd(md, m.content);
    const addTools = () => {
      tools.textContent = "";
      if (TTS.ok && m.content) {
        const sb = h("button", { class: "btn ghost sm", type: "button" }, icon("speak"), "朗读");
        sb.addEventListener("click", () => {
          if (wrap.classList.contains("speaking")) { TTS.stop(); wrap.classList.remove("speaking"); sb.lastChild.textContent = "朗读"; return; }
          $$(".msg.speaking").forEach(x => x.classList.remove("speaking"));
          wrap.classList.add("speaking"); sb.lastChild.textContent = "停止朗读";
          TTS.speak(m.content, () => { wrap.classList.remove("speaking"); sb.lastChild.textContent = "朗读"; });
        });
        tools.append(sb);
      }
      if (m.content) {
        const cb = h("button", { class: "btn ghost sm", type: "button" }, icon("copy"), "复制");
        cb.addEventListener("click", () => copyText(m.content, cb.lastChild));
        tools.append(cb);
      }
      tools.hidden = !tools.childNodes.length;
    };
    if (!live) addTools();
    this.list.append(wrap);
    this.scroll();
    return {
      wrap, md, status,
      progress: t => { status.hidden = false; status.textContent = t; },
      note: t => { note.hidden = !t; note.textContent = t || ""; },
      done: () => { status.hidden = true; tools.hidden = false; addTools(); },
    };
  }
  addNode(node) {
    const m = { role: "assistant", content: "", node };
    this.renderMsg(m, false);
  }
  setBusy(b) { this.busy = b; this.sync(); }
  async send(prompt, o = {}) {
    if (!AI.ok()) { toast(aiErr({ code: S.ai === "denied" ? "not_granted" : "unavailable" })); return null; }
    if (this.busy) return null;
    const userMsg = { role: "user", content: prompt, label: o.label || "", display: o.display != null ? o.display : (o.label ? "" : prompt) };
    this.msgs.push(userMsg);
    this.renderMsg(userMsg, false);
    const aiMsg = { role: "assistant", content: "" };
    const view = this.renderMsg(aiMsg, true);
    this.setBusy(true);
    const ctl = this.ctl = new AbortController();
    const turns = [{ role: "user", content: this.context() }];
    for (const m of this.msgs.slice(-12)) if (m.content) turns.push({ role: m.role, content: clip(m.content, 6000) });
    let latest = "", queued = false;
    const paint = () => { queued = false; renderMd(view.md, latest); this.scroll(); };
    let out = null;
    try {
      const res = await AI.ask(turns, {
        signal: ctl.signal, tier: o.tier, images: o.images || undefined,
        tools: o.tools ? o.tools(view) : undefined,
        onText: ({ text }) => { latest = text; view.status.hidden = true; if (!queued) { queued = true; requestAnimationFrame(paint); } },
      });
      aiMsg.content = res.text;
      renderMd(view.md, res.text);
      if (res.truncated) view.note("回答太长被截断了，可以说“接着讲”。");
      this.msgs.push(aiMsg);
      out = res.text;
    } catch (e) {
      const part = e && e.text;
      if (part) { aiMsg.content = part; renderMd(view.md, part); this.msgs.push(aiMsg); }
      const msg = aiErr(e);
      view.note(msg || (part ? "已停止。" : "已停止。"));
    } finally {
      view.done();
      this.ctl = null;
      this.setBusy(false);
      this.scroll();
    }
    if (out && o.onDone) o.onDone(out);
    return out;
  }
}

// AI 能调用的页面工具：真跑 Python，避免它“脑补”运行结果
function pyTools(p) {
  return view => {
    const tools = [{
      name: "run_python", needsPy: true,
      description: "在浏览器里的 Python 3.12 中运行一段完整代码，返回 {stdout, error}。可以直接用 ListNode、TreeNode、build_list(数组)、build_tree(层序数组)、list_values(链表)、tree_values(树)，以及 collections / heapq / bisect / functools 等标准库。单次限时 8 秒。",
      inputSchema: { type: "object", properties: { code: { type: "string", description: "要运行的 Python 代码，用 print 输出你需要看的结果" } }, required: ["code"] },
      execute: async input => {
        view.progress("正在运行 Python 代码核对……");
        try { return await Py.json("run_snippet", [String(input.code || ""), ""], 8000); }
        catch (e) { throw new Error(e.message || "运行失败"); }
      },
    }];
    if (p && p.solution) tools.push({
      name: "compare_with_reference", needsPy: true,
      description: "用学习者编辑器里的当前代码和参考解分别运行若干组输入，返回每组输入下两者的输出以及是否一致。inputs 是“参数列表”的数组，例如 [[[2,7,11,15], 9], [[3,3], 6]]；链表、树用数组表示（树用层序数组，空位写 null）。",
      inputSchema: { type: "object", properties: { inputs: { type: "array", items: { type: "array" }, description: "每一项是一组函数参数" } }, required: ["inputs"] },
      execute: async input => {
        const inputs = Array.isArray(input.inputs) ? input.inputs.filter(Array.isArray).slice(0, 40) : [];
        if (!inputs.length) throw new Error("inputs 不能为空，每一项是一组参数");
        view.progress(`正在用 ${inputs.length} 组输入对比你的代码和参考解……`);
        try { return await compareWithRef(p, S.ws && S.ws.cm ? S.ws.cm.getValue() : "", inputs); }
        catch (e) { throw new Error(e.message || "运行失败"); }
      },
    });
    return tools;
  };
}
async function compareWithRef(p, code, inputs) {

  if (!good.length) return { error: "这些输入在参考解上都报错，可能不符合题目约束：" + ((refs[0] && refs[0].error) || "") };

  if (r.compile_error) return { error: "学习者的代码无法运行：" + r.compile_error };
