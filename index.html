(\"round(3.5):\", round(3.5))\nprint(\"普通除法:\", 5 / 2)\nprint(\"整数除法:\", 5 // 2)","output":"round(2.5): 2\nround(3.5): 4\n普通除法: 2.5\n整数除法: 2\n"},{"title":"可变对象别名","code":"a = [1, 2]\nb = a\nb.append(3)\nprint(\"a也变了:\", a)\nprint(\"复制后独立:\", a.copy())","output":"a也变了: [1, 2, 3]\n复制后独立: [1, 2, 3]\n"}],"algo":"调试 WA、RE、TLE 时优先检查这些点，尤其是对象别名、除法、遍历删除和字符串拼接。","pitfalls":["`is` 不用于普通值相等判断","`round` 是银行家舍入，.5 不一定进位","函数内赋值全局变量前不声明会触发作用域问题"],"complexity":[["字符串循环 +=","可能 O(n^2)"],["列表推导重建","O(n)"],["倒序 pop 删除","最坏 O(n^2)"]]},{"id":"py-complexity","group":"易错点与速查","title":"常用操作复杂度速查","summary":"用复杂度判断该用哪种容器。","md":"### 语法要点\n刷题超时常来自“看起来一行，实际 O(n)”的操作。`x in list` 要线性扫描，放在循环里就是 O(n^2)；如果只做存在性判断，先转成 set。list 尾部操作快，头部操作慢。dict/set 查找平均 O(1)。deque 的两端操作 O(1)。heapq 维护堆顶 O(log n)。字符串不可变，拼接要小心。\n\n**复杂度速查**\n\n| 类型 | 常用操作 | 复杂度 |\n|---|---|---|\n| list | `a[i]`、尾部 `append/pop` | O(1) / 均摊 O(1) |\n| list | `x in a`、`pop(0)`、中间插入 | O(n) |\n| dict/set | 查找、插入、删除 | 平均 O(1) |\n| deque | 两端 append/pop | O(1) |\n| heapq | push/pop | O(log n) |\n| str | 切片、拼接结果 | O(k) |\n| sort | 排序 | O(n log n) |\n\n选择容器时先看操作：需要队头出队，用 deque；需要最小值动态变化，用 heap；需要判重，用 set；需要保持有序并二分，普通 list 插入仍是 O(n)，不要只看二分 O(log n)。","examples":[{"title":"list in 与 set in","code":"nums = list(range(5))\ns = set(nums)\nprint(\"list 查找:\", 4 in nums)\nprint(\"set 查找:\", 4 in s)\nprint(\"不存在:\", 9 in s)","output":"list 查找: True\nset 查找: True\n不存在: False\n"},{"title":"队列选择","code":"from collections import deque\nq = deque([1, 2, 3])\nq.append(4)\nprint(\"队头:\", q.popleft())\nprint(\"剩余:\", list(q))","output":"队头: 1\n剩余: [2, 3, 4]\n"},{"title":"堆操作复杂度","code":"import heapq\nh = []\nfor x in [4, 1, 3]:\n    heapq.heappush(h, x)\nprint(\"最小:\", heapq.heappop(h))\nprint(\"堆:\", h)","output":"最小: 1\n堆: [3, 4]\n"}],"algo":"做复杂度分析、替换超时容器、判断嵌套循环是否可接受时使用。","pitfalls":["`x in list` 在循环里常导致 O(n^2)","`bisect` 查找快但 list 插入慢","切片和字符串拼接都会创建新对象"],"complexity":[["list membership","O(n)"],["set/dict membership","平均 O(1)"],["heap push/pop","O(log n)"]]},{"id":"py-cheatsheet","group":"易错点与速查","title":"刷题速查卡","summary":"把常用写法按目标快速定位。","md":"### 一页纸速查\n\n| 想做 X | 写 Y |\n|---|---|\n| 默认值计数 | `cnt[x] = cnt.get(x, 0) + 1` |\n| 更快计数 | `Counter(nums)` |\n| 默认列表分组 | `defaultdict(list)` |\n| 判重 | `seen = set()` |\n| 坐标入集合 | `seen.add((r, c))` |\n| 队列 BFS | `q = deque([start]); q.popleft()` |\n| 栈 | `st.append(x); st.pop()` |\n| 小顶堆 | `heappush(h, x)` |\n| 大顶堆 | `heappush(h, -x)` |\n| 前 k 大 | 维护大小为 k 的小顶堆 |\n| 二分左边界 | `bisect_left(a, x)` |\n| 二分右边界 | `bisect_right(a, x)` |\n| 排序多关键字 | `key=lambda x: (x[0], -x[1])` |\n| 反转列表 | `a[::-1]` |\n| 安全二维数组 | `[[0]*n for _ in range(m)]` |\n| 前缀和 | `list(accumulate(nums, initial=0))` |\n| 区间和 | `pre[r] - pre[l]` |\n| 记忆化 DFS | `@cache` |\n| 状态可哈希 | `tuple(state)` |\n| 字母下标 | `ord(c) - ord('a')` |\n| 拼字符串 | `''.join(parts)` |\n| 存在满足 | `any(cond for x in nums)` |\n| 全部满足 | `all(cond for x in nums)` |\n| 商和余数 | `divmod(x, k)` |\n| 快速幂取模 | `pow(a, b, mod)` |\n| 最低位 1 | `x & -x` |\n| 删除最低位 1 | `x & (x-1)` |\n| bit 个数 | `x.bit_count()` |\n| 快读 | `sys.stdin.readline()` |\n| 批量输出 | `print('\n'.join(ans))` |\n\n用这张表时先定位“操作需求”，再选容器或语法。写完后立刻检查复杂度：是否有循环里的切片、`in list`、`pop(0)`、字符串 `+=`。","examples":[{"title":"两数之和模板","code":"nums = [2, 7, 11, 15]\ntarget = 9\npos = {}\nfor i, x in enumerate(nums):\n    if target - x in pos:\n        print(\"答案:\", [pos[target - x], i])\n        break\n    pos[x] = i","output":"答案: [0, 1]\n"},{"title":"BFS 最短步数模板","code":"from collections import deque\ngrid = [[0, 0], [1, 0]]\nq = deque([(0, 0, 0)])\nseen = {(0, 0)}\nwhile q:\n    r, c, d = q.popleft()\n    if (r, c) == (1, 1):\n        print(\"距离:\", d)\n        break\n    for dr, dc in [(1, 0), (0, 1)]:\n        nr, nc = r + dr, c + dc\n        if 0 <= nr < 2 and 0 <= nc < 2 and grid[nr][nc] == 0 and (nr, nc) not in seen:\n            seen.add((nr, nc)); q.append((nr, nc, d + 1))","output":"距离: 2\n"},{"title":"记忆化搜索模板","code":"from functools import cache\n@cache\ndef ways(n):\n    if n <= 1:\n        return 1\n    return ways(n - 1) + ways(n - 2)\nprint(\"爬楼梯:\", ways(5))","output":"爬楼梯: 8\n"},{"title":"前缀和模板","code":"from itertools import accumulate\nnums = [1, 2, 3, 4]\npre = list(accumulate(nums, initial=0))\nl, r = 1, 3\nprint(\"区间和:\", pre[r] - pre[l])","output":"区间和: 5\n"}],"algo":"临场忘写法时先查这一节。它覆盖哈希、队列、堆、二分、前缀和、记忆化和字符串构造等高频模板。","pitfalls":["速查卡只给写法，仍要按题目约束判断复杂度","模板里的边界如开闭区间要和题意对齐","复制模板后要检查变量名和初始化位置"],"complexity":[["哈希模板","平均 O(n)"],["BFS 模板","O(V+E)"],["前缀和查询","预处理 O(n)，查询 O(1)"]]}]}</script>

const Store = {
  coll: null, docs: {}, chains: {},
  async init() {
    this.docs = LS.get("tiyan:docs", {});
    applyDocs();
    let db = null, user = null;
    try { if (window.claude && window.claude.use) [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { /* 无 */ }
    if (!db || !user) { S.store = "local"; updateChips(); return; }
    let uid = null;
    try { uid = await user.id(); } catch (e) { uid = null; }
    if (!uid) { S.store = "local"; updateChips(); return; }
    this.coll = db.collection("data/users/" + uid);
    S.store = "db";
    updateChips();
    let migrated = false;
    this.coll.onSnapshot(snap => {
      const docs = {};
      for (const d of snap.docs) docs[d.id] = d.data();
      if (!migrated) {
        // 本机有、云端没有的记录（登录前做的题）：显示出来；等云端结果确定后再上传
        const localOnly = Object.keys(this.docs).filter(k => !(k in docs));
        for (const k of localOnly) docs[k] = this.docs[k];
        if (!snap.metadata || !snap.metadata.fromCache) {
          migrated = true;
          const src = this.docs;
          (async () => { for (const k of localOnly) await this.write(k, src[k]); })();
        }
      }
      this.docs = docs;
      LS.set("tiyan:docs", docs);
      applyDocs();
      softRefresh();
    }, err => {
      if (err && err.code === "revoked") { this.coll = null; S.store = "local"; updateChips(); }
    });
  },
  write(key, data) {
    if (!this.coll) return Promise.resolve();
    const prev = this.chains[key] || Promise.resolve();
    const next = prev.then(() => this.coll.doc(key).set(data)).catch(async e => {
      if (e && e.code === "unavailable") {
        await new Promise(r => setTimeout(r, 600 + Math.random() * 800));
        return this.coll.doc(key).set(data).catch(() => toast("云端暂时没保存上，已先存在本机"));
      }
      if (e && e.code === "quota_exceeded") toast("云端存储满了，删掉一些自建题目再试");
      else if (e && e.code === "invalid_argument") { this.coll = null; S.store = "local"; updateChips(); toast("没有云端写入权限，进度只存在本机"); }
    });
    this.chains[key] = next;
    return next;
  },
  put(key, data) {
    this.docs[key] = JSON.parse(JSON.stringify(data));
    LS.set("tiyan:docs", this.docs);
    applyDocs();
    softRefresh();
    return this.write(key, this.docs[key]);
  },
  remove(key) {
    delete this.docs[key];
    LS.set("tiyan:docs", this.docs);
    applyDocs();
    softRefresh();
    if (this.coll) return this.coll.doc(key).delete().catch(() => {});
    return Promise.resolve();
  },
};

const WORKER_SRC = `
let py = null;
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    try {
      importScripts(m.base + "pyodide.js");
      py = await loadPyodide({ indexURL: m.base, stdLibURL: m.base + "python_stdlib.wasm" });
      py.runPython(m.harness);
      self.postMessage({ type: "ready", version: py.version });
    } catch (err) {
      self.postMessage({ type: "fail", error: String((err && err.message) || err) });
    }
    return;
  }
  try {
    const f = py.globals.get(m.fn);
    const out = f(...m.args);
    if (f.destroy) f.destroy();
    self.postMessage({ id: m.id, ok: true, out: out });
  } catch (err) {
    self.postMessage({ id: m.id, ok: false, error: String((err && err.message) || err) });
  }
};`;
const Py = {
  worker: null, seq: 0, pending: new Map(), ready: null, resolveReady: null, error: "", version: "",
  start() {
    S.py = "loading"; updateChips();
    this.ready = new Promise(r => { this.resolveReady = r; });
    let base;
    try {
      base = new URL("pyodide/", location.href).href;
      if (!/^https?:/.test(base)) throw new Error("bad base");
    } catch (e) { return this.fail("拿不到运行时文件的地址"); }
    try {
      const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
      this.worker = new Worker(url);
    } catch (e) { return this.fail("浏览器不允许启动后台线程"); }
    this.worker.onmessage = e => {
      const m = e.data;
      if (m.type === "ready") { clearTimeout(this.bootTimer); S.py = "ready"; this.version = m.version; updateChips(); this.resolveReady(true); return; }
      if (m.type === "fail") { this.fail(m.error); return; }
      const p = this.pending.get(m.id);
      if (!p) return;
      this.pending.delete(m.id);
      clearTimeout(p.timer);
      if (m.ok) p.res(m.out); else p.rej({ message: m.error });
    };
    this.worker.onerror = e => { e.preventDefault && e.preventDefault(); if (S.py === "loading") this.fail(e.message || "运行时加载失败"); };
    this.worker.postMessage({ type: "init", base, harness: HARNESS });
    this.bootTimer = setTimeout(() => { if (S.py === "loading") this.fail("加载超时"); }, 90000);
  },
  fail(msg) {
    clearTimeout(this.bootTimer);
    S.py = "failed"; this.error = String(msg || "未知错误"); updateChips();
    if (this.resolveReady) this.resolveReady(false);
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.rej({ message: "Python 运行环境不可用" }); }
    this.pending.clear();
    try { this.worker && this.worker.terminate(); } catch (e) { /* ignore */ }
    softRefresh();
  },
  async call(fn, args, timeout = 8000) {
    const ok = await this.ready;
    if (!ok) throw { message: "Python 运行环境不可用：" + this.error, unavailable: true };
    const id = ++this.seq;
    return new Promise((res, rej) => {
      const timer = setTimeout(() => {
        this.pending.delete(id);
        rej({ timeout: true, message: `运行超过 ${Math.round(timeout / 1000)} 秒被终止：可能有死循环，或者复杂度太高` });
        this.restart();
      }, timeout);
      this.pending.set(id, { res, rej, timer });
      this.worker.postMessage({ id, fn, args });
    });
  },
  async json(fn, args, timeout) { return JSON.parse(await this.call(fn, args, timeout)); },
  restart() {
    try { this.worker.terminate(); } catch (e) { /* ignore */ }
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.rej({ message: "运行环境重启了，请再试一次" }); }
    this.pending.clear();
    this.start();
  },
};

    const last = out[out.length - 1];
    if (last && last.role === m.role) last.content += "\n\n" + m.content;
    else out.push({ role: m.role, content: m.content });
  }
  return out;
}

  const a = t.search(/[{[]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));

const TTS = {

  pick() {
    if (!this.ok) return;

    this.voice = vs.find(v => /zh[-_]CN/i.test(v.lang) && /Tingting|Xiaoxiao|Yunxi|Google/i.test(v.name)) || vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  },
  clean(md) {
    return String(md || "")
      .replace(/```[\s\S]*?```/g, "。这里有一段代码，请看屏幕。")
      .replace(/<details>[\s\S]*?<\/details>/g, "")
      .replace(/<[^>]+>/g, "")
      .replace(/`([^`]+)`/g, "$1")
      .replace(/!\[[^\]]*\]\([^)]*\)/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/^\s*\|?\s*:?-{2,}.*$/gm, "")

      .replace(/^#+\s*/gm, "")

      .replace(/\s+/g, " ")

    if (!this.ok) { onend && onend(); return; }

    if (!this.voice) this.pick();

    const parts = (this.clean(text).match(/[^。！？；\n!?;]+[。！？；\n!?;]?/g) || []).reduce((acc, s) => {
      const last = acc[acc.length - 1];
      if (last && (last + s).length < 120) acc[acc.length - 1] = last + s; else acc.push(s);
      return acc;
    }, []);
    if (!parts.length) { onend && onend(); return; }
    parts.forEach((t, i) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "zh-CN";
      if (this.voice) u.voice = this.voice;
      u.rate = this.rate;
      if (i === parts.length - 1) u.onend = () => { if (tok === this.token) { this.current = null; onend && onend(); } };

// ---------- AI 老师的公共规则与上下文 ----------
const TEACHER = `你是「题眼」算法陪练里的 AI 老师。学习者在准备大厂技术面试，用 Python 刷题；他的痛点是：死记硬背记不住、题目一变形就不会写。
教学原则：
1. 讲清“为什么这么写”：把每个关键写法和背后的理由对应起来，而不是只给答案；
2. 每次都点出这题的“题眼”（题目里哪句话提示了该用什么方法）和“核心一句话”；
3. 先引导、后给答案：除非学习者明确要求看答案，不要直接贴完整解答代码；
4. 用中文，口语化、准确、简洁；用 Markdown，代码用 \`\`\`python 代码块，引用学习者代码时写明行号；
5. 运行结果以页面提供的真实结果为准，不确定的地方直说，不要编造。`;

function problemBlock(p, withRef = true) {
  return [
    `【题目】${p.title}（${LEVEL[p.level] || ""}，题型：${pname(p)}）`,
    p.desc,
    "示例：\n" + (p.examples || []).map((e, i) => `${i + 1}. 输入：${e.input}　输出：${e.output}${e.note ? "　说明：" + e.note : ""}`).join("\n"),
    "约束：" + (p.constraints || []).join("；"),
    "函数签名：\n" + p.starter.trim(),
    p.change ? "【这是一道变体题，和原题的区别】" + p.change : "",
    withRef && p.solution ? "【参考解】（只用于判断对错和引导；学习者没要求看答案时，不要贴出完整参考代码）\n```python\n" + p.solution.trim() + "\n```\n复杂度：" + (p.complexity || "") : "",
  ].filter(Boolean).join("\n\n");
}
function runBlock(last) {
  if (!last) return "【最近一次运行】还没运行过。";
  const r = last.result;
  if (!r) return "【最近一次运行】" + (last.error || "运行失败");
  if (r.compile_error) return "【最近一次运行】代码无法运行：" + r.compile_error;
  const fails = r.cases.filter(c => !c.pass).slice(0, 3).map(c => `- 输入 ${clip(c.args, 300)}；期望 ${clip(c.expected, 200)}；${c.error ? "报错 " + c.error : "实际 " + clip(c.got, 200)}`);
  const slow = r.cases.filter(c => c.ms > 1000).length;
  return `【最近一次运行】（${last.all ? "全部用例" : "样例"}，真实运行）通过 ${r.passed}/${r.total}` +
    (fails.length ? "\n失败的用例：\n" + fails.join("\n") : "") +
    (slow ? `\n有 ${slow} 个用例耗时超过 1 秒，复杂度可能偏高。` : "") +
    (r.stdout ? "\nprint 输出：\n" + clip(r.stdout, 800) : "");
}

  setMode(mode) {

  renderMsg(m, live) {
    if (this.introEl) { this.introEl.remove(); this.introEl = null; }
    if (m.role === "user") {
      const b = h("div", { class: "bubble" }, m.label ? h("span", { class: "act" }, "【" + m.label + "】") : "", m.label ? (m.display ? " " + m.display : "") : (m.display || m.content));
      this.list.append(h("div", { class: "msg user" }, b));

      return null;
    }
    const md = h("div", { class: "md" });
    const status = h("div", { class: "thinking", hidden: !live }, "老师在想……");
    const note = h("div", { class: "small faint", hidden: true });

    const wrap = h("div", { class: "msg ai" }, h("div", { class: "who" }, h("b", null, "题眼"), "老师"), status, md, note, tools);
    if (m.node) md.append(m.node);
    else if (m.content) renderMd(md, m.content);
    const addTools = () => {
      tools.textContent = "";
      if (TTS.ok && m.content) {
        const sb = h("button", { class: "btn ghost sm", type: "button" }, icon("speak"), "朗读");
        sb.addEventListener("click", () => {
          if (wrap.classList.contains("speaking")) { TTS.stop(); wrap.classList.remove("speaking"); sb.lastChild.textContent = "朗读"; return; }
          $$(".msg.speaking").forEach(x => x.classList.remove("speaking"));
          wrap.classList.add("speaking"); sb.lastChild.textContent = "停止朗读";
          TTS.speak(m.content, () => { wrap.classList.remove("speaking"); sb.lastChild.textContent = "朗读"; });
        });
        tools.append(sb);
      }
      if (m.content) {
        const cb = h("button", { class: "btn ghost sm", type: "button" }, icon("copy"), "复制");
        cb.addEventListener("click", () => copyText(m.content, cb.lastChild));
        tools.append(cb);

    };
    if (!live) addTools();
    this.list.append(wrap);
    this.scroll();
    return {
      wrap, md, status,
      progress: t => { status.hidden = false; status.textContent = t; },
      note: t => { note.hidden = !t; note.textContent = t || ""; },
      done: () => { status.hidden = true; tools.hidden = false; addTools(); },
    };
  }
  addNode(node) {
    const m = { role: "assistant", content: "", node };
    this.renderMsg(m, false);
  }
  setBusy(b) { this.busy = b; this.sync(); }
  async send(prompt, o = {}) {
    if (!AI.ok()) { toast(aiErr({ code: S.ai === "denied" ? "not_granted" : "unavailable" })); return null; }
    if (this.busy) return null;
    const userMsg = { role: "user", content: prompt, label: o.label || "", display: o.display != null ? o.display : (o.label ? "" : prompt) };
    this.msgs.push(userMsg);
    this.renderMsg(userMsg, false);
    const aiMsg = { role: "assistant", content: "" };
    const view = this.renderMsg(aiMsg, true);
    this.setBusy(true);
    const ctl = this.ctl = new AbortController();
    const turns = [{ role: "user", content: this.context() }];
    for (const m of this.msgs.slice(-12)) if (m.content) turns.push({ role: m.role, content: clip(m.content, 6000) });
    let latest = "", queued = false;
    const paint = () => { queued = false; renderMd(view.md, latest); this.scroll(); };
    let out = null;
    try {
      const res = await AI.ask(turns, {
        signal: ctl.signal, tier: o.tier, images: o.images || undefined,
        tools: o.tools ? o.tools(view) : undefined,
        onText: ({ text }) => { latest = text; view.status.hidden = true; if (!queued) { queued = true; requestAnimationFrame(paint); } },
      });
      aiMsg.content = res.text;
      renderMd(view.md, res.text);
      if (res.truncated) view.note("回答太长被截断了，可以说“接着讲”。");
      this.msgs.push(aiMsg);
      out = res.text;
    } catch (e) {
      const part = e && e.text;
      if (part) { aiMsg.content = part; renderMd(view.md, part); this.msgs.push(aiMsg); }
      const msg = aiErr(e);
      view.note(msg || (part ? "已停止。" : "已停止。"));
    } finally {
      view.done();
      this.ctl = null;
      this.setBusy(false);
      this.scroll();
    }
    if (out && o.onDone) o.onDone(out);
    return out;
  }
}

// AI 能调用的页面工具：真跑 Python，避免它“脑补”运行结果
function pyTools(p) {
  return view => {
    const tools = [{
      name: "run_python", needsPy: true,
      description: "在浏览器里的 Python 3.12 中运行一段完整代码，返回 {stdout, error}。可以直接用 ListNode、TreeNode、build_list(数组)、build_tree(层序数组)、list_values(链表)、tree_values(树)，以及 collections / heapq / bisect / functools 等标准库。单次限时 8 秒。",
      inputSchema: { type: "object", properties: { code: { type: "string", description: "要运行的 Python 代码，用 print 输出你需要看的结果" } }, required: ["code"] },
      execute: async input => {
        view.progress("正在运行 Python 代码核对……");
        try { return await Py.json("run_snippet", [String(input.code || ""), ""], 8000); }
        catch (e) { throw new Error(e.message || "运行失败"); }
      },
    }];
    if (p && p.solution) tools.push({
      name: "compare_with_reference", needsPy: true,
      description: "用学习者编辑器里的当前代码和参考解分别运行若干组输入，返回每组输入下两者的输出以及是否一致。inputs 是“参数列表”的数组，例如 [[[2,7,11,15], 9], [[3,3], 6]]；链表、树用数组表示（树用层序数组，空位写 null）。",
      inputSchema: { type: "object", properties: { inputs: { type: "array", items: { type: "array" }, description: "每一项是一组函数参数" } }, required: ["inputs"] },
      execute: async input => {
        const inputs = Array.isArray(input.inputs) ? input.inputs.filter(Array.isArray).slice(0, 40) : [];
        if (!inputs.length) throw new Error("inputs 不能为空，每一项是一组参数");
        view.progress(`正在用 ${inputs.length} 组输入对比你的代码和参考解……`);
        try { return await compareWithRef(p, S.ws && S.ws.cm ? S.ws.cm.getValue() : "", inputs); }
        catch (e) { throw new Error(e.message || "运行失败"); }
      },
    });
    return tools;
  };
}
async function compareWithRef(p, code, inputs) {
  const tests = inputs.map(a => ({ args: a }));
  const refs = await Py.json("run_reference", [p.solution, specOf(p, tests)], 10000);
  const good = [];
  tests.forEach((t, i) => { if (refs[i] && !refs[i].error) good.push({ args: t.args, expected: refs[i].expected }); });
  if (!good.length) return { error: "这些输入在参考解上都报错，可能不符合题目约束：" + ((refs[0] && refs[0].error) || "") };
  const r = await Py.json("run_tests", [code, specOf(p, good)], 10000);
  if (r.compile_error) return { error: "学习者的代码无法运行：" + r.compile_error };
  return r.cases.map(c => ({ input: c.args, user: c.error ? "报错 " + c.error : c.got, reference: c.expected, same: !!c.pass }));
}

// ---------- AI 出题（变体 / 导入 / 按题型出新题） ----------
const PROBLEM_SCHEMA = `只返回一个 JSON 对象，不要其他文字。字段：
{"title": "题目名", "pattern": "从 ${PATTERNS.map(p => p.key).join(" / ")} 里选最贴切的一个", "level": "easy | medium | hard", "desc": "题面：中文 Markdown，2–5 句，变量名用反引号", "examples": [{"input": "nums = [1,2,3], k = 2", "output": "3", "note": "一句话说明，可为空"}], "constraints": ["1 <= len(nums) <= 10^5"], "fn": "方法名（camelCase）", "params": [["nums", "List[int]"], ["k", "int"]], "ret": "int", "types": [null, null], "ret_type": null, "compare": "exact", "tests": [{"args": [[1,2,3], 2], "expected": 3}], "solution": "class Solution:\\n    def 方法名(self, nums, k):\\n        ...", "complexity": "时间 O(n)，空间 O(1)", "hints": ["第 1 级：题型方向和识别信号", "第 2 级：核心思路 / 状态定义", "第 3 级：关键步骤"], "key": "核心一句话", "pitfalls": ["易错点 1", "易错点 2"]}
规则：
- types：参数是链表写 "ListNode"，二叉树写 "TreeNode"，链表数组写 "ListNode[]"，其余写 null；tests 里链表和树都写成数组（树用层序数组，空位 null）；
- ret_type：返回链表写 "ListNode"，返回树写 "TreeNode"；原地修改第 0 个参数、没有返回值写 "inplace0"；其余写 null；
- compare：结果顺序无所谓写 "unordered"，内外层顺序都无所谓写 "unordered_deep"，浮点数写 "float"，其余写 "exact"；
- tests 给 8–12 组：前两组和 examples 一致，然后覆盖边界，最后一组稍大（数组长度不超过 200）；每组输入都必须满足约束；
- solution：正确、简洁的 Python 参考解，class Solution，方法名与 fn 一致；页面会用它重新计算每组 expected；
- 只出“调用一个函数、比较返回值”的题；如果题目必须设计类（如 LRU 缓存）或交互式输入输出，返回 {"error": "原因"}。`;

function arrStr(a, n) { return Array.isArray(a) ? a.slice(0, n).map(x => String(x)) : []; }
function normalizeProblem(o, extra = {}) {
  if (!o || typeof o !== "object" || Array.isArray(o)) throw new Error("AI 没有返回题目");
  if (o.error) throw new Error(String(o.error));
  for (const k of ["title", "desc", "fn", "params", "ret", "tests", "solution"]) if (!o[k]) throw new Error("生成的题目缺少字段 " + k);
  const fn = String(o.fn);
  if (!/^[A-Za-z_]\w*$/.test(fn)) throw new Error("函数名不合法：" + fn);
  const params = (Array.isArray(o.params) ? o.params : []).map(x => Array.isArray(x) ? [String(x[0]), String(x[1] || "Any")] : [String(x && x.name), String((x && x.type) || "Any")]);
  if (!params.length || params.some(([n]) => !/^[A-Za-z_]\w*$/.test(n))) throw new Error("参数列表不合法");
  const T = ["ListNode", "TreeNode", "ListNode[]"];
  const types = params.map((_, i) => (Array.isArray(o.types) && T.includes(o.types[i])) ? o.types[i] : null);
  const tests = (Array.isArray(o.tests) ? o.tests : []).map(t => Array.isArray(t) ? { args: t } : (t && Array.isArray(t.args) ? ("expected" in t ? { args: t.args, expected: t.expected } : { args: t.args }) : null))
    .filter(t => t && t.args.length === params.length).slice(0, 16);
  if (tests.length < 3) throw new Error("可用的测试用例太少");
  const ret = String(o.ret);
  return Object.assign({
    id: "c-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    custom: true, createdAt: Date.now(),
    title: clip(o.title, 40), pattern: PMAP[o.pattern] ? o.pattern : "custom",
    level: ["easy", "medium", "hard"].includes(o.level) ? o.level : "medium",
    desc: String(o.desc),
    examples: (Array.isArray(o.examples) ? o.examples : []).slice(0, 4).map(e => ({ input: String((e && e.input) ?? ""), output: String((e && e.output) ?? ""), note: String((e && e.note) ?? "") })),
    constraints: arrStr(o.constraints, 8), fn, params, ret, types,
    ret_type: ["ListNode", "TreeNode", "inplace0"].includes(o.ret_type) ? o.ret_type : null,
    compare: ["exact", "unordered", "unordered_deep", "float"].includes(o.compare) ? o.compare : "exact",
    tests, solution: String(o.solution), complexity: String(o.complexity || ""),
    hints: arrStr(o.hints, 3), key: String(o.key || ""), pitfalls: arrStr(o.pitfalls, 4),
    starter: `class Solution:\n    def ${fn}(self, ${params.map(([n, t]) => `${n}: ${t}`).join(", ")}) -> ${ret}:\n        `,
    lc: null, slug: null,
    change: o.change ? String(o.change) : "",
  }, extra);
}
async function verifyProblem(p, step) {
  if (S.py === "loading") { step("等 Python 运行环境就绪……"); await Py.ready; }
  if (S.py !== "ready") {
    p.unverified = true;
    p.tests = p.tests.filter(t => "expected" in t);
    if (p.tests.length < 3) throw new Error("Python 运行环境不可用，而且 AI 没给出足够的答案，没法判题");
    return p;
  }
  step("用参考解重新计算每组用例的答案……");
  let refs;
  try { refs = await Py.json("run_reference", [p.solution, specOf(p, p.tests.map(t => ({ args: t.args })))], 15000); }
  catch (e) { throw new Error("参考解运行失败：" + (e.message || "")); }
  let fixed = 0;
  const tests = [];
  p.tests.forEach((t, i) => {
    const r = refs[i];
    if (!r || r.error) return;
    if ("expected" in t && JSON.stringify(t.expected) !== JSON.stringify(r.expected)) fixed++;
    tests.push({ args: t.args, expected: r.expected });
  });
  if (tests.length < 3) throw new Error("参考解在大多数用例上报错，这道题生成得不好，再试一次");
  p.tests = tests;
  p.fixed = fixed;
  return p;
}
async function generateProblem(prompt, { images, step, extra }) {
  step("AI 正在出题……（通常 20–60 秒）");
  const raw = await AI.ask(prompt, { json: true, tier: "complex", images });
  const p = normalizeProblem(raw, extra);
  await verifyProblem(p, step);
  if (JSON.stringify(p).length > 200000) throw new Error("题目太大了，存不下");
  await Store.put("x:" + p.id, p);
  return p;
}

function backupPanel() {
  const status = h("span", { class: "small muted" });
  const exp = h("button", { class: "btn sm", type: "button" }, "导出进度");
  exp.addEventListener("click", () => {
    const data = JSON.stringify({ app: "tiyan", version: 1, at: Date.now(), docs: Store.docs }, null, 1);
    const a = h("a", { href: URL.createObjectURL(new Blob([data], { type: "application/json" })), download: `题眼进度-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
    status.textContent = `已导出 ${Object.keys(Store.docs).length} 条记录。`;
  });
  const file = h("input", { type: "file", accept: "application/json,.json", id: "import-progress", hidden: true });
  const imp = h("button", { class: "btn sm", type: "button", onclick: () => file.click() }, "导入进度");
  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j || j.app !== "tiyan" || typeof j.docs !== "object") throw new Error("不是题眼导出的进度文件");
      let n = 0;
      for (const [k, d] of Object.entries(j.docs)) {
        if (!/^[pxv]:/.test(k)) continue;
        const cur = Store.docs[k];
        if (k.startsWith("p:") && cur && (cur.lastAt || 0) > (d.lastAt || 0)) continue;
        Store.docs[k] = d; n++;
      }
      LS.set("tiyan:docs", Store.docs);
      applyDocs(); softRefresh();
      toast(`导入了 ${n} 条记录`);
    } catch (e) { status.textContent = "导入失败：" + ((e && e.message) || e); }
    file.value = "";
  });
  return h("section", { class: "panel" },
    h("div", { class: "panel-h" }, h("h2", null, "备份进度"), h("span", { class: "small faint" }, "进度存在当前浏览器里；换浏览器、换设备，或者清理浏览器数据之前，先导出一份")),
    h("div", { class: "row" }, exp, imp, file, status));
}

const QUIZ = { score: 0, total: 0, cur: null, answered: false };
function viewQuiz() {
  const box = h("div", { class: "stack" });
  const scoreEl = h("span", { class: "small muted num" });
  const next = () => {
    const pool = S.all.filter(p => PMAP[p.pattern] && (!QUIZ.cur || p.id !== QUIZ.cur.id));
    QUIZ.cur = pool[Math.floor(Math.random() * pool.length)];
    QUIZ.answered = false;
    draw();
  };
  const draw = () => {
    const p = QUIZ.cur;
    scoreEl.textContent = QUIZ.total ? `本次 ${QUIZ.score} / ${QUIZ.total}` : "";
    box.textContent = "";
    const others = PATTERNS.filter(x => x.key !== p.pattern).sort(() => Math.random() - .5).slice(0, 3);
    const opts = [PMAP[p.pattern], ...others].sort(() => Math.random() - .5);
    const md = h("div", { class: "md" });
    renderMd(md, p.desc);
    const result = h("div", { class: "stack", hidden: true });
    const optsEl = h("div", { class: "quiz-opts" }, opts.map(o => {
      const b = h("button", { class: "quiz-opt", type: "button" }, o.name);
      b.addEventListener("click", () => {
        if (QUIZ.answered) return;
        QUIZ.answered = true; QUIZ.total++;
        const right = o.key === p.pattern;
        if (right) QUIZ.score++;
        $$(".quiz-opt", optsEl).forEach((x, i) => { x.disabled = true; if (opts[i].key === p.pattern) x.classList.add("right"); });
        if (!right) b.classList.add("wrong");
        scoreEl.textContent = `本次 ${QUIZ.score} / ${QUIZ.total}`;
        result.hidden = false;
        result.append(
          h("div", { class: "callout" + (right ? " blue" : "") }, h("b", null, right ? "认对了。" : `是「${pname(p)}」。`), " ", (p.hints && p.hints[0]) || ""),
          p.key ? h("p", null, h("span", { class: "faint small" }, "核心一句话　"), h("span", { class: "hl" }, p.key)) : "",
          h("div", { class: "row" }, h("span", { class: "muted" }, "这道题是：", h("b", null, p.title)), h("a", { class: "btn", href: "#p-" + p.id }, "去做这道题"), h("button", { class: "btn primary", type: "button", onclick: next }, "下一题")));
      });
      return b;
    }));
    box.append(h("div", { class: "panel" },
      h("div", { class: "spread" }, h("span", { class: "eyebrow" }, "只看题面：该用什么题型？"), h("span", { class: "lv " + p.level }, LEVEL[p.level])),
      md,
      p.examples && p.examples[0] ? h("div", { class: "example" }, h("b", null, "示例　"), `输入：${p.examples[0].input}\n输出：${p.examples[0].output}`) : "",
      optsEl, result));
  };
  if (!QUIZ.cur) next(); else draw();
  return h("div", { class: "page", style: "max-width:820px" },
    h("section", { class: "hero" }, h("div", { class: "eyebrow" }, "识题训练"), h("h1", null, "题目一变形就不会，多半是没认出题型"),
      h("p", { class: "lede" }, "这里只给题面、隐藏题名，让你判断该用什么方法。答完会告诉你识别信号在哪句话里。每天花 5 分钟混着练，专治“换个说法就不认识”。")),
    h("div", { class: "spread" }, scoreEl, h("button", { class: "btn ghost sm", type: "button", onclick: next }, "换一题")),
    box);
}

      for (const t of kbTokens(c.where)) tf.set(t, (tf.get(t) || 0) + 3);

      return { where: c.where, text: clip(c.text, 4000) };
    },
  }];
}

// ---------- 用户自己的笔记（可选，只存本浏览器） ----------
const NOTES = {
  docs: [],
  load() { try { this.docs = JSON.parse(localStorage.getItem("tiyan:kb:docs") || "[]") || []; } catch (e) { this.docs = []; } return this; },
  save() { try { localStorage.setItem("tiyan:kb:docs", JSON.stringify(this.docs)); return true; } catch (e) { toast("浏览器存储空间不够了：删掉一些笔记再试"); return false; } },
  add(title, md) {
    const d = { id: "n" + Date.now().toString(36), title: clip(title || "我的笔记", 60), md: kbClean(md), addedAt: Date.now() };
    this.docs.push(d);
    if (!this.save()) { this.docs.pop(); return null; }
    return d;
  },
  remove(id) { this.docs = this.docs.filter(d => d.id !== id); this.save(); },
};
function kbClean(md) {
  return String(md || "")
    .replace(/<!--[\s\S]*?-->/g, "").replace(/<title>[\s\S]*?<\/title>/g, "")
    .replace(/<whiteboard[^>]*\/?>(<\/whiteboard>)?/g, "（此处原文是一张画板）")
    .replace(/<cite[^>]*title="([^"]*)"[^>]*>(<\/cite>)?/g, "《$1》")
    .replace(/<\/?(callout|p|focus|project)[^>]*>/g, "\n")
    .replace(/\n{3,}/g, "\n\n").trim();
}
function noteChunks(d) {
  const out = [];
  let path = [], buf = [], n = 0;
  const flush = () => {
    const text = buf.join("\n").trim();
    buf = [];
    if (text.replace(/^#{1,4}\s.*$/gm, "").trim().length < 2) return;
    for (let i = 0; i < text.length; i += 1800) out.push({ id: `${d.id}~${n++}`, where: `我的笔记 › ${d.title}${path.length ? " › " + path.join(" › ") : ""}`, text: text.slice(i, i + 1800) });
  };
  let inCode = false;
  for (const line of d.md.split("\n")) {
    if (/^\s*```/.test(line)) inCode = !inCode;
    const m = !inCode && line.match(/^(#{1,4})\s+(.+)$/);
    if (m && buf.join("").replace(/^#{1,4}\s.*$/gm, "").trim().length >= 2) flush();
    if (m) { path = path.slice(0, m[1].length - 1); path[m[1].length - 1] = m[2].trim(); }
    buf.push(line);
  }
  flush();
  return out;
}

// ---------- 通用阅读页 ----------
function viewCourse(cfg) {
  const groups = cfg.groups();
  const all = groups.flatMap(g => g.sections);
  const lib = new Library(all.map(s => ({ id: s.id, where: `${s.course} › ${s.title}`, text: cfg.text(s) })).concat(cfg.extraItems ? cfg.extraItems() : []));
  const readKey = "tiyan:read:" + cfg.key;
  const readSet = new Set(LS.get(readKey, []));
  const markRead = id => { if (!readSet.has(id)) { readSet.add(id); LS.set(readKey, [...readSet]); drawNav(); } };
  let cur = LS.get("tiyan:sec:" + cfg.key, null);
  if (!all.find(s => s.id === cur)) cur = all[0] && all[0].id;

  if (!all.length) return h("div", { class: "page" }, h("h1", null, cfg.title), h("p", { class: "muted" }, "内容还没准备好。"));

  const outline = groups.map(g => `- ${g.name}\n` + g.sections.map(s => `  - ${s.title}（id: ${s.id}）`).join("\n")).join("\n");
  const chat = new Chat({
    key: "course:" + cfg.key,
    context: () => {
      const s = all.find(x => x.id === cur);
      return cfg.teacher + "\n\n【站内资料目录】\n" + clip(outline, 6000) + (s ? `\n\n【学习者正在读】${s.course} › ${s.title}（id: ${s.id}）` : "");
    },
    placeholder: cfg.placeholder,
    intro: cfg.intro,
    actions: cfg.chatActions || [],
  });
  const rawSend = chat.send.bind(chat);
  chat.send = (prompt, o = {}) => {
    if (!o.noPrefetch) {
      const hits = lib.search(prompt, 3);
      if (hits.length) prompt += "\n\n【可能相关的站内资料（本地检索，可能不全）】\n" + hits.map(c => `[${c.id}]【${c.where}】\n${clip(c.text, 1400)}`).join("\n\n");
    }
    const tools = libTools(lib);
    const extra = cfg.extraTools;
    return rawSend(prompt, Object.assign({ tools: view => tools(view).concat(extra ? extra(view) : []) }, o));
  };
  S.liveChats = [chat];
  onLeave(() => { S.liveChats = []; if (chat.ctl) chat.ctl.abort(); });

  // 左栏：目录
  const nav = h("nav", { class: "course-nav", "aria-label": cfg.title + "目录" });
  const sel = h("select", { class: "btn sm course-select", id: "sel-" + cfg.key, "aria-label": "选择小节" });
  function drawNav() {
    nav.textContent = "";
    sel.textContent = "";
    for (const g of groups) {
      const done = g.sections.filter(s => readSet.has(s.id)).length;
      nav.append(h("div", { class: "cn-group" }, h("b", null, g.name), h("span", { class: "small faint num" }, `${done}/${g.sections.length}`)));
      const og = h("optgroup", { label: g.name });
      for (const s of g.sections) {
        const b = h("button", { type: "button", class: "cn-item" + (s.id === cur ? " on" : "") + (readSet.has(s.id) ? " read" : "") }, s.title);
        b.addEventListener("click", () => open(s.id));
        nav.append(b);
        og.append(h("option", { value: s.id, selected: s.id === cur }, s.title));
      }
      sel.append(og);
    }
  }
  sel.addEventListener("change", () => open(sel.value));

  // 搜索
  const q = h("input", { type: "search", id: "q-" + cfg.key, placeholder: cfg.searchHint, class: "course-search" });
  const results = h("div", { class: "course-results", hidden: true });
  q.addEventListener("input", () => {
    const v = q.value.trim();
    results.textContent = "";
    if (!v) { results.hidden = true; return; }
    const hits = lib.search(v, 8).filter(c => all.find(s => s.id === c.id));
    results.hidden = false;
    if (!hits.length) results.append(h("div", { class: "small faint", style: "padding:8px" }, "没找到，换个词试试，或者直接问右边的 AI。"));
    for (const c of hits) {
      const b = h("button", { type: "button", class: "cn-item" }, c.where);
      b.addEventListener("click", () => { q.value = ""; results.hidden = true; open(c.id); });
      results.append(b);
    }
  });

  // 中间：正文
  const body = h("article", { class: "course-body" });
  const selBtn = h("button", { class: "btn primary sm kb-ask", type: "button", hidden: true }, "问 AI 这段");
  let selText = "";
  selBtn.addEventListener("mousedown", e => e.preventDefault());
  selBtn.addEventListener("click", () => {
    selBtn.hidden = true;
    const s = all.find(x => x.id === cur);
    chat.send(`我没看懂这段：「${clip(selText, 1500)}」（出自【${s.course} › ${s.title}】）。请用大白话解释它在说什么、为什么，必要时举个例子。`, { label: "问 AI 这段", display: clip(selText, 80) });
  });
  body.addEventListener("mouseup", () => setTimeout(() => {
    const ws = window.getSelection();
    selText = ws ? String(ws).trim() : "";
    if (selText.length < 2 || !body.contains(ws.anchorNode)) { selBtn.hidden = true; return; }
    const r = ws.getRangeAt(0).getBoundingClientRect();
    const box = body.getBoundingClientRect();
    selBtn.style.top = (r.bottom - box.top + 6) + "px";
    selBtn.style.left = Math.max(0, Math.min(r.left - box.left, box.width - 110)) + "px";
    selBtn.hidden = false;
  }, 0));

  function open(id) {
    cur = id;
    LS.set("tiyan:sec:" + cfg.key, id);
    const s = all.find(x => x.id === id);
    const i = all.indexOf(s);
    body.textContent = "";
    const md = h("div", { class: "md course-md" });
    renderMd(md, s.md);
    const act = (label, prompt) => h("button", { class: "chip", type: "button", onclick: () => chat.send(`${prompt}\n\n【这一节：${s.course} › ${s.title}】\n${clip(cfg.text(s), 4000)}`, { label: `${label}：${clip(s.title, 18)}`, noPrefetch: true }) }, label);
    body.append(
      h("div", { class: "eyebrow" }, `${s.course} · 第 ${(groups.find(g => g.sections.includes(s)) || { sections: [s] }).sections.indexOf(s) + 1} 节`),
      h("h1", { class: "course-title" }, s.title),
      s.summary ? h("div", { class: "oneline" }, s.summary) : "",
      h("div", { class: "row course-actions" }, cfg.sectionActions.map(([l, p]) => act(l, p))),
      md,
      cfg.extra(s),
      h("div", { class: "spread course-pager" },
        i > 0 ? h("button", { class: "btn sm", type: "button", onclick: () => { markRead(s.id); open(all[i - 1].id); } }, "← " + clip(all[i - 1].title, 14)) : h("span"),
        h("button", { class: "btn sm" + (readSet.has(s.id) ? "" : " primary"), type: "button", onclick: () => { markRead(s.id); if (i < all.length - 1) open(all[i + 1].id); else toast("这一模块读完了"); } }, i < all.length - 1 ? "读完了，下一节 → " + clip(all[i + 1].title, 14) : "读完了")),
      selBtn);
    drawNav();
    const top = body.getBoundingClientRect().top + window.scrollY - 80;
    if (window.scrollY > top) window.scrollTo(0, Math.max(0, top));
  }

  drawNav();
  open(cur);
  return h("div", { class: "page wide course-page" },
    h("section", { class: "hero", style: "gap:8px" }, h("div", { class: "eyebrow" }, cfg.eyebrow), h("h1", null, cfg.title), h("p", { class: "lede" }, cfg.lede)),
    h("div", { class: "course-grid" },
      h("aside", { class: "course-side" }, q, results, nav),
      h("div", { class: "course-main" }, h("div", { class: "course-top" }, sel), body, cfg.footer ? cfg.footer() : ""),
      h("div", { class: "inline-ai course-chat" }, chat.el)));
}

function qaList(title, list, open) {

function exampleBlock(ex) {
  const wrap = h("div", { class: "py-ex" });
  const head = h("div", { class: "py-ex-h" }, h("b", null, ex.title));
  const edEl = h("div", { class: "py-ex-ed" });
  const out = h("pre", { class: "py-ex-out" }, ex.output || "");
  const runBtn = h("button", { class: "btn sm", type: "button" }, icon("run"), "运行");
  const resetBtn = h("button", { class: "btn ghost sm", type: "button" }, "还原");
  head.append(h("div", { class: "row" }, resetBtn, runBtn));
  wrap.append(head, edEl, h("div", { class: "py-ex-label small faint" }, "输出"), out);
  const cm = CodeMirror(edEl, { value: ex.code, mode: "python", theme: "tiyan", lineNumbers: false, indentUnit: 4, tabSize: 4, viewportMargin: Infinity, extraKeys: { Tab: c => c.replaceSelection("    ", "end"), "Cmd-Enter": () => run(), "Ctrl-Enter": () => run() } });
  requestAnimationFrame(() => cm.refresh());
  async function run() {
    runBtn.disabled = true;
    out.textContent = S.py === "ready" ? "运行中……" : "Python 运行环境加载中……";
    out.classList.remove("err");
    try {
      const r = await Py.json("run_snippet", [cm.getValue(), ex.stdin || ""], 8000);
      out.textContent = (r.stdout || "") + (r.error ? (r.stdout ? "\n" : "") + r.error : "") || "（没有输出：用 print 打印结果）";
      if (r.error) out.classList.add("err");
    } catch (e) { out.textContent = e.message || String(e); out.classList.add("err"); }
    runBtn.disabled = false;
  }
  runBtn.addEventListener("click", run);
  resetBtn.addEventListener("click", () => { cm.setValue(ex.code); out.textContent = ex.output || ""; out.classList.remove("err"); });
  if (ex.stdin) wrap.insertBefore(h("div", { class: "small faint" }, "标准输入：", h("code", null, clip(ex.stdin.replace(/\n/g, " ⏎ "), 80))), out.previousSibling);
  return wrap;
}

    intro: "告诉我你想实现什么，我给你 Python 写法和能运行的例子；需要的话我会真实运行代码确认输出。",
    chatActions: [
      { label: "最容易忘的 10 个写法", run: c => c.send("列出刷算法题时最容易忘、但最常用的 10 个 Python 写法，每个给一行代码和一句用途。", { label: "最容易忘的 10 个写法" }) },
      { label: "考我写法", run: c => c.send("出一道“我想做 X，用 Python 怎么写”的小题考我（比如把列表按某规则排序、统计频次取前 k），只出题，等我写完再点评。", { label: "考我写法", noPrefetch: true }) },
      { label: "C++/Java 写法怎么换成 Python", run: c => c.send("我习惯 C++ / Java 的哪些写法在 Python 里有更简单的等价写法？列一张对照表（优先队列、哈希表、栈、队列、排序比较器、字符串处理等）。", { label: "C++/Java → Python" }) },
    ],
    sectionActions: [
      ["讲解这一节", "请讲解这一节：先说刷题时什么时候会用到，再讲关键写法和复杂度，最后说最容易错的 2 个地方，每个写法配一行代码。"],
      ["出 3 道小练习", "根据这一节出 3 道写法小练习（每道题要求我写出 1–5 行 Python），由易到难。每题用 <details><summary>题目</summary>参考写法和输出</details> 的格式。"],
      ["用在哪些题", "这一节的写法在哪些经典算法题里会用到？列出 4–6 道题（写题名和简短说明），并给出其中一道题里的关键代码行。"],
      ["对比相近写法", "把这一节的写法和容易混淆的相近写法做一张对比表：写法、作用、复杂度、什么时候用哪个。"],
    ],
    extra: s => h("div", { class: "stack", style: "gap:18px" },
      s.examples && s.examples.length ? h("section", { class: "stack", style: "gap:10px" }, h("h3", null, "可运行的例子"), s.examples.map(exampleBlock)) : "",
      s.algo ? h("div", { class: "callout blue" }, h("b", null, "刷题里怎么用："), s.algo) : "",
      s.pitfalls && s.pitfalls.length ? h("section", { class: "stack", style: "gap:8px" }, h("h3", null, "易错点"), h("ul", { class: "signals" }, s.pitfalls.map(p => h("li", null, h("span", null, p))))) : "",
      s.complexity && s.complexity.length ? h("section", { class: "stack", style: "gap:8px" }, h("h3", null, "复杂度"), h("div", { class: "scroll-x" }, h("table", { class: "ptable" }, h("tbody", null, s.complexity.map(r => h("tr", null, h("td", { class: "mono" }, r[0]), h("td", null, r[1]))))))) : ""),
  });
}

// ---------- 启动 ----------
(function boot() {
  Store.init();
  updateChips();
  window.addEventListener("hashchange", render);
  render();
  Py.start();
  AI.init();
  // 可安装的网页应用：缓存页面、前端库和 Python 运行环境，离线也能刷题判题
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 不支持就算了 */ });
  }
})();

</script>
</body>
</html>
