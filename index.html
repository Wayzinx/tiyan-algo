:root {
  --paper: #F1F4EF;
  --grid: #E2E8DF;
  --surface: #FBFCFA;
  --surface-2: #EBF0E9;
  --ink: #1B2632;
  --ink-2: #4E5C6A;
  --ink-3: #82909C;
  --line: #CCD6CA;
  --accent: #2A4FA3;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E8F7;
  --red: #BB3A2C;
  --red-soft: #F7E3DF;
  --green: #2B7649;
  --green-soft: #DFEFE4;
  --amber: #9A620A;
  --amber-soft: #F5EBD3;
  --hl: rgba(240, 214, 90, .45);
  --syn-kw: #7A3E9D;
  --syn-def: #2A4FA3;
  --syn-str: #2B7649;
  --syn-num: #A0560A;
  --syn-com: #8593A0;
  --syn-builtin: #0F6E79;
  --shadow: 0 1px 2px rgba(27, 38, 50, .06), 0 6px 18px rgba(27, 38, 50, .06);
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --brush: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --r: 8px;
  --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #161F1C;
    --grid: #1D2824;
    --surface: #1C2622;
    --surface-2: #22302B;
    --ink: #E3EAE2;
    --ink-2: #A7B4AC;
    --ink-3: #73817A;
    --line: #33423C;
    --accent: #93B3FF;
    --accent-ink: #0E1A33;
    --accent-soft: #233150;
    --red: #FF8E7F;
    --red-soft: #3F2623;
    --green: #7BD09B;
    --green-soft: #1E3A2A;
    --amber: #E8B860;
    --amber-soft: #3A2F1A;
    --hl: rgba(232, 200, 80, .22);
    --syn-kw: #D6A7F0;
    --syn-def: #93B3FF;
    --syn-str: #8ED5A7;
    --syn-num: #F0B96E;
    --syn-com: #74827A;
    --syn-builtin: #7FD2DB;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #161F1C;
  --grid: #1D2824;
  --surface: #1C2622;
  --surface-2: #22302B;
  --ink: #E3EAE2;
  --ink-2: #A7B4AC;
  --ink-3: #73817A;
  --line: #33423C;
  --accent: #93B3FF;
  --accent-ink: #0E1A33;
  --accent-soft: #233150;
  --red: #FF8E7F;
  --red-soft: #3F2623;
  --green: #7BD09B;
  --green-soft: #1E3A2A;
  --amber: #E8B860;
  --amber-soft: #3A2F1A;
  --hl: rgba(232, 200, 80, .22);
  --syn-kw: #D6A7F0;
  --syn-def: #93B3FF;
  --syn-str: #8ED5A7;
  --syn-num: #F0B96E;
  --syn-com: #74827A;
  --syn-builtin: #7FD2DB;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
  color: var(--ink);
  font: 15px/1.65 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 900; line-height: 1.3; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; }
h2 { font-size: 21px; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; }
code, pre, kbd { font-family: var(--mono); }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 1360px; margin: 0 auto; padding-inline: 16px;
  height: var(--top); display: flex; align-items: center; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none !important; flex: none; }
.brand-mark { position: relative; font-family: var(--brush); font-size: 27px; line-height: 1; letter-spacing: .02em; }
.brand-mark .eye { position: relative; display: inline-block; }
.brand-mark svg { position: absolute; left: -7px; top: -6px; width: calc(100% + 14px); height: calc(100% + 12px); overflow: visible; pointer-events: none; }
.brand-sub { font-size: 12px; color: var(--ink-3); letter-spacing: .08em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  padding: 6px 12px; border-radius: 6px; color: var(--ink-2); white-space: nowrap; font-size: 14px;
  text-decoration: none !important;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.nav .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--red); color: var(--surface); font-size: 11px; line-height: 18px; text-align: center; font-weight: 600; }
.status-chips { display: flex; gap: 6px; flex: none; }
.schip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding: 3px 9px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); white-space: nowrap; }
.schip i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.schip.ok i { background: var(--green); }
.schip.warn i { background: var(--amber); }
.schip.bad i { background: var(--red); }
.schip.load i { background: var(--amber); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- layout ---------- */
.page { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
.page.wide { max-width: 1360px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.grid-home { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
@media (max-width: 900px) {
  .grid-2, .grid-home { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 25px; }
}
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; align-content: start; }
.panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; }
.lede { font-size: 16px; color: var(--ink-2); max-width: 62ch; }

/* ---------- buttons, chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px; white-space: nowrap;
  text-decoration: none !important; transition: background .15s, border-color .15s;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.red { background: var(--red); border-color: var(--red); color: var(--surface); font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn svg { width: 15px; height: 15px; flex: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.lv { font-size: 12px; font-weight: 600; white-space: nowrap; }
.lv.easy { color: var(--green); }
.lv.medium { color: var(--amber); }
.lv.hard { color: var(--red); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 9px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
.pill.todo { color: var(--ink-3); border-color: var(--line); }
.pill.trying { color: var(--amber); background: var(--amber-soft); }
.pill.passed { color: var(--green); background: var(--green-soft); }
.pill.due { color: var(--red); background: var(--red-soft); }
.pill.master { color: var(--accent); background: var(--accent-soft); }
.stage-dots { display: inline-flex; gap: 3px; }
.stage-dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); }
.stage-dots i.f { background: var(--green); border-color: var(--green); }
.redpen { text-decoration: underline wavy var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 4px; text-decoration-skip-ink: none; }
.hl { background: linear-gradient(transparent 55%, var(--hl) 55%); padding: 0 2px; }

/* ---------- home ---------- */
.hero { display: grid; gap: 10px; padding-block: 6px; }
.hero h1 { font-size: 34px; }
.hero h1 .circ { position: relative; display: inline-block; }
.hero h1 .circ svg { position: absolute; inset: -10px -14px; width: calc(100% + 28px); height: calc(100% + 20px); overflow: visible; pointer-events: none; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat b { display: block; font: 900 26px/1.1 var(--serif); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-3); letter-spacing: .06em; }
.task-list { display: grid; gap: 0; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px dashed var(--line); color: var(--ink); text-decoration: none !important; }
.task:first-child { border-top: 0; }
.task:hover .task-t { color: var(--accent); }
.task-t { font-weight: 600; }
.task-k { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.task-k.r { background: var(--red-soft); color: var(--red); }
.task-k.n { background: var(--accent-soft); color: var(--accent); }
.pmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ptile {
  display: grid; gap: 6px; padding: 12px 12px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface);
  color: var(--ink); text-decoration: none !important; transition: border-color .15s, transform .15s;
}
.ptile:hover { border-color: var(--accent); transform: translateY(-1px); }
.ptile b { font-family: var(--serif); font-size: 16px; }
.ptile small { color: var(--ink-3); font-size: 12px; line-height: 1.45; }
.bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; counter-reset: rule; }
.rule { display: grid; gap: 4px; align-content: start; }
.rule b { font-family: var(--serif); font-size: 15px; }
.rule p { font-size: 13px; color: var(--ink-2); }

/* ---------- learn ---------- */
.ptable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ptable th, .ptable td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ptable th { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: .06em; }
.scroll-x { overflow-x: auto; }
.signals { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.signals li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.signals li::before { content: ""; width: 12px; height: 12px; margin-top: 6px; border: 1.5px solid var(--red); border-radius: 50%; }
.oneline { font-family: var(--serif); font-size: 20px; font-weight: 600; line-height: 1.5; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 0; position: relative; border-radius: var(--r); }
.oneline::before { content: "核心一句话"; display: block; font: 600 12px/1 var(--sans); letter-spacing: .12em; color: var(--red); margin-bottom: 8px; }
.tpl { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.tpl-h { padding: 9px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-2); }
.tpl-h b { font-size: 14px; }
.tpl-body { overflow-x: auto; }
.tpl-lines { display: grid; grid-template-columns: max-content minmax(240px, 1fr); min-width: 100%; }
.tpl-line { display: contents; }
.tpl-line > div { padding: 2px 14px; }
.tpl-code { font: 13.5px/1.75 var(--mono); white-space: pre; border-right: 1px solid var(--line); }
.tpl-why { font-size: 13px; color: var(--ink-2); line-height: 1.75; min-width: 240px; }
.tpl-line:hover > div { background: var(--hl); }
.tpl-line.blank .tpl-why { color: transparent; }
@media (max-width: 700px) {
  .tpl-lines { grid-template-columns: minmax(0, 1fr); }
  .tpl-code { border-right: 0; overflow-x: auto; }
  .tpl-why { padding-bottom: 6px !important; min-width: 0; padding-left: 28px !important; position: relative; }
  .tpl-why:not(:empty)::before { content: "↳"; position: absolute; left: 14px; color: var(--red); }
  .tpl-line.blank .tpl-why { display: none; }
}

/* ---------- problem list ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.plist { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.prow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 110px 52px 120px; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none !important; }
.prow:first-child { border-top: 0; }
.prow:hover { background: var(--surface-2); }
.prow .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .t small { font-weight: 400; color: var(--ink-3); margin-left: 6px; font-family: var(--mono); font-size: 12px; }
@media (max-width: 700px) {
  .prow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
  .prow > :nth-child(1) { grid-row: 2; }
  .prow > :nth-child(2) { grid-column: 1 / -1; }
  .prow > :nth-child(3), .prow > :nth-child(5) { display: none; }
  .prow > :nth-child(4) { grid-row: 2; justify-self: end; }
}

/* ---------- workspace ---------- */
.ws { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 24px; display: grid; gap: 12px; }
.ws-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.ws-head h1 { font-size: 22px; }
.ws-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 14px; height: calc(100vh - var(--top) - 92px); min-height: 560px; }
.ws-pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 8px 12px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab-body { flex: 1; min-height: 0; overflow: auto; padding: 18px; }
.tab-body.flush { padding: 0; display: flex; flex-direction: column; }
@media (max-width: 960px) {
  .ws-grid { grid-template-columns: minmax(0, 1fr); height: auto; }
  .ws-pane.left { max-height: 78vh; min-height: 420px; }
  .ws-pane.right { min-height: 0; }
}
.desc { display: grid; gap: 14px; }
.example { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font: 13px/1.7 var(--mono); white-space: pre-wrap; overflow-x: auto; }
.example b { font-family: var(--sans); font-weight: 600; color: var(--ink-2); }
.constraints { margin: 0; padding-left: 20px; font: 13px/1.8 var(--mono); color: var(--ink-2); }
.hint-ladder { display: grid; gap: 8px; }
.hint { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; font-size: 14px; }
.hint.locked { color: var(--ink-3); cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.hint.locked:hover { border-color: var(--accent); color: var(--accent); }
.hint b { color: var(--red); font-weight: 600; margin-right: 6px; }
.callout { border-left: 3px solid var(--red); background: var(--red-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14px; }
.callout.blue { border-color: var(--accent); background: var(--accent-soft); }

/* editor */
.ed-bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.ed-bar .sp { flex: 1; }
.ed-wrap { flex: 1; min-height: 240px; position: relative; display: flex; }
.ed-wrap .CodeMirror { flex: 1; height: auto; min-height: 240px; }
@media (max-width: 960px) { .ed-wrap { height: 380px; flex: none; } .ed-wrap .CodeMirror { height: 100%; } }
.results { flex: none; max-height: 44%; overflow: auto; border-top: 1px solid var(--line); background: var(--surface); }
@media (max-width: 960px) { .results { max-height: none; } }
.results-h { display: flex; gap: 10px; align-items: center; padding: 10px 14px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; z-index: 2; }
.results-h b { font-size: 15px; }
.results-h b.ok { color: var(--green); }
.results-h b.bad { color: var(--red); }
.case { border-bottom: 1px solid var(--line); }
.case summary { cursor: pointer; padding: 7px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; list-style: none; }
.case summary::-webkit-details-marker { display: none; }
.case summary .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.case.pass .dot { background: var(--green); }
.case.fail .dot { background: var(--red); }
.case-body { padding: 0 14px 10px 32px; display: grid; gap: 4px; font: 12.5px/1.6 var(--mono); }
.case-body div { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; }
.case-body span:first-child { color: var(--ink-3); font-family: var(--sans); }
.case-body span:last-child { white-space: pre-wrap; word-break: break-all; }
.case-body .err { color: var(--red); }
.stdout { margin: 10px 14px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; max-height: 160px; overflow: auto; }
.empty-results { padding: 14px; color: var(--ink-3); font-size: 13px; }

/* CodeMirror theme (tokens) */
.cm-s-tiyan.CodeMirror { background: var(--surface); color: var(--ink); font: 14px/1.7 var(--mono); }
.cm-s-tiyan .CodeMirror-gutters { background: var(--surface); border-right: 1px solid var(--line); }
.cm-s-tiyan .CodeMirror-linenumber { color: var(--ink-3); padding: 0 8px 0 6px; }
.cm-s-tiyan .CodeMirror-cursor { border-left: 2px solid var(--accent); }
.cm-s-tiyan .CodeMirror-selected, .cm-s-tiyan.CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft); }
.cm-s-tiyan .CodeMirror-activeline-background { background: var(--surface-2); }
.cm-s-tiyan .CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.cm-s-tiyan .cm-err-line { background: var(--red-soft); }
.cm-keyword { color: var(--syn-kw); font-weight: 500; }
.cm-def { color: var(--syn-def); }
.cm-string { color: var(--syn-str); }
.cm-number { color: var(--syn-num); }
.cm-comment { color: var(--syn-com); font-style: italic; }
.cm-builtin { color: var(--syn-builtin); }
.cm-variable-2, .cm-property { color: var(--ink); }
.cm-operator { color: var(--ink-2); }
.cm-meta { color: var(--syn-num); }
.cm-atom { color: var(--syn-num); }

/* stamp */
.stamp {
  position: absolute; right: 26px; top: 64px; z-index: 5; pointer-events: none;
  width: 92px; height: 92px; border: 4px double var(--red); border-radius: 50%;
  display: grid; place-items: center; color: var(--red); font: 54px/1 var(--brush);
  transform: rotate(-14deg); opacity: .9; mix-blend-mode: multiply;
}
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
.stamp.go { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { 0% { transform: scale(2.4) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-14deg); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .stamp.go { animation: none; } * { transition: none !important; } }

/* record panel */
.record { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); background: var(--green-soft); }
.record label { font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; }
.record input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* ---------- AI chat ---------- */
.chat { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.chat-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none; }
.msgs { flex: 1; min-height: 0; overflow: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }
.msg { display: grid; gap: 6px; max-width: 100%; }
.msg.user { justify-items: end; }
.msg.user .bubble { background: var(--accent-soft); color: var(--ink); border-radius: 12px 12px 2px 12px; padding: 8px 12px; max-width: 88%; white-space: pre-wrap; font-size: 14px; }
.msg.user .bubble .act { color: var(--accent); font-weight: 600; }
.msg.ai .who { font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.msg.ai .who b { color: var(--red); font-family: var(--brush); font-size: 16px; font-weight: 400; }
.msg-tools { display: flex; gap: 4px; flex-wrap: wrap; }
.msg.speaking .md { background: var(--hl); border-radius: 4px; }
.md { font-size: 14.5px; line-height: 1.75; min-width: 0; overflow-wrap: anywhere; }
.md > * + * { margin-top: .7em; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--serif); font-size: 16px; font-weight: 900; margin-top: 1.1em; }
.md ul, .md ol { padding-left: 1.4em; margin-block: .5em; }
.md li + li { margin-top: .25em; }
.md code { font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.md pre { position: relative; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 13px; line-height: 1.65; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.md pre .copy { position: absolute; top: 6px; right: 6px; opacity: 0; transition: opacity .15s; }
.md pre:hover .copy, .md pre .copy:focus { opacity: 1; }
.md table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; max-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--surface-2); }
.md blockquote { margin: 0; padding: 4px 12px; border-left: 3px solid var(--red); color: var(--ink-2); }
.md strong { color: var(--ink); }
.md details { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; }
.md summary { cursor: pointer; font-weight: 600; }
.md svg { max-width: 100%; height: auto; }
.thinking { color: var(--ink-3); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.thinking::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; flex: none; background: var(--surface); }
.composer textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--paper); min-height: 42px; max-height: 160px; font-size: 14px; line-height: 1.5; }
.composer textarea:focus { outline: none; border-color: var(--accent); }
.composer .row { justify-content: space-between; }
.ai-off { padding: 12px 14px; font-size: 13px; color: var(--ink-2); background: var(--amber-soft); border-bottom: 1px solid var(--line); }
.opt-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 13px; }

/* ---------- animation player ---------- */
.viz { display: grid; gap: 12px; }
.viz-stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1200px) { .viz-stage { grid-template-columns: minmax(0, 1fr); } }
.viz-code { background: var(--surface-2); border-radius: 6px; font: 12.5px/1.7 var(--mono); max-height: 320px; overflow: auto; padding: 6px 0; }
.viz-code div { white-space: pre; padding: 0 10px 0 0; display: grid; grid-template-columns: 34px max-content; }
.viz-code div span:first-child { color: var(--ink-3); text-align: right; padding-right: 10px; user-select: none; }
.viz-code div.cur { background: var(--hl); }
.viz-code div.cur span:first-child { color: var(--red); font-weight: 700; }
.viz-data { display: grid; gap: 14px; align-content: start; min-width: 0; }
.vz-block { display: grid; gap: 6px; min-width: 0; }
.vz-name { font: 600 12px/1 var(--mono); color: var(--ink-3); }
.vz-arr { position: relative; overflow-x: auto; padding-bottom: 4px; }
.vz-cells { display: flex; gap: 4px; padding-bottom: 2px; width: max-content; }
.vz-cell { width: 40px; display: grid; gap: 2px; justify-items: center; flex: none; }
.vz-cell i { font: 10px/1 var(--mono); color: var(--ink-3); font-style: normal; }
.vz-cell b { width: 40px; height: 36px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); font: 600 13px/1 var(--mono); transition: background .25s, border-color .25s, color .25s; overflow: hidden; }
.vz-cell.hl b { background: var(--hl); border-color: var(--amber); }
.vz-cell.win b { border-color: var(--accent); background: var(--accent-soft); }
.vz-cell.dim b { opacity: .4; }
.vz-ptrs { position: relative; height: 22px; width: max-content; min-width: 100%; }
.vz-ptr { position: absolute; top: 0; width: 40px; text-align: center; font: 600 11px/1.1 var(--mono); color: var(--red); transition: transform .35s cubic-bezier(.3, .7, .3, 1); white-space: nowrap; }
.vz-ptr::before { content: "▲"; display: block; font-size: 9px; }
.vz-table { border-collapse: collapse; font: 12.5px/1 var(--mono); }
.vz-table td, .vz-table th { border: 1px solid var(--line); min-width: 32px; height: 30px; text-align: center; padding: 0 5px; transition: background .25s; }
.vz-table th { color: var(--ink-3); font-weight: 500; background: var(--surface-2); }
.vz-table td.hl { background: var(--hl); }
.vz-table td.cur { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 700; }
.vz-stack { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.vz-stack span { padding: 5px 9px; border: 1.5px solid var(--line); border-radius: 5px; font: 600 12.5px/1 var(--mono); background: var(--surface); }
.vz-stack span:last-child { border-color: var(--accent); }
.vz-stack.queue span:last-child { border-color: var(--line); }
.vz-stack.queue span:first-child { border-color: var(--accent); }
.vz-stack em { font-size: 11px; color: var(--ink-3); font-style: normal; }
.vz-vars { display: flex; gap: 6px; flex-wrap: wrap; }
.vz-vars span { font: 12.5px/1.4 var(--mono); padding: 3px 8px; border-radius: 5px; background: var(--surface-2); }
.vz-vars span b { color: var(--accent); font-weight: 600; }
.vz-tree svg { max-width: 100%; height: auto; display: block; }
.vz-say { font-size: 15px; line-height: 1.7; padding: 12px 14px; border-radius: 6px; background: var(--surface-2); min-height: 56px; }
.vz-say b { color: var(--red); font-family: var(--mono); font-size: 12px; margin-right: 8px; }
.vz-ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.vz-ctrl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.vz-result { font: 600 13px/1.4 var(--mono); color: var(--green); }

/* ---------- misc ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.quiz-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.quiz-opt { padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; font-size: 15px; }
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); }
.quiz-opt.right { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
.quiz-opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.import-box textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--paper); resize: vertical; font-size: 14px; }
.file-pick { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.file-pick input { max-width: 220px; font-size: 12px; }
.inline-ai { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); display: flex; flex-direction: column; max-height: 640px; }
.inline-ai .msgs { max-height: 460px; }
.kbd { font: 11px/1 var(--mono); padding: 2px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--ink-3); }
.sep { height: 1px; background: var(--line); }
.fade-in { animation: fade .25s ease both; }
@keyframes fade { from { opacity: .4; } to { opacity: 1; } }

/* ---------- 补充 ---------- */
.ed-wrap .CodeMirror { position: absolute; inset: 0; height: 100%; min-height: 0; }
.viz-code { position: relative; }
.vz-tree line { stroke: var(--line); stroke-width: 1.5; }
.vz-tree circle { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; transition: fill .25s; }
.vz-tree circle.hl { fill: var(--hl); stroke: var(--amber); }
.vz-tree text { fill: var(--ink); font: 600 12px var(--mono); text-anchor: middle; dominant-baseline: central; }
select.btn { padding-right: 8px; }
@media (max-width: 760px) {
  .brand-sub { display: none; }
  .topbar-in { gap: 10px; }
  .status-chips .schip { font-size: 0; padding: 5px; gap: 0; }
  .hero h1 { font-size: 26px; }
  .stats { gap: 18px; }
  .ws-head h1 { font-size: 19px; }
}
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; }
.steps li > b:first-child { color: var(--red); font-family: var(--serif); }

/* ---------- 学习中心（AI 知识 / Python 语法） ---------- */
.course-grid { display: grid; grid-template-columns: 232px minmax(0, 1fr) minmax(340px, 420px); gap: 18px; align-items: start; }
.course-side { position: sticky; top: calc(var(--top) + 12px); max-height: calc(100vh - var(--top) - 32px); overflow: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 4px; }
.course-search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); margin-bottom: 8px; flex: none; }
.course-results { border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 4px; margin-bottom: 8px; display: flex; flex-direction: column; flex: none; }
.cn-group { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 8px 4px; font-family: var(--serif); font-size: 14px; flex: none; }
.cn-item { flex: none; text-align: left; border: 0; background: none; padding: 5px 8px 5px 18px; border-radius: 5px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); position: relative; line-height: 1.45; }
.cn-item:hover { background: var(--surface-2); color: var(--ink); }
.cn-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cn-item.read::before { content: ""; position: absolute; left: 6px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--green); }
.course-results .cn-item { padding-left: 8px; }
.course-nav { display: flex; flex-direction: column; gap: 1px; }
.course-top { display: none; }
.course-select { width: 100%; }
.course-main { display: grid; gap: 16px; min-width: 0; }
.course-body { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 28px; display: grid; gap: 18px; min-width: 0; }
.course-title { font-size: 28px; }
.course-md { font-size: 15.5px; line-height: 1.85; max-width: 72ch; }
.course-md h3 { font-size: 18px; margin-top: 1.4em; }
.course-actions { gap: 6px; }
.course-pager { border-top: 1px dashed var(--line); padding-top: 14px; }
.course-chat { position: sticky; top: calc(var(--top) + 12px); max-height: calc(100vh - var(--top) - 32px); min-height: 520px; }
.course-chat .msgs { max-height: none; }

，一旦合法就不断移动左指针尝试变短。","用 `missing` 表示还缺多少字符；右进减少缺口，左缩导致缺口恢复时停止。"],"key":"右扩找可行窗口，合法后左缩到刚好不可再缩。","pitfalls":["只检查字符种类不检查次数会让 `t='aa'` 出错","更新最短答案必须发生在每次合法窗口左缩前"],"types":[null,null],"ret_type":null,"compare":"exact","starter":"class Solution:\n    def minWindow(self, s: str, t: str) -> str:\n        ","tests":[{"args":["ADOBECODEBANC","ABC"],"expected":"BANC"},{"args":["a","aa"],"expected":""},{"args":["a","a"],"expected":"a"},{"args":["aa","aa"],"expected":"aa"},{"args":["ab","b"],"expected":"b"},{"args":["bba","ab"],"expected":"ba"},{"args":["abc","d"],"expected":""},{"args":["deddeebbedebadcbaeaeddebeaeaaabbeadcdebebcdaadcdeaccbecaaeadacdaaabbaddddaebccaccadabbaaaddbebdebbddaddbacecabbdeeaabbdcaeccdaaabebaeccedbedebdbbcbebbbebddeadaaaaecbdcdedcebabbdeeeacbbaacddbaabcceebacbdceebeaadccaaeadaccbaadecabccadadadeaeddeaeaaaacdcdedddeaeeaceadabadedcaccbebebcddbcdcbdbbdbecbbbdcaacbaddcbddedcedcaaceacecceabddbacbbaadaecabbdcbadeabbcceeeebdbaddbddbadeeecdcbaabbdaceccaceaadcedcdabadabecbdbeeddeabdeecebeeeccdebcbeecedbdeaeaedaeaedeeadabaedddcbddbcddecabdeacbaabbbacccbedadeaeecbedaddeebebebebeeebbcbcecbbbabbbacdaddebbdaabeccaecebadaaaeeeedbbbabbbcaeabdaacdddecdbecaabbddccdbebaeacadeebeecccabdbcecdbdbbaccdaaceabcccbdebeadedbadeaaeabcddeabdaacccceeedeeadaeeadbddbdeeeadddcedeccecdceccaabeabddacdaecabddcbaeadbbeaaeddabacebacdbddecedcebcbbdaeceeccceeebcbbbebaaaccdaeaabecaabebcddcbccdbaadebddcdbcbeccebdceadcaeadeeddcaacbeacdccbbcccacdeecdecdcbdebaccacdedbecdebeebbadcabeaebecadaeeceacacacaabadbbdecddcccbddeaeadcadadeaecaaddbbbdbcbddeccadcacbbadaedacabbcbebedeebdbcdbceedcddceadbdabbdeecabadcdbdebdbcbcebeceeabebabbbacceeaddaeeecabdbadbaededbcccdaecdacabaddadaddbceadabebcdeccdeacbbdacccedcddaabeabbbbdadeaababaddacdebbbddcdeadecbeeaccbccdaedbeccaebcecebceeebebebeababbdedccaccdadbbeeeeaecbcebaaccbecbbeeadadbbcdeeabbddabedaedbcebcbecaabddeadcdeedcddddaeaeceeddacaceddecceabadbedadaebecdbacedebbdeaaaebaeedacbcacbaddedbcebacadcccdbdbbcabccdabebebbaacccdbcddabbcabcbbeccceaeebcbbcbadadeaeaaeecec class ListNode:
    def __init__(self, val=0, next=None):
        self.val = val
        self.next = next

    def __repr__(self):
        return "ListNode(%r)" % (_from_list(self),)


class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val
        self.left = left
        self.right = right

    def __repr__(self):
        return "TreeNode(%r)" % (_from_tree(self),)


def _to_list(arr):
    dummy = cur = ListNode()
    for v in arr:
        cur.next = ListNode(v)
        cur = cur.next
    return dummy.next


def _from_list(node):
    out, steps = [], 0
    while node is not None:
        out.append(node.val)
        node = node.next
        steps += 1
        if steps > 200000:
            raise RuntimeError("链表里可能有环：遍历超过 200000 个节点")
    return out


def _to_tree(arr):
    if not arr or arr[0] is None:
        return None
    root = TreeNode(arr[0])
    q, i = deque([root]), 1
    while q and i < len(arr):
        node = q.popleft()
        if arr[i] is not None:
            node.left = TreeNode(arr[i])
            q.append(node.left)
        i += 1
        if i < len(arr) and arr[i] is not None:
            node.right = TreeNode(arr[i])
            q.append(node.right)
        i += 1
    return root


def _from_tree(root):
    if root is None:
        return []
    out, q = [], deque([root])
    while q:
        n = q.popleft()
        if n is None:
            out.append(None)
            continue
        out.append(n.val)
        q.append(n.left)
        q.append(n.right)
    while out and out[-1] is None:
        out.pop()
    return out

def _jsonable(x):
    if isinstance(x, (list, tuple, set, frozenset, deque)):
        items = [_jsonable(v) for v in x]
        if isinstance(x, (set, frozenset)):
            items.sort(key=_key)
        return items
    if isinstance(x, dict):
        return {str(k): _jsonable(v) for k, v in x.items()}
    if isinstance(x, ListNode):
        return _from_list(x)
    if isinstance(x, TreeNode):
        return _from_tree(x)
    return x


def _key(v):
    return json.dumps(v, sort_keys=True, ensure_ascii=False)


def _norm(x, mode):
    x = _jsonable(x)
    if mode == "unordered" and isinstance(x, list):
        return sorted(x, key=_key)
    if mode == "unordered_deep" and isinstance(x, list):
        return sorted((sorted(i, key=_key) if isinstance(i, list) else i for i in x), key=_key)
    return x

    if mode == "float":
        try:
            return abs(float(got) - float(exp)) <= 1e-5 * max(1.0, abs(float(exp)))
        except Exception:
            return False
    return _norm(got, mode) == _norm(exp, mode)


def _get_callable(ns, fn):
    if "Solution" in ns and isinstance(ns["Solution"], type):
        obj = ns["Solution"]()
        if hasattr(obj, fn):
            return getattr(obj, fn)
    if fn in ns and callable(ns[fn]):
        return ns[fn]
    raise NameError("没找到函数 %s：请保留 class Solution 里的 %s 方法" % (fn, fn))


def _call(f, args, types, ret_type):
    types = types or [None] * len(args)
    conv = [CONVERT_IN[t](copy.deepcopy(a)) if t in CONVERT_IN else copy.deepcopy(a) for a, t in zip(args, types)]
    out = f(*conv)
    if ret_type and ret_type.startswith("inplace"):
        out = conv[int(ret_type[7:] or 0)]
    elif ret_type in CONVERT_OUT:
        out = CONVERT_OUT[ret_type](out)
    return _jsonable(out)


def _short(v, limit=300):
    s = json.dumps(v, ensure_ascii=False)
    return s if len(s) <= limit else s[:limit] + " …（共 %d 字符）" % len(s)


def run_tests(user_code, spec_json, max_cases=None):
    """跑用户代码。spec: {fn, types, ret_type, compare, tests:[{args, expected}]}。返回 JSON 字符串。"""
    spec = json.loads(spec_json)
    result = {"ok": False, "compile_error": None, "cases": [], "passed": 0, "total": 0, "stdout": ""}
    buf = io.StringIO()
    old_out = sys.stdout
    sys.stdout = buf
    try:
        ns = {"__name__": "__solution__"}
        ns.update({k: v for k, v in globals().items() if not k.startswith("_") or k in ("__builtins__",)})
        ns["ListNode"], ns["TreeNode"] = ListNode, TreeNode
        try:
            exec(_src(user_code, "solution.py"), ns)
            f = _get_callable(ns, spec["fn"])
        except Exception as e:
            result["compile_error"] = _fmt_exc(e)
            return json.dumps(result, ensure_ascii=False)
        tests = spec["tests"][: max_cases or len(spec["tests"])]
        result["total"] = len(tests)
        for i, t in enumerate(tests):
            case = {"i": i, "args": _short(t["args"]), "expected": _short(t.get("expected"))}
            start = time.perf_counter()
            try:
                f = _get_callable(ns, spec["fn"])
                got = _call(f, t["args"], spec.get("types"), spec.get("ret_type"))
                case["got"] = _short(got)
                case["pass"] = "expected" in t and _same(got, t["expected"], spec.get("compare", "exact"))
            except RecursionError as e:
                case["error"] = "RecursionError: 递归太深（可能没写终止条件，或需要改成迭代）"
                case["pass"] = False
            except Exception as e:
                case["error"] = _fmt_exc(e)
                case["pass"] = False
            case["ms"] = round((time.perf_counter() - start) * 1000, 1)
            result["cases"].append(case)
            if case["pass"]:
                result["passed"] += 1
        result["ok"] = result["passed"] == result["total"]
    finally:
        sys.stdout = old_out
        out = buf.getvalue()
        result["stdout"] = out if len(out) < 4000 else out[:4000] + "\n…（输出过长已截断）"
    return json.dumps(result, ensure_ascii=False)


def run_reference(code, spec_json):
    """用参考解算出每个用例的 expected（AI 出的变体题用它校正答案）。"""
    spec = json.loads(spec_json)
    ns = {"__name__": "__reference__"}
    ns.update({k: v for k, v in globals().items() if not k.startswith("_")})
    exec(_src(code, "reference.py"), ns)
    f = _get_callable(ns, spec["fn"])
    outs = []
    for t in spec["tests"]:
        try:
            outs.append({"expected": _call(f, t["args"], spec.get("types"), spec.get("ret_type"))})
        except Exception as e:
            outs.append({"error": _fmt_exc(e)})
    return json.dumps(outs, ensure_ascii=False)


def run_snippet(code, stdin_text=""):
    """自由运行一段代码（AI 工具 / 草稿区用）。"""
    buf = io.StringIO()
    old_out, old_in = sys.stdout, sys.stdin
    sys.stdout, sys.stdin = buf, io.StringIO(stdin_text)
    err = None
    try:
        ns = {"__name__": "__main__"}
        ns.update({k: v for k, v in globals().items() if not k.startswith("_")})
        exec(_src(code, "snippet.py"), ns)
    except Exception as e:
        err = _fmt_exc(e)
    finally:
        sys.stdout, sys.stdin = old_out, old_in
    out = buf.getvalue()
    return json.dumps({"stdout": out[:6000], "error": err}, ensure_ascii=False)


def _src(code, name):
    linecache.cache[name] = (len(code), None, code.splitlines(True), name)
    return compile(code, name, "exec")


def _fmt_exc(e):
    tb = traceback.extract_tb(e.__traceback__)
    lines = [fr for fr in tb if fr.filename in ("solution.py", "snippet.py", "reference.py")]
    where = ""
    if lines:
        fr = lines[-1]
        where = "（第 %d 行：%s）" % (fr.lineno, (fr.line or "").strip())
    if isinstance(e, SyntaxError):
        where = "（第 %s 行：%s）" % (e.lineno, (e.text or "").strip())
    return "%s: %s%s" % (type(e).__name__, e, where)


build_list, build_tree, list_values, tree_values = _to_list, _to_tree, _from_list, _from_tree
sys.setrecursionlimit(4000)

<script type="application/json" id="knowledge-data">[{"id":"llm","name":"大模型原理","blurb":"从 token 预测到训练、对齐、推理和评测，讲清大模型的核心机制。","sections":[{"id":"llm-how","title":"大模型是怎么工作的","summary":"大模型用上下文预测下一个 token。","md":"\n### 一句话说清\n大模型不是在数据库里查答案，而是在给定上下文后，计算“下一个 token 最可能是什么”，再一个 token 一个 token 地生成结果。\n\n### 为什么这样能工作\nToken 可以理解成模型处理文本的最小片段，可能是一个汉字、一个英文子词、一个标点、一个代码缩进。用户问题、系统提示、历史对话、工具返回都会被拼成一串 token。模型读入这串 token，输出词表里每个候选 token 的概率。选出一个 token 后，把它追加回上下文，再继续预测下一个。\n\n这种训练目标很简单：给前文，预测后文。但数据足够多、参数足够大、结构足够强时，模型会学到语言、代码、事实、风格、推理模板和对话模式。它像一个超大的条件概率函数：输入 token 序列，输出后续 token 的概率分布。\n\n### 上下文窗口和自回归\n上下文窗口是模型一次能看到的 token 上限。超过窗口的内容要截断、摘要或检索。自回归生成指模型每次只生成下一个 token，后续 token 依赖前面已经生成的内容。前面一旦走偏，后面容易沿着错误继续写。\n\n### 为什么会幻觉\n模型优化的是“在训练分布下像不像合理文本”，不是“是否经过事实校验”。当上下文缺证据、训练数据冲突、问题诱导强、解码随机性高，或工具结果没被正确读入时，模型可能生成流畅但错误的内容。幻觉常见形式包括编造引用、虚构 API、错误数字、把历史状态当当前状态。\n\n### 一个例子\n问“某库的最新参数是什么”，如果上下文里没有当前文档，模型可能根据旧记忆补一个看似合理的参数名。接入文档检索后，它才可能引用真实资料。测试时要区分：模型自己猜对、检索命中、工具读回确认，是三种不同证据等级。\n\n### 面试表达\n可以说：LLM 的底层目标是 next token prediction；聊天能力来自预训练、指令微调、对齐和解码策略的组合；它没有天然事实数据库，所以高风险场景要靠 RAG、工具、读回验证和评测闭环降低幻觉。\n","points":["token 是模型处理文本的基本单位。","大模型训练目标通常是预测下一个 token。","上下文窗口限制模型一次可见的信息范围。","自回归生成会把已生成内容继续喂回模型。","幻觉来自概率生成缺少事实校验。"],"interview":[{"q":"为什么说大模型是在预测下一个 token？","a":"训练时给模型一段前文，让它预测后面的 token；推理时也按这个方式循环生成。模型每步输出词表概率分布，解码策略再选择具体 token。这个目标简单，但在大规模数据和参数下会涌现问答、代码和推理能力。"},{"q":"大模型为什么会幻觉？","a":"它优化的是生成合理文本的概率，不是事实校验。上下文缺证据、训练数据冲突、采样随机性、检索或工具失败，都可能让模型编造。工程上要用引用、工具读回、规则校验和评测降低风险。"},{"q":"上下文窗口为什么重要？","a":"模型只能看到窗口内 token。重要信息被截断、放得太乱或被噪声淹没，都会影响输出。长上下文能放更多资料，但不保证每个细节都被可靠使用。"}],"quiz":[{"q":"大模型回答问题一定是在查训练语料原文吗？","a":"不是，它主要根据上下文预测后续 token。"},{"q":"同一问题多次回答不同通常和什么有关？","a":"采样策略、temperature、上下文差异和服务实现有关。"},{"q":"模型说“已完成”能否直接当业务完成？","a":"不能，需要外部状态或证据读回。"}],"related":["llm-token-embed","llm-transformer","llm-decoding","llm-eval-hallucination"]},{"id":"llm-token-embed","title":"分词与 Embedding","summary":"文本先切成 token，再映射成向量。","md":"\n### 一句话说清\n分词把字符串变成 token id，Embedding 把离散 token id 变成模型能计算的向量。\n\n### BPE 和 SentencePiece\n常见 tokenizer 会把文本拆成子词。BPE 从字符开始，反复合并高频片段，最后得到词表。SentencePiece 常把空格也当普通符号处理，适合多语言场景。它们的目标不是按人类语文课“分词”，而是在词表大小、压缩率、未知词处理之间折中。\n\n比如 “unbelievable” 可能被切成 “un”“believ”“able”；中文可能按字、词片段或标点切；代码里的缩进、换行、括号也会成为 token。测试 prompt 成本、上下文长度、代码格式时，不能只看字符数。\n\n### 词表大小取舍\n词表大，常见词能用更少 token 表达，序列更短；但 embedding 表和输出层更大，稀有 token 学得也可能不充分。词表小，参数更省，泛化到新词更自然；但序列变长，推理更慢，长上下文压力更大。多语言、代码、数学符号都会影响词表设计。\n\n### Embedding 是什么\nEmbedding 可以看成一个查表：token id 进来，得到一个高维向量。训练会调整这些向量，让相似语境里的 token 表示更接近。进入 Transformer 后，向量会不断融合上下文，所以同一个 token 在不同句子里的最终表示会不同。\n\n### 具体例子\n“服务已恢复”和“服务可能恢复”在 embedding 空间可能相似，但业务结论不同。向量相似只说明语义接近，不等于事实等价。RAG 里也一样，召回片段相似不代表片段包含答案。\n\n### 面试要点\n可以这样讲：tokenizer 决定模型读到的离散符号，embedding 负责把符号变成连续向量；词表是压缩率和参数成本的折中；向量表示支持语义计算，但不能替代事实校验和业务规则。\n\n### 易错点\n面试里不要把 embedding 说成固定语义标签。它只是训练得到的连续表示，后续层会结合上下文不断改写。排查线上问题时也要先看 tokenizer 是否把关键字段、数字、代码符号切碎，再判断是否是模型能力问题。\n","points":["BPE 和 SentencePiece 都常用子词切分。","token 数会影响上下文、延迟和成本。","词表越大不一定越好，要权衡参数量和压缩率。","embedding 是 token 的可学习向量表示。","向量相似不等于事实相同。"],"interview":[{"q":"token 和词有什么区别？","a":"token 是 tokenizer 的切分单位，不一定是自然语言里的词。它可能是字、子词、标点、空格或代码符号。模型成本按 token 计算，所以中文、英文、代码和数字的 token 数差异很重要。"},{"q":"Embedding 的作用是什么？","a":"Embedding 把离散 token id 映射到连续向量，让神经网络可以计算。初始 embedding 表示符号本身，经过多层 Transformer 后会变成结合上下文的表示。"},{"q":"词表大小怎么取舍？","a":"大词表能缩短序列，但会增加 embedding 和输出层参数；小词表更省参数，也更容易覆盖未知词，但会让序列变长。实际要结合语言、代码、成本和效果权衡。"}],"quiz":[{"q":"Embedding 相似能证明两个句子事实等价吗？","a":"不能，只能说明表示相近。"},{"q":"代码缩进可能被 tokenizer 处理成 token 吗？","a":"可能，空格和换行常会影响 token。"},{"q":"词表越大一定越好吗？","a":"不一定，会增加参数和稀疏学习压力。"}],"related":["llm-how","llm-transformer","llm-position","agent-rag"]},{"id":"llm-transformer","title":"Transformer 结构","summary":"注意力让 token 直接建立依赖。","md":"\n### 一句话说清\nTransformer 用自注意力让每个 token 读取上下文中相关 token 的信息，再用前馈网络做特征变换。\n\n### Q、K、V 与自注意力\n每个位置的向量会被投影成 Query、Key、Value。当前位置用 Query 和所有位置的 Key 算相似度，经过 softmax 得到权重，再加权汇总 Value。核心形式是：softmax(QK^T / sqrt(d_k)) V。它像做题时找关键条件：当前要生成“复杂度”，就会更关注题目里的数据范围和算法约束。\n\n### 多头注意力\n多头不是简单重复，而是把表示拆到多个子空间并行计算。有的头可能关注语法依赖，有的关注变量引用，有的关注段落结构。最后把多个头的结果拼起来，再投影回模型维度。多头提高了表达能力，但也增加计算和显存。\n\n### Causal mask\n自回归语言模型训练和生成时不能看未来 token，所以会加 causal mask。第 i 个位置只能关注 0 到 i 的位置。没有 mask，训练时模型会偷看答案，推理时却看不到未来，训练和推理不一致。\n\n### FFN、残差与归一化\n注意力负责 token 间交互，FFN 对每个位置做非线性变换，通常是升维、激活、降维。残差连接让梯度和信息更容易跨层传播。归一化让深层训练稳定。\n\nLayerNorm 会使用均值和方差，RMSNorm 只按均方根缩放，计算更简单，在不少大模型里常见。Post-Norm 是先子层再归一化，Pre-Norm 是先归一化再进子层。深层大模型常偏向 Pre-Norm，因为训练更稳定。\n\n### 面试要点\n讲 Transformer 不要只背“注意力机制”。要能说明：Q/K/V 怎么算相关性，多头为什么有用，causal mask 为什么必要，FFN 做什么，残差和 Norm 为什么帮助深层网络训练。\n\n### 易错点\n不要把注意力理解成真正的人类注意。它是矩阵乘法和概率权重，能表达相关性，但不保证因果解释。面试写公式时要同时说清维度、mask 和残差路径，否则只背 softmax 公式不够。\n","points":["自注意力用 Q/K/V 建立 token 间依赖。","多头注意力从多个子空间建模关系。","causal mask 防止自回归模型看到未来。","FFN 负责逐位置非线性变换。","Pre-Norm 和 RMSNorm 常用于稳定深层训练。"],"interview":[{"q":"Self-Attention 相比 RNN 有什么优势？","a":"它能让任意两个位置直接交互，更容易建模长距离依赖，也更适合并行训练。RNN 按序处理，长距离信息容易衰减。Transformer 的代价是注意力计算随序列长度增长较快。"},{"q":"为什么生成模型需要 causal mask？","a":"训练第 i 个位置时不能使用 i 之后的答案，否则模型会偷看未来。推理时未来 token 尚未生成，所以训练必须和推理保持一致。causal mask 让模型只基于过去上下文预测下一个 token。"},{"q":"LayerNorm、RMSNorm、Pre-Norm 怎么解释？","a":"LayerNorm 用均值和方差归一化，RMSNorm 用均方根缩放，更简单。Pre-Norm 是先归一化再进注意力或 FFN，深层训练通常更稳定；Post-Norm 是子层输出后再归一化。"}],"quiz":[{"q":"注意力公式里的 softmax 作用是什么？","a":"把相关性分数变成权重。"},{"q":"FFN 会混合不同 token 信息吗？","a":"通常不会，主要逐位置变换；跨 token 交互来自注意力。"},{"q":"没有 causal mask 会有什么问题？","a":"训练时泄漏未来答案。"}],"related":["llm-token-embed","llm-position","llm-inference","llm-handcode"]},{"id":"llm-position","title":"位置编码与长上下文","summary":"位置机制让模型知道顺序和距离。","md":"\n### 一句话说清\n注意力本身不天然知道顺序，位置编码负责告诉模型 token 的先后、距离和相对关系。\n\n### 为什么需要位置\n如果没有位置信息，“用户删除文件”和“文件删除用户”会很难区分。自然语言里的否定词、条件、时间顺序，代码里的缩进、变量赋值顺序，都依赖位置。Transformer 用内容向量加上位置机制，才知道谁在前、谁在后、谁离谁近。\n\n### 绝对、相对与 RoPE\n绝对位置编码给第 0、1、2 个位置各自一个位置向量，简单直接，但泛化到更长位置时不一定自然。相对位置编码关注两个 token 的距离，比如“当前位置往前 5 个 token”。RoPE 是旋转位置编码，把位置信息通过旋转方式注入 Q/K，让注意力分数和相对距离有关。很多现代 LLM 使用 RoPE 或其变体，因为它适合自回归注意力，也便于做长上下文扩展。\n\n### 外推与插值\n外推是让模型处理训练时没见过的更长位置。直接外推可能退化，因为位置模式超出训练分布。插值会把更长上下文的位置压缩映射到训练过的范围，提升稳定性，但可能损失位置分辨率。工程上还会结合继续训练、检索、摘要和窗口滑动。\n\n### 长上下文的代价\n长上下文不是免费午餐。输入越长，prefill 越慢，KV Cache 越大，显存压力越高，成本越高。更关键的是“放进去”不等于“用得对”。模型可能忽略中间证据，被干扰片段带偏，或混淆多个来源。\n\n### 测试方法\n把唯一答案分别放在开头、中间、结尾；加入相似但错误的干扰；让新旧约束冲突；触发截断；检查答案是否引用正确证据。长上下文系统要测容量，也要测证据使用能力。\n\n### 易错点\n长上下文测试不能只问“能不能塞下”。更好的做法是固定同一个问题，把证据移动到不同位置，并加入相似干扰。若模型只在证据靠近开头或结尾时答对，说明系统仍有位置敏感风险。\n","points":["注意力需要位置机制才能理解顺序。","绝对位置强调位置编号，相对位置强调距离。","RoPE 通过旋转方式注入相对位置信息。","长上下文会增加延迟、显存和成本。","长上下文不保证模型可靠使用所有证据。"],"interview":[{"q":"为什么 Transformer 需要位置编码？","a":"Self-Attention 只看 token 间相关性，不天然包含顺序。位置编码提供先后和距离信息，让模型区分语序、缩进、变量定义顺序等结构。没有位置机制，很多句子和代码逻辑都会混乱。"},{"q":"RoPE 的直观理解是什么？","a":"RoPE 用旋转方式把位置注入 Q/K，使注意力分数能感知相对距离。它比单纯绝对位置更适合建模相对关系，也常用于长上下文扩展。面试不用推公式，讲清“旋转注入位置、影响注意力相似度”即可。"},{"q":"长上下文为什么仍会失败？","a":"长输入会带来成本和注意力压力，模型可能忽略中间信息、混淆来源或被干扰证据带偏。还可能因截断、摘要不当或位置外推退化而丢失关键条件。"}],"quiz":[{"q":"上下文窗口变大是否等于可靠性必然提高？","a":"不是，只是可放入信息更多。"},{"q":"插值扩展长上下文可能损失什么？","a":"可能损失位置分辨率。"},{"q":"测试长上下文要不要改变证据位置？","a":"要，能发现位置敏感问题。"}],"related":["llm-transformer","llm-inference","llm-eval-hallucination","agent-context"]},{"id":"llm-decoding","title":"解码与采样","summary":"解码把概率分布变成具体文本。","md":"\n### 一句话说清\n模型每步输出 token 概率，解码策略决定选哪个 token，所以它直接影响稳定性、多样性和格式可靠性。\n\n### 常见策略\nGreedy 每步选概率最高的 token，稳定、快，但容易模板化，也可能卡在局部最优。Beam search 保留多条候选序列，适合翻译、摘要等需要较稳定文本的任务，但在开放对话里可能显得死板，还会增加计算。\n\nTemperature 会改变概率分布的尖锐程度。低温更保守，高温更多样。Top-k 只从概率最高的 k 个 token 中采样。Top-p 也叫 nucleus sampling，从累计概率达到 p 的候选集合中采样，候选数会随分布变化。重复惩罚会降低已经出现 token 或短语的概率，减少复读和循环。\n\n### 什么场景用什么\n代码生成、JSON、SQL、测试脚本，优先低温、强格式约束、解析校验。创意文案、头脑风暴、生成多种测试点，可以适当提高 temperature 或 top-p。机器翻译、标题生成可考虑 beam search。Agent 工具参数生成要更保守，因为一个参数错了可能调用错工具。\n\n### 结构化输出\n要求模型输出 JSON，不代表一定合法。它可能多解释、少括号、字段名变形、代码块没闭合。工程上可以用 JSON Schema、函数调用、停止词、解析器校验、失败重试。测试时必须真实 parse，而不是肉眼看起来像。\n\n### 具体例子\n同一 prompt：“给三个边界测试点”。低温可能稳定给空输入、最大值、非法字符；高温可能给更发散的组合。两者没有绝对好坏，取决于你要稳定复现还是探索多样性。\n\n### 面试表达\ntemperature 控制随机性，但不保证正确；top-k/top-p 控制采样候选范围；重复惩罚降低循环；解码只是生成层手段，事实正确还要靠证据、工具和校验。\n\n### 易错点\n解码参数适合做稳定性调优，不适合当事实正确性的兜底。把 temperature 调低，错误答案也可能稳定输出。测试结构化生成时，要统计解析成功率、字段完整率和多次运行一致率。\n","points":["greedy 稳定但可能局部最优。","beam search 保留多条候选，适合部分确定性生成。","temperature 越高输出越发散。","top-k 和 top-p 控制采样候选集合。","结构化输出要靠解析和校验兜底。"],"interview":[{"q":"temperature 调高和调低有什么影响？","a":"调低会让分布更尖锐，输出更稳定保守；调高会增加低概率 token 被选中的机会，输出更多样但更不稳定。低温不等于正确，只是更确定地选择高概率答案。"},{"q":"top-k 和 top-p 区别是什么？","a":"top-k 固定保留概率最高的 k 个候选；top-p 保留累计概率达到阈值的一组候选，大小会随分布变化。top-p 在分布很集中时候选少，分布平坦时候选多。"},{"q":"如何让模型输出更稳定的 JSON？","a":"降低随机性，给明确 schema 和示例，使用函数调用或受约束解码，输出后用解析器校验。失败时基于解析错误重试，不能把看起来像 JSON 当成通过。"}],"quiz":[{"q":"temperature=0 能保证事实正确吗？","a":"不能，只是更确定。"},{"q":"重复惩罚主要解决什么？","a":"减少复读、循环和重复短语。"},{"q":"开放创意任务一定要 greedy 吗？","a":"不一定，采样能提供多样性。"}],"related":["llm-how","llm-inference","llm-handcode","agent-tools"]},{"id":"llm-pretrain","title":"预训练、数据与 Scaling Law","summary":"预训练用海量数据学习通用模式。","md":"\n### 一句话说清\n预训练让模型在大规模文本和代码上学习通用 token 分布，Scaling Law 描述模型、数据、算力扩大时损失下降的经验规律。\n\n### 训练目标\n自回归 LLM 常用 next token prediction：给前文预测下一个 token。这个目标会逼模型学习语法、事实、代码结构、常识和推理模板。它不是专门为“听指令”设计，所以基础模型可能续写而不是回答。\n\n### 数据清洗、去重和配比\n数据质量决定上限。清洗会去掉乱码、低质网页、重复模板、恶意内容和明显错误。去重很重要，因为大量重复会让模型记忆化、浪费算力，也会污染评测。配比要平衡通用文本、代码、数学、多语言、对话等来源。代码数据多，编程更强；多语言不足，中文表现可能弱；数学推理少，复杂题会吃力。\n\n### Scaling Law\n经验上，参数量、训练 token 数和算力增加，模型损失会按规律下降。但三者要匹配：模型大但数据少会欠训练或过拟合，数据多但模型小吸收不了，算力不足训练不到位。Scaling Law 不是魔法公式，它提醒我们能力提升通常来自规模、数据和训练策略共同作用。\n\n### MoE 的思路\nMoE 是 Mixture of Experts。它把部分 FFN 换成多个专家网络，每个 token 只路由到少数专家。好处是总参数可以很大，但每个 token 激活的参数较少，计算更省。难点是路由、负载均衡、训练稳定和部署复杂。\n\n### 测试视角\n预训练解释了知识边界：模型可能不知道新事实，也可能混淆低频知识。实时业务、当前状态、精确版本不应只靠参数记忆。面试里可以说：预训练给通用能力，SFT 教指令，对齐教偏好，RAG 和工具补实时事实。\n\n### 易错点\n不要把 Scaling Law 理解成“参数越大一定越好”。训练 token、数据质量、算力预算和推理成本都要匹配。对于测试开发，最实际的结论是：模型底座决定上限，应用层只能在证据和流程上补强。\n","points":["预训练常用 next token prediction。","数据清洗、去重和配比会显著影响能力。","Scaling Law 描述规模扩大时损失下降的经验趋势。","MoE 通过稀疏激活扩大参数而控制计算。","预训练不等于模型会可靠服从指令。"],"interview":[{"q":"预训练和 SFT 有什么区别？","a":"预训练主要在海量文本上学习通用 token 分布，目标是预测下一个 token。SFT 用指令和答案样本训练模型按用户任务回答。前者给底座能力，后者让模型更像助手。"},{"q":"Scaling Law 给工程什么启发？","a":"能力提升通常需要模型规模、数据规模和算力匹配。单纯放大某一项可能收益不佳。它还提醒评估成本收益：更大模型更强，但训练和推理成本也更高。"},{"q":"MoE 为什么能降计算？","a":"MoE 有很多专家，但每个 token 只激活少数专家。这样总参数容量大，单次计算量相对可控。代价是路由、负载均衡和部署更复杂。"}],"quiz":[{"q":"预训练模型天然会按用户指令回答吗？","a":"不一定，还需要 SFT 和对齐。"},{"q":"去重为什么重要？","a":"减少记忆化、浪费算力和评测污染。"},{"q":"MoE 是每次激活所有专家吗？","a":"通常不是，只激活少数专家。"}],"related":["llm-sft-peft","llm-alignment","llm-distill","llm-eval-hallucination"]},{"id":"llm-sft-peft","title":"SFT 与参数高效微调","summary":"SFT 教模型按指令办事，PEFT 降低适配成本。","md":"\n### 一句话说清\nSFT 用指令样本训练模型按任务回答；LoRA、QLoRA 这类 PEFT 方法只训练少量参数，降低微调成本。\n\n### 指令微调数据\nSFT 数据通常是“指令、输入、理想回答”。样本要覆盖问答、摘要、代码、推理、格式约束、拒答等任务。质量比数量更关键：答案错误会被模型学会，格式混乱会影响结构化输出，任务分布偏会导致泛化差。测试开发可以把 SFT 数据看成训练版测试集，必须关心覆盖、边界和标注一致性。\n\n### LoRA 原理\n全参微调要更新模型大量权重，显存和存储成本高。LoRA 冻结原权重，只给某些线性层加低秩更新：权重增量约等于 A 乘 B。训练时只更新 A、B。rank 越大表达能力越强，参数也越多；alpha 控制缩放；dropout 可减轻过拟合。常见插入位置包括注意力的 q、k、v、o 投影和 FFN 投影。\n\n### QLoRA\nQLoRA 把基础模型量化到低比特存储，再训练 LoRA adapter，进一步降低显存。直观理解是“大模型低精度放着不动，小 adapter 负责学习任务差异”。它让单机微调更可行，但对量化方式、训练稳定和最终效果要评估。\n\n### 全参 vs PEFT\n全参微调容量更大，适合大规模、深度领域迁移，但成本高，也更容易影响通用能力。PEFT 成本低、可为不同任务保存多个 adapter、回滚方便，适合风格、格式、分类、工具调用等边界较清晰任务。若知识需要实时更新，RAG 或工具通常比微调更合适。\n\n### 面试表达\n预训练给能力，SFT 教指令，PEFT 降成本。微调不是万能补丁：它不能保证事实最新，也不能替代业务校验。上线前要测同义改写、分布外样本、格式合法率、通用能力退化和 adapter 版本加载。\n\n### 易错点\n微调常被误用来灌知识。若知识经常变化，微调后很快过期，还很难追溯来源。更稳的方案是把稳定行为交给微调，把动态事实交给检索和工具，再用评测集验证组合效果。\n","points":["SFT 依赖高质量指令-回答数据。","LoRA 用低秩增量近似权重更新。","QLoRA 用量化基础模型加 LoRA 降显存。","全参微调能力强但成本和风险更高。","实时知识更适合 RAG 或工具。"],"interview":[{"q":"SFT 解决什么问题？","a":"它把预训练模型的续写能力转成按指令回答的能力。模型会学习任务格式、回答风格、步骤说明和拒答模式。它仍然依赖样本质量，错误标注会被学进去。"},{"q":"LoRA 为什么参数高效？","a":"LoRA 冻结原始大权重，只训练低秩矩阵表示权重增量。需要更新和保存的参数远少于全参微调，因此显存、存储和切换成本低。rank、alpha、dropout 是常见关键参数。"},{"q":"什么时候微调，什么时候 RAG？","a":"稳定风格、固定格式、分类和工具调用习惯适合微调。实时知识、可追溯事实、频繁变化的文档更适合 RAG 或 API 工具。很多系统会组合使用。"}],"quiz":[{"q":"LoRA 会更新基础模型全部参数吗？","a":"不会，通常冻结基础模型。"},{"q":"QLoRA 的核心收益是什么？","a":"用量化降低基础模型显存，再训练少量 adapter。"},{"q":"微调能自动知道今天新增数据吗？","a":"不能，实时数据应走检索或工具。"}],"related":["llm-pretrain","llm-alignment","llm-distill","agent-tools"]},{"id":"llm-alignment","title":"对齐与强化学习","summary":"对齐让模型更符合人类偏好和规则。","md":"\n### 一句话说清\n对齐是在“会生成”之后，让模型更有帮助、更诚实、更安全、更符合任务偏好的训练和策略过程。\n\n### RLHF\nRLHF 通常先收集人类对多个回答的偏好，训练奖励模型，再用强化学习优化策略模型。经典路线会用 PPO，让模型在提高奖励的同时不要偏离原模型太远。优点是能学习复杂偏好；缺点是流程重、训练不稳定、奖励模型可能被钻空子。\n\n### DPO\nDPO 直接利用偏好对训练，不显式训练奖励模型和跑复杂 RL。它把“好回答比坏回答更可能”写进损失，工程更简单、稳定性更好。缺点是依赖偏好数据质量，对需要多步外部验证的任务表达力有限。\n\n### GRPO 与组内比较\nGRPO 这类方法强调同一问题生成一组候选，用组内相对优势来优化，减少对单独价值模型的依赖。它在推理类训练中常被讨论。面试不需要背细节公式，能说清“用候选组相对表现做优化信号”即可。\n\n### RLVR\nRLVR 是可验证奖励强化学习。它用自动可验证信号给奖励，例如数学答案是否正确、代码单测是否通过、格式是否可解析。优点是奖励客观、可规模化；缺点是只适合能自动判定的任务，可能让模型过度优化测试而忽略解释质量。\n\n### 取舍\nRLHF 偏通用偏好，PPO 灵活但复杂；DPO 简洁稳定，适合偏好对数据；GRPO 适合候选组相对优化；RLVR 适合数学、代码、工具任务等可验证场景。安全策略还会叠加系统提示、内容审核、工具权限和人工确认。\n\n### 测试视角\n对齐要同时测漏放和误拒。危险请求不应放行，正常请求也不应过度拒绝。Agent 场景还要测提示注入、越权工具、敏感数据、失败诚实度和证据引用。\n\n### 易错点\n对齐不是让模型永远讨好用户。好的对齐要在帮助性、真实性和安全性之间平衡。测试时要同时构造应该拒绝的请求和不该拒绝的正常请求，否则只会得到“很安全但不好用”的模型。\n","points":["RLHF 用人类偏好和奖励模型优化回答。","PPO 能做 RL 优化但训练流程较复杂。","DPO 直接用偏好对训练，更简单稳定。","GRPO 使用候选组内相对信号。","RLVR 适合有自动验证奖励的任务。"],"interview":[{"q":"SFT 和 RLHF 有什么区别？","a":"SFT 是模仿标注答案，学会按指令回答；RLHF 进一步利用人类偏好，让模型倾向更有帮助、更安全、更符合偏好的回答。SFT 解决会不会答，RLHF 更关注答得好不好。"},{"q":"DPO 相比 PPO 类 RLHF 有什么优点？","a":"DPO 不需要显式训练奖励模型后再跑复杂 RL，直接用偏好对优化，流程更简单，训练稳定性通常更好。但它仍依赖偏好数据质量，不能替代外部事实验证。"},{"q":"RLVR 适合什么任务？","a":"适合答案能自动验证的任务，比如数学题、代码单测、格式解析、工具执行结果。它的奖励更客观，但可能覆盖不了开放式表达质量。"}],"quiz":[{"q":"拒答越多是否一定越安全？","a":"不一定，还要看误拒。"},{"q":"DPO 需要偏好对数据吗？","a":"需要。"},{"q":"代码单测通过可以作为 RLVR 奖励吗？","a":"可以，是典型可验证信号。"}],"related":["llm-sft-peft","llm-eval-hallucination","agent-safety","agent-eval"]},{"id":"llm-inference","title":"推理部署与加速","summary":"推理优化围绕延迟、吞吐、显存和成本。","md":"\n### 一句话说清\n线上推理要把模型能力变成可用服务，核心是控制首 token 延迟、生成速度、并发吞吐、显存占用和稳定性。\n\n### Prefill 与 Decode\nPrefill 处理输入上下文，计算所有输入 token 的中间状态；Decode 逐 token 生成输出。输入越长，prefill 越慢；输出越长，decode 步数越多。流式输出能让用户更早看到首 token，但不减少总计算。\n\n### KV Cache\n自回归生成每步都会用到历史 token。KV Cache 缓存每层注意力的 Key、Value，避免重复计算前缀。它像动态规划，把历史计算结果复用起来。缺点是占显存，长上下文和高并发会让缓存压力很大。\n\n### 批处理与 PagedAttention\n批处理把多个请求合并，提高硬件利用率。但不同请求长度不一，容易造成浪费。PagedAttention 的思路是把 KV Cache 像分页内存一样管理，减少碎片，支持更灵活的并发调度。\n\n### 量化、FlashAttention、投机解码\nINT8、INT4 量化用更低精度存权重或计算，降低显存和带宽压力，但要评估精度损失。FlashAttention 通过优化注意力计算的内存访问，减少显存读写，提高速度。投机解码用小模型先草拟多个 token，大模型验证，接受就一次前进多步，不接受再回退，目标是降低生成延迟。\n\n### 测试重点\n测短输入短输出、长输入短输出、短输入长输出、长输入长输出；测并发、限流、超时、取消、重试、流式中断和降级。Agent 还要统计工具调用轮数和总 token，避免无效循环把成本打爆。\n\n### 易错点\n线上慢不一定是模型“不会答”，可能是排队、长输入、长输出、KV Cache 紧张或批处理策略导致。排查时先拆 TTFT、每 token 时间、总 token、并发和错误率，再决定是改 prompt、换模型还是优化服务。\n","points":["prefill 主要受输入长度影响。","decode 逐 token 生成，输出越长越慢。","KV Cache 用显存换重复计算减少。","量化、FlashAttention、PagedAttention 都服务于部署效率。","投机解码用小模型草拟、大模型验证。"],"interview":[{"q":"KV Cache 为什么能加速？","a":"生成第 n 个 token 时，前面 token 的 Key/Value 已经算过。缓存这些结果后，每步只计算新 token 并复用历史，避免重复计算整个前缀。代价是显存占用增加。"},{"q":"FlashAttention 的直观作用是什么？","a":"它不改变注意力数学结果，而是优化计算和内存访问方式，减少中间矩阵读写，让注意力更快、更省显存。面试重点说工程优化，不必写 CUDA 细节。"},{"q":"投机解码为什么可能加速？","a":"小模型便宜，先快速生成草稿 token；大模型一次验证多个 token。若接受率高，就减少大模型逐步生成次数。若草稿常错，加速收益会下降。"}],"quiz":[{"q":"KV Cache 会不会占显存？","a":"会，上下文和并发越高越明显。"},{"q":"量化一定无损吗？","a":"不一定，要评估精度和任务退化。"},{"q":"流式输出能减少总计算吗？","a":"通常不能，只改善感知延迟。"}],"related":["llm-transformer","llm-position","llm-decoding","agent-coding-loop"]},{"id":"llm-distill","title":"蒸馏与小模型","summary":"用大模型能力训练更便宜的小模型。","md":"\n### 一句话说清\n蒸馏用强模型产生数据或软目标，训练小模型在特定任务上接近大模型效果，从而降低成本和延迟。\n\n### 知识蒸馏是什么\n教师模型可以输出答案、解释步骤、评分理由或候选分布。学生模型学习这些输出。最常见做法是让大模型批量生成高质量指令数据，再用 SFT 训练小模型。也可以让学生学习教师的概率分布，获得比硬标签更细的信号。\n\n### 为什么值得做\n大模型强但贵、慢、部署难。高频、边界清晰、答案格式稳定的任务，常常不需要每次都调用最大模型。例如意图识别、简单摘要、固定分类、日志粗分、格式转换、候选重排，都可能用小模型承担。大模型保留给复杂推理、低置信度和异常场景。\n\n### 什么时候不适合\n开放复杂推理、长上下文、多步 Agent 规划、强实时知识、精确事实问答，不适合盲目蒸馏。学生模型通常只在训练分布内接近教师，分布外会明显退化。教师数据如果有错，学生会稳定学错。\n\n### 大模型造数据训小模型\n流程通常是：定义任务和标签规范，采样真实或合成输入，让大模型生成答案和解释，自动或人工过滤低质样本，用小模型训练，再用独立测试集评估。关键是数据多样性、反例、边界样本和质量过滤。\n\n### 评估取舍\n不要只看平均准确率。要看长尾、分布外、格式合法率、拒答、低置信度转交、大模型兜底后的整体成本。小模型上线常配合路由：简单任务走小模型，复杂任务走大模型。\n\n### 具体例子\n假设一个系统每天要把大量用户反馈分成“登录、支付、性能、其他”。大模型能做，但成本高。可以让大模型先标注一批高质量样本，人工抽检后训练小模型。上线时小模型处理高置信度样本，低置信度样本再交给大模型。\n\n### 易错点\n蒸馏不是压缩整个通用智能。它更像把教师在某个任务分布上的行为迁移给学生。评测必须单独准备未参与造数的测试集，并重点看边界样本、长尾类别和教师也容易错的样本。\n","points":["蒸馏用教师模型输出训练学生模型。","大模型造数据是常见蒸馏路径。","小模型适合高频、稳定、边界清晰任务。","分布外和复杂任务退化要重点评估。","模型路由能平衡成本和效果。"],"interview":[{"q":"蒸馏和普通 SFT 有什么关系？","a":"蒸馏常用 SFT 形式训练学生模型，但训练数据来自教师模型而非完全人工标注。教师可以提供答案、步骤或概率分布。核心目标是让学生在目标任务上模仿教师。"},{"q":"如何判断是否值得做小模型？","a":"看任务是否高频、边界清晰、答案稳定、可自动评估。如果大模型成本高而小模型能达到可接受质量，并且有大模型兜底或置信度路由，就值得考虑。"},{"q":"蒸馏的主要风险是什么？","a":"教师错误会被放大，数据覆盖窄会导致模板化，学生在分布外退化明显。测试要包含困难集、反例和真实线上样本。"}],"quiz":[{"q":"小模型一定继承教师全部能力吗？","a":"不会，通常只在覆盖任务上接近。"},{"q":"蒸馏数据需要过滤吗？","a":"需要，否则会学到教师错误。"},{"q":"降本只能靠小模型吗？","a":"不是，还能用量化、缓存、路由和规则。"}],"related":["llm-pretrain","llm-sft-peft","llm-inference","agent-eval"]},{"id":"llm-multimodal","title":"多模态基础","summary":"视觉特征被投影后交给语言模型。","md":"\n### 一句话说清\n多模态大模型把图像、音频等非文本信号编码成向量，再和文本 token 一起交给语言模型理解和生成。\n\n### 典型结构\n图文模型常见结构是：视觉编码器 + 投影层 + LLM。视觉编码器把图片切成 patch，提取视觉特征；投影层把视觉特征映射到语言模型能接收的维度；LLM 结合图像 token 和文本问题生成答案。有些模型还会用跨模态注意力或专门的图文对齐训练。\n\n### 图文对齐\n图文对齐的目标是让“图片里的内容”和“文字描述”在表示空间里对应起来。训练数据可能包括图片-标题、图片-问答、OCR、图表说明等。对齐好，模型才能回答“图里有哪些元素”“这张 UI 截图哪里异常”“图表趋势是什么”。\n\n### 常见能力与限制\n多模态模型擅长看大意、识别明显对象、理解截图布局、提取部分文字、解释图表趋势。但它不是精确传感器。小字、坐标、计数、表格单元格、颜色差异、遮挡、低分辨率图像都容易出错。它可能“看见”不存在的按钮，也可能忽略禁用状态。\n\n### 一个测试例子\n给一张登录页截图，问“是否登录成功”。模型看到头像和首页可能说成功，但严格测试还应看 DOM、接口、URL、状态字段或页面读回。截图是证据之一，不是业务真相本身。\n\n### 面试取舍\n可以说：多模态扩展了 LLM 的感知入口，但关键结论仍要验证。UI 测试里，截图适合发现视觉现象；DOM 适合定位元素；接口和数据库适合确认业务状态。高风险场景要组合证据，而不是只相信看图回答。\n\n### 具体例子\n测试一个截图问答系统时，可以同时准备截图、标准 OCR 文本、DOM 节点和接口状态。模型说“按钮可点击”后，测试脚本再检查 DOM disabled 属性或真实点击结果。这样能把视觉理解和业务验证分开。\n\n### 易错点\n多模态回答常把“看起来像”说成“就是”。图表趋势、页面布局、物体类别可以辅助判断；金额、订单号、权限状态、提交结果这类关键结论，要用专门 OCR、接口或人工标注校验。\n","points":["典型图文模型包含视觉编码器、投影层和 LLM。","图文对齐让视觉表示和文本语义对应。","多模态擅长大意理解，但细节数字容易错。","UI 截图结论需要 DOM 或接口读回。","截图是证据之一，不是完整业务状态。"],"interview":[{"q":"图片信息如何进入 LLM？","a":"通常先由视觉编码器把图片转成视觉特征，再用投影层映射到语言模型维度，形成类似视觉 token 的表示。LLM 再结合视觉 token 和文本问题生成回答。"},{"q":"多模态模型为什么会看错数字和位置？","a":"图像被压缩成特征表示，训练目标更偏语义理解，不一定保留像素级细节。低分辨率、小字、表格、遮挡和相似元素都会增加错误。"},{"q":"如何测试 UI 截图理解能力？","a":"设计标题、按钮状态、错误文案、表格单元格、禁用态、干扰元素等用例。关键结论要用 DOM、接口或人工标注校验，不能只看模型描述。"}],"quiz":[{"q":"多模态看图是否等于精确 OCR？","a":"不等于，细节文本仍可能错。"},{"q":"视觉编码器的作用是什么？","a":"提取图像特征。"},{"q":"图文对齐解决什么？","a":"让图片内容和文字语义对应。"}],"related":["llm-token-embed","llm-eval-hallucination","agent-tools","agent-eval"]},{"id":"llm-eval-hallucination","title":"评测与幻觉","summary":"评测要看答案、证据、过程和稳定性。","md":"\n### 一句话说清\n大模型评测不是看一次回答顺不顺，而是判断答案是否正确、是否被证据支持、是否稳定、安全、可复现。\n\n### 常见评测维度\n事实问答看准确性和引用；代码生成看能否运行、单测、复杂度；摘要看覆盖率和忠实度；数学推理看最终答案和步骤；Agent 看工具调用、状态读回和任务完成。还要测格式合法率、延迟、成本、拒答、越权、安全和多轮一致性。\n\n### 基准类型\n通用基准通常覆盖知识、推理、数学、代码、多语言和安全。业务系统还需要自建评测集，因为公开基准不能代表你的真实输入分布。测试集要包含正常样本、边界样本、历史失败、对抗样本、无答案样本和冲突证据样本。\n\n### LLM-as-judge\n用模型当评审可以提高评测效率，适合开放答案、摘要质量、解释质量评分。但它会有偏差，可能偏好长答案、熟悉风格或同源模型。使用时要给明确 rubric，做少量人工校准，最好保留原始输入、候选输出、评分理由和人工抽检结果。\n\n### 幻觉成因\n幻觉来自多个层面：训练数据冲突、问题超出知识边界、上下文缺证据、RAG 召回错误、工具失败、解码随机、提示诱导、模型过度迎合。RAG 答错时要拆：正确证据没召回，是检索问题；证据召回了但回答错，是生成或提示问题；工具失败却说成功，是编排问题。\n\n### 缓解方式\n提供可靠证据、要求引用、工具读回、结构化输出校验、低风险解码、拒答策略、人工确认、持续回归和线上监控。测试结论要分层：模型能力、检索质量、工具执行、业务状态、最终表达，不能混成一个“通过”。\n\n### 具体例子\n一个 RAG 问答答错了，不要直接说模型差。先看正确文档是否进入召回 Top N；再看重排序是否把它排到前面；再看 prompt 是否把证据完整放入；最后看模型是否按证据回答。每层都有不同修复手段。\n\n### 易错点\n评测集不能只放正例。无答案、旧版本资料、相互冲突资料、诱导性问题、格式异常输入都要覆盖。否则系统会在演示问题上表现很好，在线上真实输入里频繁编造。\n","points":["评测维度包括准确性、忠实度、稳定性、安全和成本。","业务评测集要覆盖真实输入和历史失败。","LLM-as-judge 需要 rubric 和人工校准。","幻觉可能来自模型、检索、工具或编排。","证据读回比模型自报更可靠。"],"interview":[{"q":"如何检测幻觉？","a":"先定义事实来源或业务真值，再检查答案是否被证据支持。对 RAG 看引用是否匹配，对代码看测试是否通过，对 Agent 看工具结果和状态读回。语气自信不能当正确证据。"},{"q":"LLM-as-judge 有什么风险？","a":"评审模型可能偏向长答案、漂亮表达或同源模型，也可能被候选答案误导。要用明确评分标准、人工抽检和校准集控制偏差。"},{"q":"RAG 答错怎么定位？","a":"先看正确文档是否被召回。没召回是切分、索引、query 或重排问题；召回了仍答错，是生成、上下文拼接或冲突处理问题；工具失败被掩盖则是编排问题。"}],"quiz":[{"q":"答案流畅能证明没幻觉吗？","a":"不能。"},{"q":"公开基准能完全替代业务评测集吗？","a":"不能。"},{"q":"模型评审是否应抽样人工校准？","a":"应该。"}],"related":["llm-how","llm-decoding","agent-eval","agent-rag"]},{"id":"llm-handcode","title":"面试手撕代码","summary":"用小段 torch 代码串起核心算子。","md":"\n### 一句话说清\n手撕题不要求写工业级 LLM，而是要写出关键算子的形状、mask、训练目标和边界。\n\n### 多头注意力含 causal mask\n（需要安装 torch，示意代码）\n```python\nimport torch, math\n\ndef mha(x, wq, wk, wv, wo, heads):\n    b, n, d = x.shape\n    hdim = d // heads\n    q = (x @ wq).view(b, n, heads, hdim).transpose(1, 2)\n    k = (x @ wk).view(b, n, heads, hdim).transpose(1, 2)\n    v = (x @ wv).view(b, n, heads, hdim).transpose(1, 2)\n    score = q @ k.transpose(-2, -1) / math.sqrt(hdim)\n    mask = torch.triu(torch.ones(n, n, device=x.device), diagonal=1).bool()\n    score = score.masked_fill(mask, float(\"-inf\"))\n    out = torch.softmax(score, dim=-1) @ v\n    out = out.transpose(1, 2).contiguous().view(b, n, d)\n    return out @ wo\n```\n`q/k/v` 形状是 batch、head、seq、head_dim。上三角 mask 屏蔽未来位置。softmax 后加权汇总 value，再合并多头。\n\n### RMSNorm\n（需要安装 torch，示意代码）\n```python\ndef rmsnorm(x, weight, eps=1e-6):\n    scale = torch.rsqrt(x.pow(2).mean(dim=-1, keepdim=True) + eps)\n    return x * scale * weight\n```\nRMSNorm 不减均值，只按均方根缩放，`weight` 是可学习缩放参数。\n\n### RoPE\n（需要安装 torch，示意代码）\n```python\ndef apply_rope(x, cos, sin):\n    x1, x2 = x[..., ::2], x[..., 1::2]\n    y1 = x1 * cos - x2 * sin\n    y2 = x1 * sin + x2 * cos\n    return torch.stack((y1, y2), dim=-1).flatten(-2)\n```\nRoPE 把相邻维度当成二维平面旋转。不同位置用不同角度，位置关系会进入注意力分数。\n\n### LoRA 层\n（需要安装 torch，示意代码）\n```python\ndef lora_linear(x, base_w, a, b, alpha):\n    rank = a.shape[1]\n    delta = (x @ a @ b) * (alpha / rank)\n    return x @ base_w + delta\n```\n基础权重冻结，`a` 和 `b` 是低秩适配矩阵。rank 越大，表达越强，参数也越多。\n\n### Top-p 采样\n（需要安装 torch，示意代码）\n```python\ndef top_p_sample(logits, p=0.9):\n    probs = torch.softmax(logits, dim=-1)\n    sorted_probs, sorted_idx = torch.sort(probs, descending=True)\n    keep = torch.cumsum(sorted_probs, dim=-1) <= p\n    keep[..., 0] = True\n    filtered = torch.where(keep, sorted_probs, torch.zeros_like(sorted_probs))\n    filtered = filtered / filtered.sum(dim=-1, keepdim=True)\n    picked = torch.multinomial(filtered, 1)\n    return sorted_idx.gather(-1, picked)\n```\n先按概率排序，保留累计概率不超过 p 的核心集合，再归一化采样。\n\n### DPO loss\n（需要安装 torch，示意代码）\n```python\ndef dpo_loss(chosen_logp, rejected_logp, ref_chosen, ref_rejected, beta=0.1):\n    policy_gap = chosen_logp - rejected_logp\n    ref_gap = ref_chosen - ref_rejected\n    return -torch.logsigmoid(beta * (policy_gap - ref_gap)).mean()\n```\nDPO 让策略模型更偏好 chosen，而不是 rejected，同时用参考模型差值控制偏离。\n\n### 面试讲法\n先说输入输出形状，再说 mask 或归一化的目的，最后说工程边界：示意代码没处理 KV Cache、padding mask、混合精度和分布式。能讲清这些，比背一大段不可运行代码更重要。\n","points":["注意力手写要讲清 q/k/v 形状和 causal mask。","RMSNorm 用均方根缩放，不减均值。","RoPE 通过旋转把位置注入 Q/K。","LoRA 用低秩矩阵表示权重增量。","top-p 和 DPO 都要说明输入含义。"],"interview":[{"q":"手写多头注意力最容易漏什么？","a":"常漏 causal mask、head 维度转换和缩放项 sqrt(head_dim)。还要注意 mask 应在 softmax 前加到 score 上。输出要把多头合并回原维度。"},{"q":"RMSNorm 和 LayerNorm 主要区别是什么？","a":"LayerNorm 会减均值并除以标准差，RMSNorm 只按均方根缩放。RMSNorm 更简单，计算少一些，在大模型里很常见。"},{"q":"DPO loss 直观在优化什么？","a":"它提高模型给 chosen 回答的相对概率，降低 rejected 的相对概率，同时减去参考模型的偏好差，避免策略偏离过大。"}],"quiz":[{"q":"causal mask 应该在 softmax 前还是后？","a":"前。"},{"q":"LoRA 训练时基础权重通常冻结吗？","a":"通常冻结。"},{"q":"top-p 是否固定保留 k 个 token？","a":"不是，候选数随累计概率变化。"}],"related":["llm-transformer","llm-decoding","llm-sft-peft","llm-alignment"]}]},{"id":"agent","name":"Agent 原理","blurb":"从模型、工具、上下文和循环理解 Agent 的工程化原理。","sections":[{"id":"agent-what","title":"Agent 是什么","summary":"Agent 是模型、工具和循环组成的执行系统。","md":"\n### 一句话说清\nAgent 不是一个更会聊天的模型，而是“模型 + 工具 + 状态 + 控制循环”的系统，用来围绕目标持续决策和行动。\n\n### 为什么需要 Agent\n普通问答通常是一轮输入、一轮输出。很多真实任务不是这样：查资料、改代码、跑测试、读失败日志、重新修复、写报告，都需要多步行动。Agent 的价值是让模型不只生成答案，还能判断下一步、调用工具、观察结果，再继续推进。\n\n### 基本循环\n典型循环是：接收目标，理解当前状态，选择动作，调用工具，观察返回，更新状态，判断是否完成。可以把它类比成带启发式的搜索程序。目标是终止条件，工具是动作集合，观察是状态转移，模型负责在不确定状态里选下一步。\n\n### Agent vs Workflow\nWorkflow 是预先编排好的流程，步骤和分支相对固定，稳定、可测、成本可控。Agent 允许模型动态选择行动，更灵活，但也更难预测。能用规则和 workflow 稳定解决的任务，不一定需要 Agent。比如固定“拉取数据、生成日报、发送通知”更像 workflow；“根据未知失败日志定位原因并尝试修复”更像 Agent。\n\n### 什么时候不需要 Agent\n任务步骤固定、风险高、答案可由 SQL 或规则直接算出、输入输出结构很明确时，优先用传统程序。Agent 适合信息不完整、路径不确定、需要工具探索、需要自然语言理解的任务。\n\n### 测试视角\n测试 Agent 不能只看最终回复。要看目标是否完成、工具是否选对、参数是否正确、失败是否如实报告、是否越权、是否有证据读回。一个可信 Agent 应能说明自己做了什么、得到什么证据、哪些仍未验证。\n\n### 具体例子\n让系统“解释二分查找”通常不需要 Agent，一次问答足够。让系统“定位这个仓库里导致某测试失败的原因并提交修复建议”，就需要读文件、跑测试、分析失败、再迭代，更接近 Agent。\n","points":["Agent 由模型、工具、状态和控制循环组成。","Agent 适合路径不确定的多步任务。","Workflow 更固定、更稳定，Agent 更灵活但更难测。","能用规则解决时不必强上 Agent。","质量评估要看过程证据和最终状态。"],"interview":[{"q":"Agent 和普通 Chatbot 有什么区别？","a":"Chatbot 通常重点是对话回答；Agent 面向目标，会拆任务、调用工具、观察结果、更新状态并继续行动。大模型只是 Agent 的决策组件之一。"},{"q":"Agent 和 Workflow 怎么区分？","a":"Workflow 的步骤基本固定，模型最多填槽或生成局部内容；Agent 允许模型动态决定下一步。稳定重复任务优先 workflow，开放探索任务才更适合 Agent。"},{"q":"什么时候不应该用 Agent？","a":"如果任务可用确定性程序、SQL、规则或固定流程可靠完成，就不需要 Agent。高风险写操作、强一致业务也要谨慎，至少需要确认、审计和回滚。"}],"quiz":[{"q":"Agent 的核心是模型本身吗？","a":"不是，是模型与工具、状态、循环的组合。"},{"q":"步骤固定的批处理任务一定需要 Agent 吗？","a":"不一定，workflow 更合适。"},{"q":"Agent 成功能否只看最终文本？","a":"不能，还要看证据和状态。"}],"related":["agent-reasoning","agent-tools","agent-eval"]},{"id":"agent-reasoning","title":"推理与规划范式","summary":"规划决定 Agent 如何拆解和推进任务。","md":"\n### 一句话说清\nAgent 推理负责判断下一步做什么，规划负责把目标拆成可执行路径，并在观察结果变化时调整。\n\n### CoT\nCoT 是 Chain of Thought，强调让模型分步骤思考。它对数学、逻辑和多约束问题有帮助，但工程里不一定要把完整思考暴露给用户。更重要的是让模型输出可执行计划、关键假设和验证点。\n\n### ReAct\nReAct 把 Reasoning 和 Acting 交替起来：先判断下一步，再调用工具，再观察，再继续判断。它适合信息不完整的任务。例如定位测试失败：先读日志，再搜代码，再改文件，再跑测试。每一步都被新证据影响。\n\n### Plan-and-Execute\nPlan-and-Execute 先生成整体计划，再按步骤执行。优点是结构清楚，适合长任务；缺点是初始计划可能错，所以执行中要允许修订。计划太粗会失控，太细会成本高。\n\n### Reflexion 与任务分解\nReflexion 是让 Agent 根据失败轨迹总结经验并重试。它不能变成无限自我解释，必须基于新证据。任务分解则把复杂目标拆成子任务，比如“读需求、改代码、补测试、验证、总结”。子任务要有输入、输出和完成标准。\n\n### 终止条件\nAgent 最怕无效循环。工程上要设置最大步数、最大重试、成本预算、阻塞状态和人工接管。完成、失败、阻塞、需要用户输入，要有不同结论。\n\n### 测试视角\n测试规划要看：计划是否覆盖前置条件；行动是否遵守计划；观察是否改变后续动作；失败是否停止而不是编造。轨迹比漂亮总结更能说明 Agent 是否可靠。\n\n### 具体例子\n一个 ReAct 轨迹可以是：观察失败日志，判断可能是参数为空；调用搜索工具找函数；读到校验逻辑；修改测试数据；运行单测；根据结果决定完成或继续。每一步都应由上一步证据触发。\n\n### 易错点\n不要把“模型写了一个计划”当成规划成功。计划必须能落到工具动作和验证点。若执行结果推翻了计划，Agent 应修改计划，而不是继续按旧路线硬走。\n","points":["CoT 强调分步骤思考，但不等于无限输出思考。","ReAct 让推理、行动、观察交替进行。","Plan-and-Execute 适合长任务，但计划要可修订。","Reflexion 应基于失败证据改进。","终止条件能防止 Agent 无效循环。"],"interview":[{"q":"ReAct 解决什么问题？","a":"它让 Agent 在不确定环境中边行动边获取信息。模型先决定下一步，工具返回观察，再基于观察更新判断。这样比一次性闭门造车更适合真实任务。"},{"q":"Plan-and-Execute 的风险是什么？","a":"初始计划可能基于错误假设。若执行时不更新计划，后续步骤会一路错下去。工程上要记录观察、允许重规划，并设置终止条件。"},{"q":"反思机制为什么不能无限重试？","a":"重试有成本，也可能造成副作用。反思必须基于新的失败证据，并受最大次数、风险等级和人工接管规则约束。"}],"quiz":[{"q":"推理链越长一定越好吗？","a":"不一定，会增加成本和错误传播。"},{"q":"Agent 工具失败后应继续声称成功吗？","a":"不应该，应更新状态或报告失败。"},{"q":"计划执行中能否重规划？","a":"应该允许基于证据重规划。"}],"related":["agent-what","agent-tools","agent-coding-loop","agent-eval"]},{"id":"agent-tools","title":"工具调用与工具设计","summary":"工具让 Agent 连接真实环境。","md":"\n### 一句话说清\n工具调用把模型的语言决策变成外部动作，工具设计决定 Agent 是否可控、可测、可恢复。\n\n### Function calling 原理\n模型不直接执行函数，而是输出结构化调用意图：工具名和参数。运行时根据 JSON Schema 校验参数，真正执行函数，再把返回结果放回上下文。模型随后基于结果决定下一步。这个过程把自然语言意图转成可审计 API 调用。\n\n### JSON Schema\nSchema 要写清字段类型、必填项、枚举、默认值、范围和含义。模糊参数会导致模型瞎填。比如 `action` 应限制为 `create/update/delete`，危险操作要有确认字段。返回值也要结构化，包含状态、数据、错误码和可读说明。\n\n### 工具描述怎么写\n描述要说明工具做什么、什么时候用、什么时候不用、输入限制、输出含义和副作用。不要把多个能力混在一个“万能工具”里。工具越清晰，模型越容易选对；工具越重叠，越容易误调用。\n\n### 错误信息可行动\n错误不能只写“失败”。要区分参数错误、权限不足、资源不存在、超时、执行中、业务校验失败。可行动错误会告诉 Agent 是重试、改参数、请求授权、停止，还是读回状态。\n\n### 返回精简和危险确认\n工具返回要精简，给模型决策所需字段，不要塞整页日志污染上下文。读操作可自动化，写操作要控制副作用，删除、支付、部署、批量修改等危险操作要确认、审计和回滚策略。\n\n### 测试重点\n工具调用要测参数构造、schema 校验、失败分类、幂等性、重试、副作用和读回。HTTP 200 不等于业务成功，必须看业务字段和持久化状态。\n\n### 具体例子\n一个查询订单工具应返回 order_id、status、updated_at、error_code，而不是一大段自然语言。一个取消订单工具应要求 reason 和 confirm 字段，并返回读回后的最终状态。这样 Agent 才能判断下一步。\n","points":["function calling 输出工具名和结构化参数。","JSON Schema 限制参数类型、枚举和必填字段。","工具描述要说明用途、限制和副作用。","错误信息要能指导 Agent 下一步。","危险操作需要确认、审计和读回。"],"interview":[{"q":"工具调用为什么需要 schema？","a":"schema 能约束参数结构，减少模型自由编参数。运行时可以校验类型、必填和枚举，避免错误调用进入真实系统。它也是测试工具契约的基础。"},{"q":"好的工具错误信息应该怎样？","a":"应该可行动，明确是参数错、权限不足、资源不存在、超时还是业务失败。不同错误对应不同恢复策略，不能都返回“失败”。"},{"q":"工具返回 HTTP 200 就算成功吗？","a":"不算。HTTP 200 只说明接口层可能正常，还要看业务状态、错误码、持久化读回和目标对象是否真的变化。"}],"quiz":[{"q":"工具描述越泛越好吗？","a":"不好，会增加误调用。"},{"q":"删除类工具是否应自动随意调用？","a":"不应，需要确认和权限控制。"},{"q":"返回大量无关日志有什么风险？","a":"污染上下文并增加成本。"}],"related":["agent-what","agent-protocols","agent-safety","llm-decoding"]},{"id":"agent-context","title":"上下文工程","summary":"上下文工程决定模型看见什么和相信什么。","md":"\n### 一句话说清\n上下文工程是在有限窗口里选择、组织和隔离信息，让 Agent 看到必要事实，又不被噪声和恶意内容带偏。\n\n### 什么进上下文\n系统规则、用户目标、当前计划、关键历史、工具结果、检索证据、错误摘要、待办状态可以进上下文。无关日志、重复对话、过期观察、超长文档不应原样塞入。上下文不是越多越好，而是足够、准确、分层。\n\n### 预加载 vs 按需检索\n预加载适合小而稳定的规则，比如输出格式、权限边界、任务目标。按需检索适合大而变化的知识，比如文档、代码库、历史案例。预加载太多会挤占窗口；按需检索质量差会漏证据。实际系统常组合使用。\n\n### 压缩和摘要\n长任务需要摘要历史轨迹：已完成什么、失败什么、证据在哪里、当前阻塞什么。摘要要保留关键约束和结论来源，不能把未验证内容写成已完成。结构化状态比自然语言流水账更可靠。\n\n### 上下文腐化\n腐化指上下文被无关、过期、错误或恶意信息污染。外部网页、文档、日志可能包含提示注入，例如“忽略系统规则”。这些内容只能作为数据，不能提升为指令。还要避免旧失败日志在修复后继续误导模型。\n\n### 子代理隔离\n复杂任务可把子任务交给子代理，但上下文要隔离。子代理只拿必要信息和明确输出契约，避免把整个主上下文复制过去。这样能降低污染、泄露和互相干扰。\n\n### 测试视角\n构造长历史、冲突证据、恶意文档、过期状态和截断场景，观察 Agent 是否仍遵守高优先级规则、使用最新证据、如实标注不确定项。\n\n### 具体例子\n长任务摘要可以写成结构化状态：目标是什么、已完成哪些文件阅读、哪些测试失败、失败证据路径、下一步计划。不要只写“前面处理了一些问题”。后者对续跑几乎没有帮助。\n\n### 易错点\n上下文里同一事实出现多个版本时，Agent 往往会混淆。应明确最新证据、来源和时间。测试时故意放入旧结论和新读回，检查 Agent 是否以新读回为准。\n","points":["上下文应只放与任务相关且可信的信息。","预加载适合稳定规则，按需检索适合大知识库。","摘要要保留证据来源和未验证项。","上下文腐化会导致遗忘、误用和提示注入。","子代理隔离能减少污染和泄露。"],"interview":[{"q":"上下文窗口限制会带来什么问题？","a":"关键信息可能被截断或被噪声稀释，模型会忘记目标、重复操作或使用过期事实。长任务需要摘要、结构化状态和按需检索。"},{"q":"如何降低上下文腐化？","a":"区分信息来源和优先级，外部内容只当数据；过滤无关信息；定期摘要；关键状态结构化；对旧观察标注时间和阶段。"},{"q":"为什么子代理要上下文隔离？","a":"不同子任务需要的信息不同。隔离能降低敏感信息扩散、减少无关噪声，也让子代理输出更容易验收。"}],"quiz":[{"q":"把所有历史原样塞给模型一定好吗？","a":"不一定，会增加噪声和成本。"},{"q":"外部文档中的指令能覆盖系统规则吗？","a":"不能，只能作为数据。"},{"q":"摘要能否把推测写成事实？","a":"不能。"}],"related":["agent-memory","agent-rag","agent-safety","llm-position"]},{"id":"agent-memory","title":"记忆","summary":"记忆让 Agent 跨任务复用可信经验。","md":"\n### 一句话说清\n记忆是可跨步骤或跨会话保存的信息，但只有经过筛选、授权和验证的信息才值得长期保存。\n\n### 短期和长期\n短期记忆服务当前任务，如当前计划、已尝试方案、失败日志摘要、待验证项。长期记忆服务未来任务，如用户偏好、项目约定、常用命令、历史故障经验。短期记忆更新频繁，长期记忆要谨慎写入。\n\n### 语义、情景、程序性记忆\n语义记忆是事实和概念，比如某系统使用某种配置格式。情景记忆是经历，比如上次某类任务在哪一步失败。程序性记忆是做事方法，比如修复后要先跑最小测试再扩大范围。不同记忆检索方式不同，可信度也不同。\n\n### 何时写入\n应写入用户明确偏好、工具验证过的事实、反复出现的稳定经验、可复用流程。不要写入模型猜测、临时状态、敏感信息、未验证结论。每条记忆最好有来源、时间、适用范围、置信度和失效条件。\n\n### 如何检索\n可以用关键词、标签、向量相似度或任务类型召回，再筛选最相关的几条进入上下文。召回时要标注“这是历史记忆，可能过期”。关键决策前要用当前证据确认。\n\n### 记忆风险\n错误记忆会长期污染后续任务；过期记忆会把旧事实当新事实；敏感记忆会带来隐私和安全风险；过多记忆会干扰上下文。测试要覆盖写入、召回、更新、删除、冲突和敏感过滤。\n\n### 面试表达\n记忆不是“什么都记”。好的记忆系统有准入规则、检索规则和失效机制。它提升效率，但不能替代实时读回和事实校验。\n\n### 具体例子\n用户明确说“报告以后用 Markdown 表格”，可以写偏好记忆；工具验证“某项目测试命令是 pytest tests/unit”，可以写项目记忆。模型猜测“这个项目大概用某框架”，不能写长期记忆。\n\n### 易错点\n记忆召回不是越多越好。召回十条相似但过期的经验，可能比没有记忆更糟。好的系统会给记忆打标签、标时间、限制适用范围，并允许新证据覆盖旧记忆。\n","points":["短期记忆服务当前任务，长期记忆服务跨任务复用。","语义、情景、程序性记忆关注不同内容。","写入记忆要有来源、范围和失效条件。","召回记忆要做相关性和时效判断。","错误记忆会长期污染 Agent 行为。"],"interview":[{"q":"记忆和上下文有什么区别？","a":"上下文是当前模型调用能看到的信息；记忆是持久保存、按需召回的信息。记忆进入上下文前应经过相关性、权限和时效判断。"},{"q":"长期记忆为什么不能随便写？","a":"错误、过期或敏感信息一旦写入，会在未来任务反复影响决策。长期记忆应基于用户明确说明或工具验证事实，并有适用范围。"},{"q":"如何测试记忆系统？","a":"设计写入、召回、更新、冲突、过期和删除场景。还要测敏感信息是否被拒绝保存，旧记忆是否会被新证据覆盖。"}],"quiz":[{"q":"模型猜测能直接写入长期记忆吗？","a":"不应该。"},{"q":"召回记忆是否需要考虑时效？","a":"需要。"},{"q":"程序性记忆记录什么？","a":"做事方法或流程经验。"}],"related":["agent-context","agent-rag","agent-safety","agent-eval"]},{"id":"agent-rag","title":"RAG 与知识库","summary":"RAG 用检索证据增强生成。","md":"\n### 一句话说清\nRAG 先从知识库检索相关资料，再让模型基于资料回答，用外部证据降低幻觉。\n\n### 切分与索引\n文档要先清洗和切分。切太小会丢上下文，切太大召回不准且浪费窗口。代码、表格、标题层级、FAQ、日志要用不同切分策略。切分后可建立向量索引、关键词索引或两者结合。\n\n### 向量检索 vs BM25\n向量检索擅长语义相似，比如“报错无法登录”和“认证失败”能匹配。BM25 擅长关键词、编号、错误码、函数名、版本号。混合检索常更稳：先用向量和 BM25 各召回一批，再合并去重。\n\n### 重排序和引用\n初召回可能噪声多，重排序模型会根据 query 和片段相关性重新打分，把最有用的证据放前面。回答时应带引用或来源，关键结论要能回到片段。引用不是装饰，而是可测试证据。\n\n### 评测召回\nRAG 评测至少拆两层：召回是否拿到正确证据，生成是否忠实使用证据。召回率看正确片段有没有进入候选；精排看是否排到前面；生成看答案是否被证据支持。无答案问题要能拒答。\n\n### 常见失败\n切分破坏语义；索引过期；query 改写丢条件；召回相似但无答案；多个版本冲突；上下文太长被忽略；模型把资料外内容补出来。\n\n### GraphRAG 简介\nGraphRAG 会把实体和关系构成图，再结合图检索与生成。它适合复杂关系、多跳问题和知识网络，但构建和维护成本更高。不是所有知识库都需要图。\n\n### 具体例子\n用户问“错误 E123 怎么处理”。向量检索可能找到“认证错误处理指南”，BM25 能精确命中 E123。混合检索把两类结果合并，再重排序，通常比单一路径更稳。\n\n### 易错点\nRAG 的 PASS 不能只看最终答案。若答案正确但引用错文档，后续维护会很危险。测试报告应记录 query、召回片段、排序、最终引用和答案字段，方便定位是哪一层坏了。\n","points":["切分策略直接影响召回质量。","向量检索擅长语义，BM25 擅长关键词和编号。","混合检索加重排序通常更稳。","引用用于证明答案来源。","RAG 要分别评估召回和生成忠实度。"],"interview":[{"q":"RAG 为什么能降低幻觉？","a":"它把外部证据放进上下文，让模型少依赖参数记忆。但前提是检索到相关、可信、最新的资料，并且模型忠实使用。"},{"q":"向量检索和 BM25 怎么取舍？","a":"向量适合语义相近但词不同的问题；BM25 适合错误码、函数名、版本号等精确词。工程上常用混合检索，再用重排序提高质量。"},{"q":"如何评测 RAG？","a":"先看正确证据是否被召回，再看是否排在前面，最后看生成答案是否被证据支持。还要测无答案拒答、冲突资料和引用一致性。"}],"quiz":[{"q":"用了向量数据库就一定是高质量 RAG 吗？","a":"不是，还要看切分、召回、重排和生成。"},{"q":"错误码检索只用向量一定最好吗？","a":"不一定，BM25 往往更稳。"},{"q":"RAG 无答案时应该怎么做？","a":"承认没有足够证据，而不是编造。"}],"related":["agent-context","agent-memory","llm-eval-hallucination","agent-eval"]},{"id":"agent-protocols","title":"MCP、Skills 与 A2A","summary":"协议和技能让 Agent 生态可连接。","md":"\n### 一句话说清\nMCP 解决模型应用接工具和资源的问题，Skills 解决能力按需加载的问题，A2A 解决 Agent 之间协作通信的问题。\n\n### MCP 解决什么\nMCP 可以理解成模型应用和外部能力之间的标准连接方式。典型结构有 client、server、tools、resources。Client 是使用能力的一方，server 暴露能力；tools 是可调用动作，比如查询、写入、执行；resources 是可读取资料，比如文件、文档、上下文数据。好处是工具发现、参数 schema、返回格式和权限边界更统一。\n\n### Skills 解决什么\nSkills 是把某类任务的操作说明、脚本、模板、示例按需加载。它不是每次都把所有知识塞进上下文，而是在任务触发时加载相关能力。渐进式加载能节省上下文，也能让复杂工具使用规范化。比如“处理电子表格”触发 spreadsheet skill，“写浏览器自动化”触发 browser skill。\n\n### A2A 解决什么\nA2A 是 Agent 之间的协议思路，关注任务委派、消息格式、状态回传、证据附件和责任边界。一个 Agent 可以把子任务交给另一个 Agent，再接收结果和证据。它适合多角色协作，但必须避免“下游说完成，上游不验证”。\n\n### 三者区别\nMCP 更偏工具和资源连接；Skills 更偏把操作知识模块化加载；A2A 更偏 Agent 之间通信与协作。它们可以组合：一个 Agent 加载某个 Skill，通过 MCP 调工具，再通过 A2A 把子任务交给另一个 Agent。\n\n### 测试重点\n测能力发现是否准确，schema 是否与真实行为一致，权限是否生效，错误语义是否清晰，版本是否兼容，超时和取消是否可处理。多 Agent 还要测状态枚举、证据绑定和责任边界。\n\n### 易错点\n协议不是把自然语言换成 JSON 就结束。还要约定取消、超时、部分结果、重复请求、版本兼容和鉴权失败。否则系统在正常演示中没问题，一遇到异常就会卡住或误判完成。\n","points":["MCP 关注 client/server、工具和资源连接。","Skills 通过按需加载降低上下文压力。","A2A 关注 Agent 之间的任务通信。","三者可组合但解决的问题不同。","协议测试要覆盖 schema、权限、错误和状态。"],"interview":[{"q":"MCP 的核心概念有哪些？","a":"可以从 client、server、tools、resources 讲。Client 请求能力，server 暴露工具和资源，工具执行动作，资源提供可读上下文。关键是标准化发现、调用和返回。"},{"q":"Skills 和普通 prompt 有什么区别？","a":"Skill 是可复用能力包，包含说明、脚本、模板或示例，并按任务渐进加载。它比把所有规则写进一个巨大 prompt 更省上下文、更容易维护。"},{"q":"A2A 为什么需要协议？","a":"Agent 之间委派任务时，要明确输入、输出、状态、证据、错误和责任边界。否则容易重复执行、误报完成或无法追踪问题。"}],"quiz":[{"q":"MCP 只包含工具吗？","a":"不只，还可以包含资源等能力。"},{"q":"Skills 是否应该全部常驻上下文？","a":"不应该，按需加载更好。"},{"q":"A2A 下游结果需要验收吗？","a":"需要，上游不能盲信。"}],"related":["agent-tools","agent-multi","agent-safety","agent-context"]},{"id":"agent-multi","title":"多 Agent 协作","summary":"多 Agent 用分工换并行
