<script>
// 外观：在绘制前定好配色和深浅，避免先闪一下默认颜色
(function () {
  var d = document.documentElement, mq = window.matchMedia && matchMedia("(prefers-color-scheme: dark)");
  function cfg() { try { return JSON.parse(localStorage.getItem("tiyan:theme") || "{}") || {}; } catch (e) { return {}; } }
  window.applyTheme = function () {
    var t = cfg(), mode = t.mode || "system", dark = mode === "dark" || (mode === "system" && mq && mq.matches);
    d.setAttribute("data-palette", t.palette || "violet");
    d.setAttribute("data-theme", dark ? "dark" : "light");
    var m = document.getElementById("theme-color");
    if (m) m.setAttribute("content", getComputedStyle(d).getPropertyValue("--paper").trim() || (dark ? "#0C0D12" : "#F6F6FA"));
  };
  window.applyTheme();
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if ((cfg().mode || "system") === "system") window.applyTheme(); });
})();
</script>
